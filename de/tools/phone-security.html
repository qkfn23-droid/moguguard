    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}

        .checklist{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:24px;margin-bottom:24px}
        .check-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;transition:background .2s}
        .check-item:last-child{border-bottom:none}

        .risk-mid{background:rgba(255,152,0,0.15);color:#ff9800}

        .result-box{display:none;text-align:center;background:#111;border:1px solid #00ff4130;border-radius:8px;padding:30px;margin-bottom:20px}

<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>📱 내 폰 보안 점수</h2>
        <p>해당하는 항목을 체크하세요</p>
    </div>

    <div class="checklist">
        <div class="check-item"><input type="checkbox" id="c1" onchange="calc()"><label for="c1"><strong>화면 잠금</strong>을 PIN/패턴/생체인식으로 설정했다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c2" onchange="calc()"><label for="c2"><strong>OS 업데이트</strong>를 최신 버전으로 유지하고 있다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c3" onchange="calc()"><label for="c3"><strong>앱 자동 업데이트</strong>가 켜져 있다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c4" onchange="calc()"><label for="c4">공식 앱스토어(구글플레이/앱스토어)에서만 앱을 설치한다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c5" onchange="calc()"><label for="c5"><strong>출처를 알 수 없는 앱 설치</strong>가 차단되어 있다 (안드로이드)</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c6" onchange="calc()"><label for="c6">사용하지 않는 앱의 <strong>카메라/마이크/위치 권한</strong>을 해제했다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c7" onchange="calc()"><label for="c7"><strong>공용 와이파이</strong>에서 은행/결제 앱을 사용하지 않는다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c8" onchange="calc()"><label for="c8"><strong>블루투스</strong>를 사용하지 않을 때는 꺼둔다</label><span class="risk risk-low">권장</span></div>
        <div class="check-item"><input type="checkbox" id="c9" onchange="calc()"><label for="c9"><strong>2단계 인증(2FA)</strong>을 주요 계정에 설정했다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c10" onchange="calc()"><label for="c10"><strong>SIM 카드 PIN</strong>을 설정했다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c11" onchange="calc()"><label for="c11"><strong>분실 시 원격 잠금/삭제</strong> 기능(Find My)을 활성화했다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c12" onchange="calc()"><label for="c12">문자/카톡으로 온 <strong>의심스러운 링크</strong>를 클릭하지 않는다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c13" onchange="calc()"><label for="c13"><strong>클라우드 백업</strong>을 정기적으로 하고 있다</label><span class="risk risk-low">권장</span></div>
        <div class="check-item"><input type="checkbox" id="c14" onchange="calc()"><label for="c14">잠금화면에서 <strong>알림 미리보기</strong>를 숨겼다</label><span class="risk risk-low">권장</span></div>
        <div class="check-item"><input type="checkbox" id="c15" onchange="calc()"><label for="c15"><strong>자동 잠금 시간</strong>을 30초~1분으로 설정했다</label><span class="risk risk-mid">중요</span></div>
    </div>

    <button class="calc-btn" onclick="showResult()">📱 보안 점수 확인</button>

    <div class="result-box" id="resultBox">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
        <div class="score-grade" id="scoreGrade"></div>
    </div>

    <div class="tips" id="tips">
        <div class="tips-title">⚠️ 체크하지 않은 항목</div>
        <div class="tips-text" id="tipsText"></div>
    </div>

    <div class="disclaimer">📱 자가진단 체크리스트입니다. 실제 보안 상태는 추가 요소에 의해 달라질 수 있습니다.</div>
</div>

<footer>© 2025 MOGU Guard</footer>

<script>
const labels = [
    "화면 잠금을 PIN/패턴/생체인식으로 설정",
    "OS를 최신 버전으로 업데이트",
    "앱 자동 업데이트 활성화",
    "공식 앱스토어에서만 앱 설치",
    "출처를 알 수 없는 앱 설치 차단",
    "불필요한 앱 권한(카메라/마이크/위치) 해제",
    "공용 와이파이에서 금융 앱 사용 금지",
    "사용하지 않을 때 블루투스 끄기",
    "주요 계정에 2단계 인증 설정",
    "SIM 카드 PIN 설정",
    "분실 시 원격 잠금/삭제 활성화",
    "의심스러운 링크 클릭하지 않기",
    "클라우드 백업 정기적으로 하기",
    "잠금화면 알림 미리보기 숨기기",
    "자동 잠금 시간 30초~1분으로 설정"
];

function calc() {}

function showResult() {
    let checked = 0;
    let unchecked = [];
    for (let i = 1; i <= 15; i++) {
        if (document.getElementById('c'+i).checked) checked++;
        else unchecked.push(labels[i-1]);
    }
    const score = Math.round((checked / 15) * 100);
    let grade, color;
    if (score >= 90) { grade = '🟢 매우 안전! 보안 의식이 뛰어납니다.'; color = '#00ff41'; }
    else if (score >= 70) { grade = '🟡 양호. 몇 가지 개선하면 더 안전합니다.'; color = '#ffeb3b'; }
    else if (score >= 50) { grade = '🟠 주의 필요. 중요한 보안 설정이 빠져있습니다.'; color = '#ff9800'; }
    else { grade = '🔴 위험! 즉시 보안 설정을 강화하세요.'; color = '#ff5252'; }

    document.getElementById('scoreNum').textContent = score + '점';
    document.getElementById('scoreNum').style.color = color;
    document.getElementById('scoreFill').style.width = score + '%';
    document.getElementById('scoreFill').style.background = color;
    document.getElementById('scoreGrade').textContent = grade;
    document.getElementById('scoreGrade').style.color = color;
    document.getElementById('resultBox').style.display = 'block';

    if (unchecked.length > 0) {
        document.getElementById('tipsText').innerHTML = unchecked.map(t => '• <strong>' + t + '</strong>').join('<br>');
        document.getElementById('tips').style.display = 'block';
    } else {
        document.getElementById('tips').style.display = 'none';
    }

    document.getElementById('resultBox').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
