let currentQ = 0;
let score = 0;

function showQuestion() {
    if (currentQ >= QUESTIONS.length) { showResult(); return; }
    const q = QUESTIONS[currentQ];
    const pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `문제 ${currentQ + 1} / ${QUESTIONS.length}`;

    document.getElementById('quizSection').innerHTML = `
        <div class="email-card">
            <div class="email-header">
                <div class="email-from">보낸 사람: <strong>${q.fromName}</strong> &lt;${q.from}&gt;</div>
                <div class="email-subject">${q.subject}</div>
                <div class="email-to">받는 사람: ${q.to}</div>
            </div>
            <div class="email-body">${q.body}</div>
            <div class="btn-row">
                <div class="btn-real" onclick="answer('real')">✅ 진짜 메일</div>
                <div class="btn-phishing" onclick="answer('phishing')">🎣 피싱!</div>
            </div>
            <div class="explanation" id="explanation"></div>
        </div>
    `;
}

function answer(choice) {
    const q = QUESTIONS[currentQ];
    const correct = choice === q.answer;
    if (correct) score++;

    const el = document.getElementById('explanation');
    el.className = 'explanation ' + (correct ? 'correct' : 'wrong');
    el.innerHTML = `<strong>${correct ? '✅ 정답!' : '❌ 틀렸습니다!'}</strong> (${q.answer === 'phishing' ? '이것은 피싱입니다' : '이것은 진짜 메일입니다'})<br><br>${q.explain}`;
    el.style.display = 'block';

    document.querySelectorAll('.btn-real,.btn-phishing').forEach(b => { b.style.pointerEvents = 'none'; b.style.opacity = '0.5'; });

    setTimeout(() => { currentQ++; showQuestion(); }, 3000);
}

function showResult() {
    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = '완료!';

    let grade, gradeColor, gradeText;
    if (score >= 9) { grade = 'S'; gradeColor = '#00e676'; gradeText = '피싱 마스터! 해커도 당신을 속일 수 없습니다.'; }
    else if (score >= 7) { grade = 'A'; gradeColor = '#00e676'; gradeText = '훌륭합니다! 대부분의 피싱을 구별할 수 있습니다.'; }
    else if (score >= 5) { grade = 'B'; gradeColor = '#ffeb3b'; gradeText = '보통입니다. 피싱 판별 능력을 더 키워보세요.'; }
    else if (score >= 3) { grade = 'C'; gradeColor = '#ff9800'; gradeText = '위험합니다! 피싱에 속을 가능성이 높습니다.'; }
    else { grade = 'F'; gradeColor = '#ff5252'; gradeText = '매우 위험! 피싱 교육이 시급합니다.'; }

    const section = document.getElementById('resultSection');
    section.innerHTML = `
        <div class="result-score" style="color:${gradeColor};">${score} / ${QUESTIONS.length}</div>
        <div class="result-grade" style="color:${gradeColor};">등급: ${grade}</div>
        <div class="result-text">${gradeText}</div>
        <button class="retry-btn" onclick="location.reload()">🔄 다시 도전하기</button>

        <div class="tips-card" style="margin-top:24px;">
            <div class="tips-title">🎣 피싱 판별 5가지 핵심</div>
            <div class="tips-text">
                <strong>1. 발신자 주소 확인</strong> — 도메인이 공식 사이트와 다르면 피싱 (amaz0n, paypa1 등)<br>
                <strong>2. 긴급성 강조</strong> — "24시간 이내", "즉시", "영구 삭제" 같은 위협은 피싱의 특징<br>
                <strong>3. 개인정보 요구</strong> — 이메일로 비밀번호, 주민번호, 카드번호를 요구하면 100% 피싱<br>
                <strong>4. 링크 확인</strong> — 링크 위에 마우스를 올려 실제 URL이 공식 사이트인지 확인<br>
