<!DOCTYPE html>

<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smishing Quiz - Spot Fake Text Messages | MOGU Guard</title>
    <meta name="description" content="Can you spot a smishing text? Test your SMS scam detection skills with 10 real-world scenarios.">
    <link rel="canonical" href="https://moguguard.com/en/tools/smishing-quiz.html">
    <meta property="og:title" content="Smishing Quiz | MOGU Guard">
    <meta property="og:description" content="Can you spot a fake text message? Take the 10-question test!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://moguguard.com/en/tools/smishing-quiz.html">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .sms-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:24px;margin-bottom:20px}
        .sms-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1a1a1a}
        .sms-icon{font-size:28px}.sms-from{font-size:14px;color:#888}.sms-from strong{color:#e0e0e0}
        .sms-body{background:#0f0f0f;border-radius:8px;padding:16px;font-size:14px;color:#ccc;line-height:1.7;margin-bottom:16px}
        .sms-body .link{color:#4fc3f7;text-decoration:underline}
        .sms-body .highlight{color:#ff9800;font-weight:600}
        .btn-row{display:flex;gap:12px}
        .btn-real,.btn-smish{flex:1;padding:14px;border:2px solid;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
        .btn-real{border-color:#00ff41;color:#00ff41;background:rgba(0,255,65,0.06)}.btn-real:hover{background:rgba(0,255,65,0.15)}
        .btn-smish{border-color:#ff5252;color:#ff5252;background:rgba(255,82,82,0.06)}.btn-smish:hover{background:rgba(255,82,82,0.15)}
        .explain{display:none;margin-top:16px;padding:16px;border-radius:10px;font-size:14px;line-height:1.7}
        .explain.correct{background:rgba(0,255,65,0.1);border:1px solid rgba(0,255,65,0.3);color:#00ff41}
        .explain.wrong{background:rgba(255,82,82,0.1);border:1px solid rgba(255,82,82,0.3);color:#ff5252}
        .result-section{display:none;text-align:center}
        .r-score{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}.r-grade{font-size:24px;margin-top:8px}
        .r-text{font-size:14px;color:#888;margin:16px 0}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>💬 Smishing Quiz</h2>
        <p>Legit text or smishing? Test yourself with 10 scenarios!</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">1 / 10</div>
    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Teilen:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URL kopieren</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const QS=[
{from:"1-800-463-3339",name:"FedEx",body:"[FedEx] Your package could not be delivered due to an incorrect address. Please confirm your address at the link below.<br><span class=\"link\">http://fedex-deli.xyz/track</span>",a:"smishing",e:"<strong>fedex-deli.xyz</strong> is not FedEx's official domain (real: fedex.com). FedEx does not send links asking you to confirm personal details via SMS."},
{from:"1-800-922-0204",name:"Verizon",body:"[Verizon] Your bill of $87.42 for this month has been successfully processed. View your statement at verizon.com.",a:"real",e:"This is a legitimate billing confirmation from Verizon's official number. It contains no suspicious link and only refers you to the official website — completely safe."},
{from:"(347) 555-0192",name:"Unknown number",body:"[IRS] We have identified an unpaid tax balance of <span class=\"highlight\">$1,847.00</span>. Failure to pay <span class=\"highlight\">immediately</span> will result in <span class=\"highlight\">asset seizure</span>.<br><span class=\"link\">http://irs-pay.net/pay</span>",a:"smishing",e:"The IRS never contacts taxpayers by text message. Threats of \"immediate\" action and \"asset seizure\" combined with a suspicious domain are classic smishing red flags."},
{from:"1-877-252-2265",name:"Bank of America",body:"[Bank of America] A transfer of $500.00 was made from your account. If this was not you, please check the Bank of America app immediately.",a:"real",e:"This is a legitimate transaction alert from Bank of America's official number. It directs you to the official app — not a suspicious link — and contains no request for personal information."},
{from:"(212) 555-0178",name:"Unknown number",body:"[Medicare] You are eligible for your annual wellness checkup. Schedule your appointment at the link below.<br><span class=\"link\">http://medicare-check.net/schedule</span><br>* Failure to schedule may result in a penalty.",a:"smishing",e:"Medicare does not contact beneficiaries by personal cell phone. <strong>medicare-check.net</strong> is not the official domain (real: medicare.gov). The \"penalty\" threat is a classic smishing tactic."},
{from:"DoorDash",name:"DoorDash",body:"[DoorDash] Your order of Chicken Burrito Bowl has been delivered! 😊 Leave a review and get $3 off your next order.",a:"real",e:"This is a standard delivery confirmation from DoorDash. There is no request for personal data and no suspicious link — completely safe."},
{from:"(646) 555-0134",name:"Unknown number",body:"[FBI] A bank account has been opened in your name and may be used for fraud. Call our case officer <span class=\"highlight\">immediately</span> to avoid arrest.<br>Officer contact: (917) 555-0199",a:"smishing",e:"The FBI and law enforcement agencies never warn you of fraud or threaten arrest via text message. Asking you to call a personal cell number is a textbook smishing-to-vishing escalation scam."},
{from:"AMEX",name:"American Express",body:"[Amex] Your statement balance of $1,243.78 is due on 08/25. View your statement in the Amex app or at americanexpress.com.",a:"real",e:"This is a standard billing reminder from American Express. There is no suspicious link and it directs you to official channels — completely safe."},
{from:"(718) 555-0167",name:"Unknown number",body:"Congratulations! 🎉 You have been selected as the winner of an <span class=\"highlight\">iPhone 16 Pro</span>!<br>To claim your prize, pay the $4.99 shipping fee at the link below.<br><span class=\"link\">http://event-prize.co/claim</span>",a:"smishing",e:"100% smishing. Prize texts that ask for a \"shipping fee\" are one of the most common SMS scam formats. If something is free, you should never have to pay for it."},
{from:"1-888-280-4331",name:"Amazon",body:"[Amazon] Your return request has been accepted. Reason: Buyer's remorse. Your refund will be processed within 3-5 business days.",a:"real",e:"This is a legitimate return confirmation from Amazon. There is no suspicious link and no request for personal information — completely safe."}
];

let cur=0,score=0;

function show(){
    if(cur>=QS.length){result();return;}
    document.getElementById("pf").style.width=(cur/QS.length*100)+"%";
    document.getElementById("pt").textContent=(cur+1)+" / "+QS.length;
    const q=QS[cur];
    document.getElementById("quizArea").innerHTML=
        "<div class=\"sms-card\">" +
            "<div class=\"sms-header\"><div class=\"sms-icon\">💬</div><div class=\"sms-from\"><strong>"+q.name+"</strong><br>"+q.from+"</div></div>" +
            "<div class=\"sms-body\">"+q.body+"</div>" +
            "<div class=\"btn-row\">" +
                "<div class=\"btn-real\" onclick=\"ans('real')\">✅ Legit Text</div>" +
                "<div class=\"btn-smish\" onclick=\"ans('smishing')\">🚨 Smishing!</div>" +
            "</div>" +
            "<div class=\"explain\" id=\"exp\"></div>" +
        "</div>";
}

function ans(choice){
    const q=QS[cur];const correct=choice===q.a;if(correct)score++;
    const el=document.getElementById("exp");
    el.className="explain "+(correct?"correct":"wrong");
    el.innerHTML="<strong>"+(correct?"✅ Correct!":"❌ Wrong!")+"</strong> ("+(q.a==="smishing"?"🚨 Smishing":"✅ Legit Text")+")<br><br>"+q.e;
    el.style.display="block";
    document.querySelectorAll(".btn-real,.btn-smish").forEach(function(b){b.style.pointerEvents="none";b.style.opacity="0.5";});
    setTimeout(function(){cur++;show();},3000);
}

function result(){
    document.getElementById("quizArea").style.display="none";
    document.getElementById("pf").style.width="100%";
    document.getElementById("pt").textContent="Complete!";
    let g,c;
    if(score>=9){g="🛡️ Smishing Master!";c="#00ff41";}
    else if(score>=7){g="🟢 You're pretty sharp!";c="#00ff41";}
    else if(score>=5){g="🟡 Room for improvement";c="#ffeb3b";}
    else{g="🔴 Danger! You could fall for smishing";c="#ff5252";}
    document.getElementById("resultArea").innerHTML=
        "<div class=\"r-score\" style=\"color:"+c+"\">"+score+" / "+QS.length+"</div>" +
        "<div class=\"r-grade\" style=\"color:"+c+"\">"+g+"</div>" +
        "<div class=\"r-text\">Key smishing red flags:<br>• Government agencies (IRS, FBI) never contact you by text<br>• If the link domain does not match the official site = smishing<br>• \"Immediately\", \"urgent\", \"seizure\" threats = smishing<br>• Prize + payment request = 100% scam</div>" +
        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 Try Again</button>";
    document.getElementById("resultArea").style.display="block";
}
show();
</script>
</body>
</html>
