<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .sms-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:24px;margin-bottom:20px}
        .sms-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1a1a1a}
        .sms-icon{font-size:28px}.sms-from{font-size:14px;color:#888}.sms-from strong{color:#e0e0e0}
        .sms-body{background:#0f0f0f;border-radius:8px;padding:16px;font-size:14px;color:#ccc;line-height:1.7;margin-bottom:16px}
        .sms-body .link{color:#4fc3f7;text-decoration:underline}
        .sms-body .highlight{color:#ff9800;font-weight:600}
        .btn-row{display:flex;gap:12px}
        .btn-real,.btn-smish{flex:1;padding:14px;border:2px solid;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
        .btn-real{border-color:#00ff41;color:#00ff41;background:rgba(0,255,65,0.06)}.btn-real:hover{background:rgba(0,255,65,0.15)}
        .btn-smish{border-color:#ff5252;color:#ff5252;background:rgba(255,82,82,0.06)}.btn-smish:hover{background:rgba(255,82,82,0.15)}
        .explain{display:none;margin-top:16px;padding:16px;border-radius:10px;font-size:14px;line-height:1.7}
        .explain.correct{background:rgba(0,255,65,0.1);border:1px solid rgba(0,255,65,0.3);color:#00ff41}
        .explain.wrong{background:rgba(255,82,82,0.1);border:1px solid rgba(255,82,82,0.3);color:#ff5252}
        .result-section{display:none;text-align:center}
        .r-score{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}.r-grade{font-size:24px;margin-top:8px}
        .r-text{font-size:14px;color:#888;margin:16px 0}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>💬 스미싱 판별 퀴즈</h2>
        <p>진짜 문자일까, 스미싱일까? 10문제로 테스트!</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">1 / 10</div>
    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">공유:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URL 복사</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const QS=[
{from:"1588-1234",name:"CJ대한통운",body:'[CJ대한통운] 고객님의 택배가 주소 불일치로 배송 실패되었습니다. 아래 링크에서 주소를 확인해주세요.<br><span class="link">http://cj-deli.xyz/track</span>',a:"smishing",e:"<strong>cj-deli.xyz</strong>는 CJ대한통운 공식 도메인이 아닙니다. 실제 CJ대한통운은 cjlogistics.com을 사용하며, 문자로 개인정보 확인 링크를 보내지 않습니다."},
{from:"114",name:"KT",body:'[KT] 이번 달 통신요금 38,500원이 정상 결제되었습니다. 상세 내역은 KT닷컴에서 확인하세요.',a:"real",e:"114는 KT의 실제 발신번호이고, 결제 완료 알림은 정상적인 문자입니다. 링크도 포함되어 있지 않아 안전합니다."},
{from:"010-3456-7890",name:"모르는 번호",body:'[국세청] 미납 세금 <span class="highlight">237,000원</span>이 확인되었습니다. <span class="highlight">즉시</span> 아래 링크에서 납부하지 않으면 <span class="highlight">재산 압류</span> 조치됩니다.<br><span class="link">http://tax-pay.kr/납부</span>',a:"smishing",e:"국세청은 010 번호로 문자를 보내지 않습니다. '즉시 납부', '재산 압류' 등 긴급성을 강조하는 것은 전형적인 스미싱 수법입니다."},
{from:"1644-9000",name:"카카오뱅크",body:'[카카오뱅크] 고객님의 계좌에서 500,000원이 이체되었습니다. 본인이 아닌 경우 카카오뱅크 앱에서 확인해주세요.',a:"real",e:"카카오뱅크 실제 발신번호이며, '앱에서 확인'하라고 안내하는 것은 정상입니다. 별도 링크를 포함하지 않아 안전합니다."},
{from:"010-9876-5432",name:"모르는 번호",body:'[건강보험공단] 건강검진 대상자입니다. 아래 링크에서 예약하세요.<br><span class="link">http://nhis-check.com/예약</span><br>* 미예약시 과태료 부과',a:"smishing",e:"건강보험공단은 010 번호를 사용하지 않으며, <strong>nhis-check.com</strong>은 공식 도메인(nhis.or.kr)이 아닙니다. '과태료 부과' 위협도 스미싱 특징입니다."},
{from:"15XX",name:"배달의민족",body:'[배민] 주문하신 떡볶이 세트가 배달 완료되었습니다. 맛있게 드세요! 😊 리뷰를 남겨주시면 할인 쿠폰을 드려요.',a:"real",e:"배달 완료 알림은 정상적인 문자입니다. 개인정보 요구나 의심스러운 링크가 없어 안전합니다."},
{from:"02-1234-5678",name:"경찰청",body:'[경찰청] 고객님 명의로 대포통장이 개설되었습니다. 피해 방지를 위해 아래 번호로 <span class="highlight">즉시</span> 전화해주세요.<br>담당 수사관: 010-1111-2222',a:"smishing",e:"경찰은 문자로 대포통장 안내를 하지 않으며, 개인 010 번호로 전화하라고 하지 않습니다. 전형적인 보이스피싱 유도 문자입니다."},
{from:"1588-XXXX",name:"삼성카드",body:'[삼성카드] 7월 카드대금 987,650원 결제 예정(8/25). 명세서는 삼성카드 앱에서 확인 가능합니다.',a:"real",e:"카드 결제 예정 안내는 정상적인 문자입니다. 앱에서 확인하라는 안내이며 별도 링크가 없어 안전합니다."},
{from:"010-5555-6666",name:"모르는 번호",body:'축하합니다! 🎉 귀하가 <span class="highlight">아이폰 16 Pro</span> 당첨자로 선정되었습니다!<br>수령을 위해 아래 링크에서 배송비 3,000원을 결제해주세요.<br><span class="link">http://event-prize.co.kr</span>',a:"smishing",e:"100% 스미싱입니다. 당첨 문자 + 배송비 결제 요구는 가장 흔한 스미싱 유형입니다. 무료 당첨에 돈을 요구하면 사기입니다."},
{from:"1600-1234",name:"쿠팡",body:'[쿠팡] 반품 접수가 완료되었습니다. 반품 사유: 단순변심. 환불은 3~5영업일 내에 처리됩니다.',a:"real",e:"반품 처리 알림은 정상적인 문자입니다. 개인정보 요구나 링크가 없어 안전합니다."}
];

let cur=0,score=0;

function show(){
    if(cur>=QS.length){result();return;}
    document.getElementById('pf').style.width=(cur/QS.length*100)+'%';
    document.getElementById('pt').textContent=(cur+1)+' / '+QS.length;
    const q=QS[cur];
    document.getElementById('quizArea').innerHTML=`
        <div class="sms-card">
            <div class="sms-header"><div class="sms-icon">💬</div><div class="sms-from"><strong>${q.name}</strong><br>${q.from}</div></div>
            <div class="sms-body">${q.body}</div>
            <div class="btn-row">
                <div class="btn-real" onclick="ans('real')">✅ 진짜 문자</div>
                <div class="btn-smish" onclick="ans('smishing')">🚨 스미싱!</div>
            </div>
            <div class="explain" id="exp"></div>
        </div>`;
}

function ans(choice){
    const q=QS[cur];const correct=choice===q.a;if(correct)score++;
    const el=document.getElementById('exp');
    el.className='explain '+(correct?'correct':'wrong');
    el.innerHTML=`<strong>${correct?'✅ 정답!':'❌ 틀렸습니다!'}</strong> (${q.a==='smishing'?'🚨 스미싱':'✅ 진짜 문자'})<br><br>${q.e}`;
    el.style.display='block';
    document.querySelectorAll('.btn-real,.btn-smish').forEach(b=>{b.style.pointerEvents='none';b.style.opacity='0.5';});
    setTimeout(()=>{cur++;show();},3000);
}

function result(){
    document.getElementById('quizArea').style.display='none';
    document.getElementById('pf').style.width='100%';
    document.getElementById('pt').textContent='완료!';
    let g,c;
    if(score>=9){g='🛡️ 스미싱 마스터!';c='#00ff41';}
    else if(score>=7){g='🟢 꽤 잘 구별해요!';c='#00ff41';}
    else if(score>=5){g='🟡 좀 더 주의가 필요해요';c='#ffeb3b';}
    else{g='🔴 위험! 스미싱에 당할 수 있어요';c='#ff5252';}
    document.getElementById('resultArea').innerHTML=`
        <div class="r-score" style="color:${c}">${score} / ${QS.length}</div>
        <div class="r-grade" style="color:${c}">${g}</div>
        <div class="r-text">스미싱 핵심 포인트:<br>• 010 번호로 오는 기관 문자 = 99% 스미싱<br>• 링크 도메인이 공식 사이트와 다르면 = 스미싱<br>• "즉시", "긴급", "압류" 등 위협 = 스미싱<br>• 당첨 + 돈 요구 = 100% 사기</div>
        <button class="retry-btn" onclick="location.reload()">🔄 다시 도전</button>`;
    document.getElementById('resultArea').style.display='block';
}
show();
</script>
</body>
</html>
