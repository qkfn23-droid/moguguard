<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>와이파이 안전 체크 - 공유기 보안 진단 | MOGU Guard</title>
    <meta name="description" content="집/카페 와이파이가 안전한지 체크하세요. 공유기 보안 설정 체크리스트와 공용 와이파이 안전 가이드.">
    <link rel="canonical" href="https://moguguard.com/tools/wifi-safety.html">
    <meta property="og:title" content="와이파이 안전 체크 | MOGU Guard">
    <meta property="og:description" content="내 와이파이 안전한지 체크!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://moguguard.com/tools/wifi-safety.html">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .section{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:24px;margin-bottom:20px}
        .section-title{font-size:16px;color:#00ff41;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #1a3a1a}
        .check-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #0f0f0f;cursor:pointer}
        .check-item:last-child{border-bottom:none}.check-item:hover{background:rgba(0,255,65,0.03)}
        .check-item input{width:20px;height:20px;accent-color:#00ff41;cursor:pointer}
        .check-item label{flex:1;cursor:pointer;font-size:14px;line-height:1.5}.check-item label strong{color:#00ff41}
        .risk{font-size:11px;padding:2px 8px;border-radius:3px}.risk-high{background:rgba(255,82,82,0.15);color:#ff5252}.risk-mid{background:rgba(255,152,0,0.15);color:#ff9800}.risk-low{background:rgba(0,255,65,0.15);color:#00ff41}
        .danger-box{background:rgba(255,82,82,0.08);border:1px solid rgba(255,82,82,0.3);border-radius:8px;padding:20px;margin-bottom:20px}
        .danger-title{font-size:16px;color:#ff5252;font-weight:700;margin-bottom:10px}
        .danger-text{font-size:14px;color:#ff8a80;line-height:1.8}
        .result-box{display:none;text-align:center;background:#111;border:1px solid #00ff4130;border-radius:8px;padding:30px;margin-bottom:20px}
        .score-num{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}.score-grade{font-size:20px;margin-top:8px}
        .score-bar{height:12px;background:#1a1a1a;border-radius:6px;overflow:hidden;margin:16px 0}.score-fill{height:100%;border-radius:6px;transition:width .5s}
        .tips{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-top:16px;display:none}
        .tips-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .tips-text{font-size:14px;color:#888;line-height:1.8}.tips-text strong{color:#ff5252}
        .calc-btn{width:100%;padding:14px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>📶 와이파이 안전 체크</h2>
        <p>집 와이파이 & 공용 와이파이 안전 진단</p>
    </div>

    <div class="danger-box">
        <div class="danger-title">⚠️ 안전하지 않은 와이파이의 위험</div>
        <div class="danger-text">
            해커가 같은 와이파이에 접속하면 <strong>당신이 보는 사이트, 입력하는 비밀번호, 보내는 메시지</strong>를 엿볼 수 있습니다. 특히 공용 와이파이는 매우 위험합니다.
        </div>
    </div>

    <div class="section">
        <div class="section-title">🏠 집 와이파이 (공유기)</div>
        <div class="check-item"><input type="checkbox" id="c1"><label for="c1">공유기 <strong>관리자 비밀번호</strong>를 기본값(admin/1234)에서 변경했다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c2"><label for="c2">와이파이 암호화가 <strong>WPA3 또는 WPA2</strong>로 설정되어 있다 (WEP 아님)</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c3"><label for="c3">와이파이 <strong>비밀번호가 12자 이상</strong>이고 복잡하다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c4"><label for="c4">공유기 <strong>펌웨어를 최신 버전</strong>으로 업데이트했다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c5"><label for="c5"><strong>SSID(와이파이 이름)</strong>에 개인정보(이름/호수)가 없다</label><span class="risk risk-low">권장</span></div>
        <div class="check-item"><input type="checkbox" id="c6"><label for="c6"><strong>WPS(원터치 연결)</strong>를 비활성화했다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c7"><label for="c7"><strong>원격 관리</strong> 기능을 꺼두었다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c8"><label for="c8">연결된 <strong>기기 목록</strong>을 확인해 모르는 기기가 없다</label><span class="risk risk-mid">중요</span></div>
    </div>

    <div class="section">
        <div class="section-title">☕ 공용 와이파이 사용 습관</div>
        <div class="check-item"><input type="checkbox" id="c9"><label for="c9">공용 와이파이에서 <strong>은행/결제 앱을 사용하지 않는다</strong></label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c10"><label for="c10">공용 와이파이에서 <strong>로그인이 필요한 사이트</strong>를 이용하지 않는다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c11"><label for="c11"><strong>자동 연결</strong>을 꺼두고, 수동으로만 와이파이에 접속한다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c12"><label for="c12">사용 후 공용 와이파이를 <strong>"네트워크 삭제"</strong>한다</label><span class="risk risk-low">권장</span></div>
        <div class="check-item"><input type="checkbox" id="c13"><label for="c13">공용 와이파이 사용 시 <strong>VPN</strong>을 사용한다</label><span class="risk risk-low">권장</span></div>
    </div>

    <button class="calc-btn" onclick="showResult()">📶 안전 점수 확인</button>

    <div class="result-box" id="resultBox">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
        <div class="score-grade" id="scoreGrade"></div>
    </div>
    <div class="tips" id="tips"><div class="tips-title">⚠️ 보강 필요 항목</div><div class="tips-text" id="tipsText"></div></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">공유:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URL 복사</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const labels=["공유기 관리자 비밀번호 변경","WPA3/WPA2 암호화","와이파이 비밀번호 12자 이상","공유기 펌웨어 업데이트","SSID에 개인정보 없음","WPS 비활성화","원격 관리 비활성화","모르는 기기 없음 확인","공용 와이파이에서 금융앱 미사용","공용 와이파이에서 로그인 미사용","자동 연결 비활성화","사용 후 네트워크 삭제","공용 와이파이 VPN 사용"];
function showResult(){
    let checked=0,unchecked=[];
    for(let i=1;i<=13;i++){if(document.getElementById('c'+i).checked)checked++;else unchecked.push(labels[i-1]);}
    const score=Math.round((checked/13)*100);
    let grade,color;
    if(score>=90){grade='🟢 와이파이 보안 완벽!';color='#00ff41';}
    else if(score>=70){grade='🟡 양호. 몇 가지 보강하면 안전합니다.';color='#ffeb3b';}
    else if(score>=50){grade='🟠 주의! 와이파이가 취약할 수 있습니다.';color='#ff9800';}
    else{grade='🔴 위험! 해커가 와이파이를 통해 침입할 수 있습니다.';color='#ff5252';}
    document.getElementById('scoreNum').textContent=score+'점';document.getElementById('scoreNum').style.color=color;
    document.getElementById('scoreFill').style.width=score+'%';document.getElementById('scoreFill').style.background=color;
    document.getElementById('scoreGrade').textContent=grade;document.getElementById('scoreGrade').style.color=color;
    document.getElementById('resultBox').style.display='block';
    if(unchecked.length>0){document.getElementById('tipsText').innerHTML=unchecked.map(t=>'• <strong>'+t+'</strong>').join('<br>');document.getElementById('tips').style.display='block';}
    else document.getElementById('tips').style.display='none';
    document.getElementById('resultBox').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
