<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전한 비밀번호 생성기 - 강력한 PW Zeichen동 생성 | MOGU Guard</title>
    <meta name="description" content="해킹 불가능한 안전한 비밀번호를 Zeichen동 생성합니다. Laenge, 문Zeichen 종류 선택 가능. 클릭 한 번으로 Kopieren.">
    <link rel="canonical" href="https://moguguard.com/tools/password-gen.html">
    <meta property="og:title" content="안전한 비밀번호 생성기 | MOGU Guard">
    <meta property="og:description" content="해킹 불가능한 비밀번호 Zeichen동 생성!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://moguguard.com/tools/password-gen.html">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .pw-display{background:#111;border:2px solid #00ff4140;border-radius:8px;padding:20px;text-align:center;margin-bottom:20px;position:relative}
        .pw-text{font-size:24px;font-family:'Fira Code',monospace;color:#00ff41;word-break:break-all;letter-spacing:2px;text-shadow:0 0 10px rgba(0,255,65,0.3)}
        .pw-copy{position:absolute;top:10px;right:10px;padding:6px 14px;background:#00ff41;color:#0a0a0a;border:none;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        .pw-strength{text-align:center;margin-bottom:20px;font-size:14px}
        .controls{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:24px;margin-bottom:20px}
        .control-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1a1a1a}
        .control-row:last-child{border-bottom:none}
        .control-row label{font-size:14px;color:#aaa}
        .control-row input[type=range]{width:200px;accent-color:#00ff41}
        .control-row input[type=checkbox]{width:20px;height:20px;accent-color:#00ff41}
        .len-value{font-size:18px;font-weight:700;color:#00ff41;font-family:'Fira Code',monospace;min-width:40px;text-align:center}
        .gen-btn{width:100%;padding:14px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace;margin-bottom:20px}
        .gen-btn:hover{background:#00cc33}
        .history{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px}
        .history-title{font-size:14px;color:#00ff41;margin-bottom:10px;font-weight:600}
        .history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #0f0f0f;font-family:'Fira Code',monospace;font-size:13px;color:#666}
        .history-item:last-child{border-bottom:none}
        .history-item .copy-btn{padding:4px 10px;background:transparent;border:1px solid #00ff4140;border-radius:4px;color:#00ff41;font-size:11px;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🎲 비밀번호 생성기</h2>
        <p>해킹 불가능한 안전한 비밀번호를 만들어보세요</p>
    </div>

    <div class="pw-display">
        <div class="pw-text" id="pwText">생성 버튼을 누르세요</div>
        <button class="pw-copy" onclick="copyPw()">Kopieren</button>
    </div>
    <div class="pw-strength" id="pwStrength"></div>

    <div class="controls">
        <div class="control-row">
            <label>Laenge</label>
            <input type="range" id="pwLen" min="8" max="64" value="16" oninput="document.getElementById('lenVal').textContent=this.value">
            <span class="len-value" id="lenVal">16</span>
        </div>
        <div class="control-row"><label>소문Zeichen (a-z)</label><input type="checkbox" id="optLower" checked></div>
        <div class="control-row"><label>대문Zeichen (A-Z)</label><input type="checkbox" id="optUpper" checked></div>
        <div class="control-row"><label>숫Zeichen (0-9)</label><input type="checkbox" id="optDigit" checked></div>
        <div class="control-row"><label>특수문Zeichen (!@#$%)</label><input type="checkbox" id="optSpecial" checked></div>
    </div>

    <button class="gen-btn" onclick="generate()">🎲 비밀번호 생성</button>

    <div class="history">
        <div class="history-title">📋 최근 생성 기록</div>
        <div id="historyList"><div style="color:#333;font-size:13px;">아직 Generiertes Passwort가 없습니다</div></div>
    </div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Teilen:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URL Kopieren</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const history = [];

function generate() {
    let chars = '';
    if (document.getElementById('optLower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
    if (document.getElementById('optUpper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (document.getElementById('optDigit').checked) chars += '0123456789';
    if (document.getElementById('optSpecial').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
    if (!chars) { alert('최소 하나의 문Zeichen 종류를 선택하세요.'); return; }

    const len = parseInt(document.getElementById('pwLen').value);
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    let pw = '';
    for (let i = 0; i < len; i++) pw += chars[arr[i] % chars.length];

    document.getElementById('pwText').textContent = pw;

    // Staerke 표시
    const charsetSize = chars.length;
    const combinations = Math.pow(charsetSize, len);
    const seconds = combinations / 1e9;
    let timeStr, color;
    if (seconds < 3600) { timeStr = '⚠️ 약함'; color = '#ff5252'; }
    else if (seconds < 86400*365*100) { timeStr = '🟡 보통 (' + formatTime(seconds) + ')'; color = '#ffeb3b'; }
    else { timeStr = '🟢 매우 강함 (' + formatTime(seconds) + ')'; color = '#00ff41'; }
    document.getElementById('pwStrength').innerHTML = `해킹 Stunden: <strong style="color:${color}">${timeStr}</strong>`;

    // 히스토리
    history.unshift(pw);
    if (history.length > 5) history.pop();
    document.getElementById('historyList').innerHTML = history.map(p =>
        `<div class="history-item"><span>${p}</span><button class="copy-btn" onclick="navigator.clipboard.writeText('${p}');this.textContent='✅'">Kopieren</button></div>`
    ).join('');
}

function copyPw() {
    const pw = document.getElementById('pwText').textContent;
    if (pw === '생성 버튼을 누르세요') return;
    navigator.clipboard.writeText(pw);
    const btn = document.querySelector('.pw-copy');
    btn.textContent = '✅ Kopieren됨';
    setTimeout(() => btn.textContent = 'Kopieren', 2000);
}

function formatTime(s) {
    if (s < 60) return Math.round(s) + 'Sekunden';
    if (s < 3600) return Math.round(s/60) + 'Minuten';
    if (s < 86400) return Math.round(s/3600) + 'Stunden';
    if (s < 86400*365) return Math.round(s/86400) + 'Tage';
    if (s < 86400*365*1000) return Math.round(s/(86400*365)).toLocaleString() + 'Jahre';
    if (s < 86400*365*1e6) return Math.round(s/(86400*365*1000)).toLocaleString() + '천 Jahre';
    if (s < 86400*365*1e9) return Math.round(s/(86400*365*1e6)).toLocaleString() + '백만 Jahre';
    return '우주 나이 이상';
}

generate();
</script>
</body>
</html>
