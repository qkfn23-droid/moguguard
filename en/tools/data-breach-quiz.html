    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .quiz-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace;text-align:center}
        .q-text{font-size:17px;color:#e0e0e0;line-height:1.6;margin-bottom:20px;font-weight:600;text-align:center}
        .options{display:flex;flex-direction:column;gap:8px}
        .opt{padding:12px 16px;background:rgba(0,255,65,0.04);border:1px solid #00ff4120;border-radius:6px;color:#aaa;font-size:14px;cursor:pointer;transition:all .2s}
        .opt:hover{border-color:#00ff41;color:#00ff41}
        .opt.correct{border-color:#00ff41;background:rgba(0,255,65,0.15);color:#00ff41}
        .opt.wrong{border-color:#ff5252;background:rgba(255,82,82,0.15);color:#ff5252}
        .explain{display:none;margin-top:12px;padding:12px;background:#0f0f0f;border-radius:6px;font-size:13px;color:#888;line-height:1.6}
        .result-section{display:none;text-align:center}
        .r-score{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}.r-grade{font-size:24px;margin-top:8px}
        .r-text{font-size:14px;color:#888;margin:16px 0;line-height:1.8}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>💾 Data Breach Quiz</h2>
        <p>How much do you know about data breaches?</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">1 / 10</div>
    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">Copy URL</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const Q=[
{q:"역대 최대 규모의 데이터 유출 사건에서 유출된 계정 수는?",o:["1억 개","10억 개","30억 개","100억 개"],a:2,e:"2024년 기준, 'MOAB(Mother of All Breaches)' 사건에서 약 260억 건의 데이터가 유출되었습니다. Yahoo 사건(30억 계정)도 단일 회사 기준 최대입니다."},
{q:"개인정보가 유출된 후 가장 먼저 해야 할 일은?",o:["경찰에 신고","해당 사이트 비밀번호 변경","컴퓨터 포맷","아무것도 안 함"],a:1,e:"가장 먼저 유출된 사이트와 같은 비밀번호를 쓰는 모든 계정의 비밀번호를 변경해야 합니다."},
{q:"다크웹에서 유출된 신용카드 정보의 평균 가격은?",o:["$1~$5","$10~$20","$100~$200","$1,000 이상"],a:1,e:"다크웹에서 신용카드 정보는 $5~$20 정도에 거래됩니다. 대량 유출되면 가격은 더 낮아집니다."},
{q:"기업이 데이터 유출 사실을 발견하고 공개하기까지 평균 기간은?",o:["1일","1주","약 6개월","1년 이상"],a:2,e:"IBM 보고서에 따르면, 데이터 유출 발견까지 평균 약 200일, 대응까지 약 70일이 걸립니다. 총 약 9개월."},
{q:"개인정보 유출 시 기업이 부과받을 수 있는 GDPR 벌금은?",o:["최대 100만원","최대 1억원","전체 매출의 4%까지","벌금 없음"],a:2,e:"GDPR에 따르면 전 years old계 연간 매출의 최대 4% 또는 2,000만 유로(약 280억원) 중 큰 금액이 부과될 수 있습니다."},
{q:"이메일 주소가 유출되면 어떤 위험이 있나요?",o:["스팸 메일만 좀 늘어남","피싱 공격 대상이 됨","별 위험 없음","이메일이 삭제됨"],a:1,e:"유출된 이메일로 맞춤형 피싱 공격이 올 수 있습니다. 비밀번호까지 유출되면 계정 탈취 위험도 있습니다."},
{q:"'해시된 비밀번호'가 유출되면 안전한가요?",o:["완전 안전","단순 해시는 금방 풀릴 수 있음","해커가 절대 풀 수 없음","해시가 뭔데?"],a:1,e:"MD5 같은 단순 해시는 레인보우 테이블로 금방 풀립니다. bcrypt 같은 강력한 해시라면 상대적으로 안전합니다."},
{q:"내 개인정보가 유출됐는지 확인하는 방법은?",o:["경찰서에 문의","Have I Been Pwned 사이트","할 수 없음","점쟁이한테 물어봄"],a:1,e:"haveibeenpwned.com에서 이메일을 입력하면 유출 여부를 무료로 확인할 수 있습니다."},
{q:"데이터 유출 후 신원 도용을 방지하려면?",o:["신용 동결(Credit Freeze) 요청","SNS 비밀번호만 변경","컴퓨터 재시작","아무것도 안 해도 됨"],a:0,e:"신용 동결을 하면 새로운 신용 계좌 개설을 차단하여 신원 도용을 방지할 수 있습니다."},
{q:"한국에서 개인정보 유출 시 신고할 수 있는 기관은?",o:["한국인터넷진흥원(KISA) 118","경찰청 112만 가능","신고할 곳이 없음","네이버 고객센터"],a:0,e:"KISA(한국인터넷진흥원) 118에 신고하면 됩니다. 개인정보침해 신고센터(privacy.kisa.or.kr)에서도 접수 가능합니다."}
];

let cur=0,score=0;
function show(){
    if(cur>=Q.length){result();return;}
    document.getElementById('pf').style.width=(cur/Q.length*100)+'%';
    document.getElementById('pt').textContent=(cur+1)+' / '+Q.length;
    const q=Q[cur];
    document.getElementById('quizArea').innerHTML=`
        <div class="quiz-card">
            <div class="q-num">Q${cur+1}</div>
            <div class="q-text">${q.q}</div>
            <div class="options">${q.o.map((o,i)=>`<div class="opt" onclick="ans(${i})">${o}</div>`).join('')}</div>
            <div class="explain" id="exp"></div>
        </div>`;
}
function ans(i){
    const q=Q[cur];const correct=i===q.a;if(correct)score++;
    document.querySelectorAll('.opt').forEach((o,j)=>{
        o.style.pointerEvents='none';
        if(j===q.a)o.className='opt correct';
        else if(j===i&&!correct)o.className='opt wrong';
    });
    document.getElementById('exp').style.display='block';
    document.getElementById('exp').innerHTML=(correct?'✅ Correct! ':'❌ Wrong! ')+q.e;
    setTimeout(()=>{cur++;show();},2500);
}
function result(){
    document.getElementById('quizArea').style.display='none';
    document.getElementById('pf').style.width='100%';
    document.getElementById('pt').textContent='완료!';
    let g,c;
    if(score>=9){g='💾 Data Breach Expert!';c='#00ff41';}
    else if(score>=7){g='🟢 You know well!';c='#00ff41';}
    else if(score>=5){g='🟡 Basic knowledge level';c='#ffeb3b';}
    else{g='🔴 Need data breach education!';c='#ff5252';}
    document.getElementById('resultArea').innerHTML=`
        <div class="r-score" style="color:${c}">${score} / ${Q.length}</div>
        <div class="r-grade" style="color:${c}">${g}</div>
        <div class="r-text">Data breaches are not someone else's problem.<br>전 years old계 인구의 절반 이상이 이미 개인정보가 유출된 적이 있습니다.</div>
        <button class="retry-btn" onclick="location.reload()">🔄 Try Again</button>`;
    document.getElementById('resultArea').style.display='block';
}
show();
</script>
</body>
