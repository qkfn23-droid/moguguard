<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNSプライバシー診断 - Instagram・Facebook・X（Twitter） | MOGU Guard</title>
    <meta name="description" content="SNSでどれだけ個人情報が露出しているか確認しましょう。Instagram・Facebook・X（Twitter）のセキュリティ設定をチェック。">
    <link rel="canonical" href="https://moguguard.com/jp/tools/privacy-check.html">
    <meta property="og:title" content="SNSプライバシー診断 | MOGU Guard">
    <meta property="og:description" content="SNSで個人情報がどれだけ露出しているか確認しましょう。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://moguguard.com/jp/tools/privacy-check.html">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .checklist{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:24px;margin-bottom:24px}
        .section-label{font-size:14px;color:#00ff41;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #1a3a1a}
        .check-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #0f0f0f;cursor:pointer}
        .check-item:last-child{border-bottom:none}.check-item:hover{background:rgba(0,255,65,0.03)}
        .check-item input{width:20px;height:20px;accent-color:#00ff41;cursor:pointer}
        .check-item label{flex:1;cursor:pointer;font-size:14px;line-height:1.5}.check-item label strong{color:#00ff41}
        .risk{font-size:11px;padding:2px 8px;border-radius:3px}.risk-high{background:rgba(255,82,82,0.15);color:#ff5252}.risk-mid{background:rgba(255,152,0,0.15);color:#ff9800}.risk-low{background:rgba(0,255,65,0.15);color:#00ff41}
        .result-box{display:none;text-align:center;background:#111;border:1px solid #00ff4130;border-radius:8px;padding:30px;margin-bottom:20px}
        .score-num{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}.score-grade{font-size:20px;margin-top:8px}
        .score-bar{height:12px;background:#1a1a1a;border-radius:6px;overflow:hidden;margin:16px 0}.score-fill{height:100%;border-radius:6px;transition:width .5s}
        .tips{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-top:16px;display:none}
        .tips-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .tips-text{font-size:14px;color:#888;line-height:1.8}.tips-text strong{color:#ff5252}
        .calc-btn{width:100%;padding:14px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>👤 SNSプライバシー診断</h2>
        <p>すでに対策済みの項目にチェックを入れてください</p>
    </div>

    <div class="checklist">
        <div class="section-label">📸 Instagram / SNS — 全般</div>
        <div class="check-item"><input type="checkbox" id="c1"><label for="c1">アカウントを<strong>非公開</strong>に設定している</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c2"><label for="c2">プロフィールに<strong>電話番号・メールアドレス</strong>を表示していない</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c3"><label for="c3">投稿に<strong>位置情報タグ</strong>を使っていない</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c4"><label for="c4"><strong>生年月日</strong>を公開していない</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c5"><label for="c5"><strong>自宅・学校・職場の近くで撮った写真</strong>を投稿していない</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c6"><label for="c6">本名の代わりに<strong>ユーザー名・ニックネーム</strong>を使っている</label><span class="risk risk-low">推奨</span></div>

        <div class="section-label" style="margin-top:20px">💬 メッセージ・チャット</div>
        <div class="check-item"><input type="checkbox" id="c7"><label for="c7">見知らぬ人からの<strong>フレンドリクエスト</strong>を断っている</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c8"><label for="c8">プロフィール写真を<strong>見知らぬ人には非表示</strong>に設定している</label><span class="risk risk-low">推奨</span></div>
        <div class="check-item"><input type="checkbox" id="c9"><label for="c9"><strong>既読・最終ログイン時刻</strong>を非表示にしている</label><span class="risk risk-low">推奨</span></div>

        <div class="section-label" style="margin-top:20px">🔐 アカウントセキュリティ</div>
        <div class="check-item"><input type="checkbox" id="c10"><label for="c10">SNSアカウントに<strong>二段階認証（2FA）</strong>を有効にしている</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c11"><label for="c11">各SNSで<strong>異なるパスワード</strong>を使っている</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c12"><label for="c12"><strong>ログイン通知</strong>が有効になっている</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c13"><label for="c13">使っていない<strong>連携アプリ</strong>の権限を取り消している</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c14"><label for="c14"><strong>ログイン履歴</strong>を定期的に確認している</label><span class="risk risk-low">推奨</span></div>
    </div>

    <button class="calc-btn" onclick="showResult()">👤 プライバシースコアを確認</button>

    <div class="result-box" id="resultBox">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
        <div class="score-grade" id="scoreGrade"></div>
    </div>
    <div class="tips" id="tips"><div class="tips-title">⚠️ 情報露出リスク項目</div><div class="tips-text" id="tipsText"></div></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">共有:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='コピー完了!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URLコピー</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const labels=["アカウントを非公開に設定済み","プロフィールに電話番号・メールアドレスを表示していない","位置情報タグを使っていない","生年月日を公開していない","自宅・学校・職場近くの写真を投稿していない","ニックネームを使用","見知らぬ人からのフレンドリクエストを断っている","プロフィール写真を見知らぬ人には非表示","既読・最終ログイン時刻を非表示","二段階認証が有効","各SNSで異なるパスワードを使用","ログイン通知が有効","使っていない連携アプリの権限を取り消し済み","ログイン履歴を定期的に確認"];
function showResult(){
    let checked=0,unchecked=[];
    for(let i=1;i<=14;i++){if(document.getElementById("c"+i).checked)checked++;else unchecked.push(labels[i-1]);}
    const score=Math.round((checked/14)*100);
    let grade,color;
    if(score>=90){grade="🟢 プライバシーマスター！個人データがしっかり守られています。";color="#00ff41";}
    else if(score>=70){grade="🟡 良好。少し調整すれば安全です。";color="#ffeb3b";}
    else if(score>=50){grade="🟠 注意！かなりの個人情報が露出しています。";color="#ff9800";}
    else{grade="🔴 危険！SNSで個人情報が大量に露出しています。";color="#ff5252";}
    document.getElementById("scoreNum").textContent=score+" pt";document.getElementById("scoreNum").style.color=color;
    document.getElementById("scoreFill").style.width=score+"%";document.getElementById("scoreFill").style.background=color;
    document.getElementById("scoreGrade").textContent=grade;document.getElementById("scoreGrade").style.color=color;
    document.getElementById("resultBox").style.display="block";
    if(unchecked.length>0){document.getElementById("tipsText").innerHTML=unchecked.map(t=>"• <strong>"+t+"</strong>").join("<br>");document.getElementById("tips").style.display="block";}
    else document.getElementById("tips").style.display="none";
    document.getElementById("resultBox").scrollIntoView({behavior:"smooth"});
}
</script>
</body>
</html>
