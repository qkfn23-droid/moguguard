<div class="container">

<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a30;margin-top:30px;">

<script>
const input = document.getElementById("pwInput");
input.addEventListener("input", analyze);

const COMMON_PASSWORDS = ["password","123456","12345678","qwerty","abc123","monkey","1234567","letmein","trustno1","dragon","baseball","iloveyou","master","sunshine","ashley","bailey","shadow","123123","654321","superman","qazwsx","michael","football","password1","password123","000000","11111111","admin","welcome"];

function analyze() {
    const pw = input.value;
    if (!pw) { document.getElementById("result").style.display = "none"; return; }
    document.getElementById("result").style.display = "block";

    const len = pw.length;
    const hasLower = /[a-z]/.test(pw);
    const hasUpper = /[A-Z]/.test(pw);
    const hasDigit = /[0-9]/.test(pw);
    const hasSpecial = /[^a-zA-Z0-9]/.test(pw);
    const hasKorean = /[ㄱ-ㅎ가-힣]/.test(pw);
    const isCommon = COMMON_PASSWORDS.includes(pw.toLowerCase());
    const hasSequential = /012|123|234|345|456|567|678|789|890|abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz/i.test(pw);
    const hasRepeated = /(.)\1{2,}/.test(pw);
    const uniqueChars = new Set(pw).size;

    let score = 0;
    if (len >= 8) score += 15;
    if (len >= 12) score += 15;
    if (len >= 16) score += 10;
    if (hasLower) score += 10;
    if (hasUpper) score += 10;
    if (hasDigit) score += 10;
    if (hasSpecial) score += 15;
    if (uniqueChars >= 8) score += 10;
    if (uniqueChars >= 12) score += 5;
    if (isCommon) score -= 40;
    if (hasSequential) score -= 15;
    if (hasRepeated) score -= 10;
    if (len < 6) score -= 20;
    score = Math.max(0, Math.min(100, score));

    let charsetSize = 0;
    if (hasLower) charsetSize += 26;
    if (hasUpper) charsetSize += 26;
    if (hasDigit) charsetSize += 10;
    if (hasSpecial) charsetSize += 33;
    if (hasKorean) charsetSize += 11172;
    if (charsetSize === 0) charsetSize = 26;

    const combinations = Math.pow(charsetSize, len);
    const guessesPerSec = 1e9;
    let seconds = combinations / guessesPerSec;
    if (isCommon) seconds = 0.001;

    const crackTime = formatTime(seconds);

    let grade, gradeColor;
    if (score >= 90) { grade = "非常に強い 🟢"; gradeColor = "#00e676"; }
    else if (score >= 70) { grade = "強い 🟡"; gradeColor = "#ffeb3b"; }
    else if (score >= 50) { grade = "普通 🟠"; gradeColor = "#ff9800"; }
    else if (score >= 30) { grade = "弱い 🔴"; gradeColor = "#ff5252"; }
    else { grade = "非常に危険 ⛔"; gradeColor = "#d50000"; }

    document.getElementById("scoreLabel").textContent = score + " pt";
    document.getElementById("scoreLabel").style.color = gradeColor;
    document.getElementById("scoreFill").style.width = score + "%";
    document.getElementById("scoreFill").style.background = gradeColor;
    document.getElementById("scoreText").textContent = grade;
    document.getElementById("crackTime").textContent = crackTime;
    document.getElementById("crackTime").style.color = score >= 70 ? "#00e676" : score >= 50 ? "#ff9800" : "#ff5252";

    document.getElementById("analysisGrid").innerHTML = `
        <div class="analysis-item"><div class="label">文字数</div><div class="value ${len >= 12 ? "check-pass" : "check-fail"}">${len}文字 ${len >= 12 ? "✅" : len >= 8 ? "⚠️" : "❌"}</div></div>
        <div class="analysis-item"><div class="label">小文字</div><div class="value ${hasLower ? "check-pass" : "check-fail"}">${hasLower ? "あり ✅" : "なし ❌"}</div></div>
        <div class="analysis-item"><div class="label">大文字</div><div class="value ${hasUpper ? "check-pass" : "check-fail"}">${hasUpper ? "あり ✅" : "なし ❌"}</div></div>
        <div class="analysis-item"><div class="label">数字</div><div class="value ${hasDigit ? "check-pass" : "check-fail"}">${hasDigit ? "あり ✅" : "なし ❌"}</div></div>
        <div class="analysis-item"><div class="label">特殊文字</div><div class="value ${hasSpecial ? "check-pass" : "check-fail"}">${hasSpecial ? "あり ✅" : "なし ❌"}</div></div>
        <div class="analysis-item"><div class="label">ユニーク文字数</div><div class="value ${uniqueChars >= 8 ? "check-pass" : "check-fail"}">${uniqueChars}種類 ${uniqueChars >= 8 ? "✅" : "⚠️"}</div></div>
        <div class="analysis-item"><div class="label">よく使われるパスワード</div><div class="value ${!isCommon ? "check-pass" : "check-fail"}">${isCommon ? "⛔ 危険！今すぐ変更" : "安全 ✅"}</div></div>
        <div class="analysis-item"><div class="label">連続パターン</div><div class="value ${!hasSequential ? "check-pass" : "check-fail"}">${hasSequential ? "検出 ⚠️ (123, abcなど)" : "なし ✅"}</div></div>
    `;

    let tips = [];
    if (len < 12) tips.push("<strong>12文字以上使用してください</strong>。長さが最も重要です。");
    if (!hasUpper) tips.push("<strong>大文字</strong>を追加してください。");
    if (!hasSpecial) tips.push("<strong>特殊文字</strong>を追加してください (!@#$%^&*)。");
    if (isCommon) tips.push("このパスワードは<strong>よく使われるパスワードリスト</strong>に含まれています。今すぐ変更してください！");
    if (hasSequential) tips.push("<strong>連続する文字や数字</strong>を避けてください (123, abc)。");
    if (hasRepeated) tips.push("<strong>繰り返し文字</strong>を避けてください (aaa, 111)。");
    if (score >= 80) tips.push("素晴らしい！このパスワードは<strong>非常に安全</strong>です。各サイトで異なるパスワードを使用してください。");

    document.getElementById("tipsCard").innerHTML = `
        <div class="tips-title">💡 改善のヒント</div>
        <div class="tips-text">${tips.length > 0 ? tips.map(t => "• " + t).join("<br>") : "完璧です！"}</div>
    `;
}

function formatTime(seconds) {
    if (seconds < 0.001) return "即座に解読可能";
    if (seconds < 1) return "1秒未満";
    if (seconds < 60) return Math.round(seconds) + "秒";
    if (seconds < 3600) return Math.round(seconds / 60) + "分";
    if (seconds < 86400) return Math.round(seconds / 3600) + "時間";
    if (seconds < 86400 * 30) return Math.round(seconds / 86400) + "日";
    if (seconds < 86400 * 365) return Math.round(seconds / (86400 * 30)) + "ヶ月";
    if (seconds < 86400 * 365 * 1000) return Math.round(seconds / (86400 * 365)) + "年";
    if (seconds < 86400 * 365 * 1e6) return Math.round(seconds / (86400 * 365 * 1000)) + "千年";
    if (seconds < 86400 * 365 * 1e9) return Math.round(seconds / (86400 * 365 * 1e6)) + "百万年";
    if (seconds < 86400 * 365 * 1e12) return Math.round(seconds / (86400 * 365 * 1e9)) + "十億年";
    return "宇宙の年齢より長い ♾️";
}
</script>
