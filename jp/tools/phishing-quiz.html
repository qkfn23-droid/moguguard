    {from:"noreply@github.com",fromName:"GitHub",subject:"[GitHub] アカウントに新しいSSHキーが追加されました",to:"自分",
     body:"こんにちは、<br><br>アカウントに新しい公開鍵が追加されました：<br><br>タイトル：MacBook Pro<br>フィンガープリント：SHA256:abc123...<br><br>このキーを追加した覚えがない場合は、<span class=\"link\">SSHキー設定</span>からすぐに削除してください。",
     answer:"real",explain:"公式のgithub.comドメイン、具体的な技術情報（SSHフィンガープリント）、落ち着いた情報提供のトーン。GitHubの実際の通知フォーマットと完全に一致しています。"},

     body:"お客様のアカウントへの不正アクセスが試みられました。<br><br>お客様を保護するため、アカウントが<span class=\"highlight\">ロック</span>されました。<br><br><span class=\"highlight\">12時間以内</span>に下記リンクから本人確認を行わない場合、すべての銀行サービスが永久に利用停止となります。<br><br><span class=\"link\">https://mufg1-id.com/unlock</span>",
     answer:"phishing",explain:"<strong>mufg1-id.com</strong>は三菱UFJ銀行の正規ドメインではありません（正規：mufg.jp）。12時間の期限とすべてのサービス喪失の脅しは典型的なフィッシングの手口です。"},
    {from:"noreply@netflix.com",fromName:"Netflix",subject:"お支払い方法の更新をお願いします",to:"自分",
     body:"こんにちは、<br><br>登録されているお支払い方法の有効期限が切れているため、次の請求サイクルの処理ができませんでした。<br><br>サービスが中断されないよう、Netflixアカウントにサインインしてお支払い情報を更新してください。<br><br><span class=\"link\">netflix.com/YourAccount</span>",
     answer:"real",explain:"公式のnetflix.comドメイン、合理的な説明（カードの有効期限切れ）、不審なリンクではなくウェブサイトのアドレスへの誘導。Netflixの実際の通知スタイルと一致しています。"},
    {from:"admin@mufg-secure.net",fromName:"三菱UFJ銀行",subject:"【三菱UFJ】セキュリティ証明書の更新が必要 — オンラインバンキングが制限されています",to:"自分",
     body:"お客様のセキュリティ証明書の有効期限が切れており、オンラインバンキングへのアクセスが<span class=\"highlight\">制限</span>されています。<br><br>下記リンクから<span class=\"highlight\">マイナンバーと口座番号</span>を入力して証明書を更新してください。<br><br><span class=\"link\">【証明書を更新する】</span><br><br>注意：24時間以内に更新しない場合、アカウントが停止されます。",
     answer:"phishing",explain:"<strong>mufg-secure.net</strong>は三菱UFJ銀行の正規ドメインではありません（正規：mufg.jp）。メールでマイナンバーと口座番号を求めるのは100%フィッシングです。銀行がメールでこれらの情報を求めることは絶対にありません。"},
    {from:"noreply@linkedin.com",fromName:"LinkedIn",subject:"田中太郎さんがあなたのプロフィールを閲覧しました",to:"自分",
     body:"こんにちは、<br><br>先週5人があなたのプロフィールを閲覧しました。<br><br>1. 田中太郎 — マイクロソフト HRマネージャー<br>2. 山田花子 — グーグル デベロッパー<br><br>LinkedInで他に誰があなたのプロフィールを閲覧したか確認しましょう。",
     answer:"real",explain:"公式のlinkedin.comドメイン、標準的なLinkedIn通知フォーマット、個人情報の要求なし、穏やかなトーン。これはLinkedInの実際のプロフィール閲覧通知とまったく同じです。"},
    {from:"delivery@yamato-logistics.net",fromName:"ヤマト運輸",subject:"お荷物をお届けできませんでした — 住所の確認が必要です",to:"自分",
     body:"お荷物のお届けができませんでした。<br><br>お問い合わせ番号：7489-2301-5634<br><br>再配達のために、下記リンクから<span class=\"highlight\">氏名・電話番号・住所・マイナンバー</span>をご提供ください。<br><br><span class=\"link\">https://yamato-logistics.net/redelivery</span>",
     answer:"phishing",explain:"<strong>yamato-logistics.net</strong>はヤマト運輸の正規ドメインではありません（正規：kuronekoyamato.co.jp）。荷物の再配達に<strong>マイナンバー</strong>を求めることは絶対にありません。これは完全なフィッシングです。"},
    {from:"noreply@steam.com",fromName:"Steam",subject:"購入確認：ELDEN RING",to:"自分",
     body:"こんにちは、<br><br>ご購入が完了しました：<br><br>ゲーム：ELDEN RING<br>価格：¥7,590<br>お支払い：****-1234<br><br>この購入に心当たりがない場合は、<span class=\"link\">Steamサポート</span>にお問い合わせください。",
     answer:"real",explain:"公式のsteam.comドメイン、具体的な購入情報、穏やかなトーン、追加リンクをクリックする必要がありません。Steamの実際の購入確認メールのフォーマットと一致しています。"}
];

let currentQ = 0;
let score = 0;

function showQuestion() {
    if (currentQ >= QUESTIONS.length) { showResult(); return; }
    const q = QUESTIONS[currentQ];
    const pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = "問題 " + (currentQ + 1) + " / " + QUESTIONS.length;

    document.getElementById("quizSection").innerHTML =
        "<div class=\"email-card\">" +
            "<div class=\"email-header\">" +
                "<div class=\"email-from\">差出人: <strong>" + q.fromName + "</strong> &lt;" + q.from + "&gt;</div>" +
                "<div class=\"email-subject\">" + q.subject + "</div>" +
                "<div class=\"email-to\">宛先: " + q.to + "</div>" +
            "</div>" +
            "<div class=\"email-body\">" + q.body + "</div>" +
            "<div class=\"btn-row\">" +
                "<div class=\"btn-real\" onclick=\"answer('real')\">✅ 本物のメール</div>" +
                "<div class=\"btn-phishing\" onclick=\"answer('phishing')\">🎣 フィッシング！</div>" +
            "</div>" +
            "<div class=\"explanation\" id=\"explanation\"></div>" +
        "</div>";
}

function answer(choice) {
    const q = QUESTIONS[currentQ];
    const correct = choice === q.answer;
    if (correct) score++;

    const el = document.getElementById("explanation");
    el.className = "explanation " + (correct ? "correct" : "wrong");
    el.innerHTML = "<strong>" + (correct ? "✅ 正解！" : "❌ 不正解！") + "</strong> (" + (q.answer === "phishing" ? "これはフィッシングメールです" : "これは本物のメールです") + ")<br><br>" + q.explain;
    el.style.display = "block";

    document.querySelectorAll(".btn-real,.btn-phishing").forEach(function(b) { b.style.pointerEvents = "none"; b.style.opacity = "0.5"; });

    setTimeout(function() { currentQ++; showQuestion(); }, 3000);
}

function showResult() {
    document.getElementById("quizSection").style.display = "none";
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("progressText").textContent = "完了！";

    let grade, gradeColor, gradeText;
    if (score >= 9) { grade = "S"; gradeColor = "#00e676"; gradeText = "フィッシングマスター！どんなハッカーもあなたを騙せません。"; }
    else if (score >= 7) { grade = "A"; gradeColor = "#00e676"; gradeText = "優秀！ほとんどのフィッシングを見抜けます。"; }
    else if (score >= 5) { grade = "B"; gradeColor = "#ffeb3b"; gradeText = "まずまず。フィッシング検出スキルをさらに磨きましょう。"; }
    else if (score >= 3) { grade = "C"; gradeColor = "#ff9800"; gradeText = "危険！フィッシング攻撃に引っかかる可能性があります。"; }
    else { grade = "F"; gradeColor = "#ff5252"; gradeText = "要注意！フィッシング対策の学習が急務です。"; }

    const section = document.getElementById("resultSection");
    section.innerHTML =
        "<div class=\"result-score\" style=\"color:" + gradeColor + ";\">" + score + " / " + QUESTIONS.length + "</div>" +
        "<div class=\"result-grade\" style=\"color:" + gradeColor + ";\">評価: " + grade + "</div>" +
        "<div class=\"result-text\">" + gradeText + "</div>" +
        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 もう一度挑戦</button>" +
        "<div class=\"tips-card\" style=\"margin-top:24px;\">" +
            "<div class=\"tips-title\">🎣 フィッシングメールの5つの見分け方</div>" +
            "<div class=\"tips-text\">" +
                "<strong>1. 送信者アドレスを確認</strong> — ドメインが公式サイトと異なる場合はフィッシング（amaz0n、paypa1など）<br>" +
                "<strong>2. 緊急性と脅し文句</strong> — 「24時間以内に」「即座に」「永久削除」はフィッシングの常套手段<br>" +
                "<strong>3. 個人情報の要求</strong> — メールでパスワード・マイナンバー・カード番号を求めたら100%フィッシング<br>" +
                "<strong>4. リンクの確認</strong> — リンクにカーソルを合わせて、実際のURLが公式サイトを指しているか確認<br>" +
                "<strong>5. 文体と文法</strong> — 不自然な日本語・スペルミス・不自然な表現はフィッシングのサイン" +
            "</div>" +
        "</div>";
    section.style.display = "block";
}

showQuestion();
