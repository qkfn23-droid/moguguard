    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .quiz-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace}
        .q-text{font-size:17px;color:#e0e0e0;line-height:1.6;margin-bottom:20px;font-weight:600}
        .options{display:flex;flex-direction:column;gap:8px}
        .opt{padding:12px 16px;background:rgba(0,255,65,0.04);border:1px solid #00ff4120;border-radius:6px;color:#aaa;font-size:14px;cursor:pointer;transition:all .2s}
        .opt:hover{border-color:#00ff41;color:#00ff41}
        .opt.correct{border-color:#00ff41;background:rgba(0,255,65,0.15);color:#00ff41}
        .opt.wrong{border-color:#ff5252;background:rgba(255,82,82,0.15);color:#ff5252}
        .explain{display:none;margin-top:12px;padding:12px;background:#0f0f0f;border-radius:6px;font-size:13px;color:#888;line-height:1.6}
        .result-section{display:none;text-align:center}
        .r-score{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}
        .r-grade{font-size:28px;margin-top:8px}.r-text{font-size:14px;color:#888;margin:16px 0}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🧠 セキュリティ常識クイズ</h2>
        <p>20問でセキュリティ知識をテストしましょう</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">1 / 20</div>
    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">共有:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='コピー完了!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URLコピー</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const Q=[
{q:"HTTPSの「S」は何を意味しますか？",o:["Super（超高速）","Secure（安全）","Safe（安心）","Speed（速度）"],a:1,e:"HTTPSの「S」はSecure（安全）を意味します。SSL/TLSを使って通信を暗号化し、データを保護することを意味します。"},
{q:"フィッシング攻撃の目的は何ですか？",o:["コンピュータを速くする","個人情報を盗む","ウイルスを除去する","インターネット速度を上げる"],a:1,e:"フィッシングは信頼できる組織を装い、パスワードやクレジットカード番号などの個人情報を盗みます。"},
{q:"安全なパスワードの推奨最低文字数は？",o:["4文字","6文字","8文字","12文字以上"],a:3,e:"セキュリティの専門家は12文字以上を推奨しています。パスワードの長さは強度において最も重要な要素です。"},
{q:"二段階認証（2FA）とは何ですか？",o:["パスワードを2回入力する","パスワード＋追加の認証ステップ","2つの別々のアカウントを使う","2つの異なるブラウザを使う"],a:1,e:"2FAはパスワードにSMSコードや認証アプリなどの第2の認証手段を追加し、アカウントの乗っ取りを非常に困難にします。"},
{q:"公共Wi-Fiで最も危険な行為は何ですか？",o:["ニュースを読む","YouTubeを見る","ネットバンキングを使う","天気を確認する"],a:2,e:"公共Wi-Fiでの銀行取引は非常に危険です。攻撃者が中間者攻撃でデータを傍受できる可能性があります。"},
{q:"ランサムウェアに感染するとどうなりますか？",o:["コンピュータが速くなる","ファイルが暗号化されて身代金を要求される","無料ゲームがインストールされる","インターネットが速くなる"],a:1,e:"ランサムウェアはファイルを暗号化し、復号化キーと引き換えに（通常は暗号通貨で）身代金を要求します。"},
{q:"VPNの主な機能は何ですか？",o:["インターネット速度を上げる","通信を暗号化してIPアドレスを隠す","ウイルスを除去する","ストレージを増やす"],a:1,e:"VPNはインターネット接続を暗号化し、実際のIPアドレスを隠すことでオンラインプライバシーを保護します。"},
{q:"ソーシャルエンジニアリングとは何ですか？",o:["SNSのマーケティング手法","人間の心理を操作してハッキングする","SNSプラットフォームの開発","ネットワークエンジニアリング"],a:1,e:"ソーシャルエンジニアリングは技術的な脆弱性ではなく、人間の心理を悪用して機密情報を引き出す手法です。"},
{q:"不明な送信者から.exe添付ファイルのメールが届きました。どうすべきですか？",o:["すぐに実行する","絶対に開かない","興味があれば開く","知り合いが送ったなら開く"],a:1,e:".exeはマルウェアを含む可能性のある実行ファイルです。信頼できないソースからの.exe添付ファイルは絶対に開かないでください。"},
{q:"ファイアウォールの役割は何ですか？",o:["火事を防ぐ","ネットワークトラフィックをフィルタリングする","コンピュータを冷やす","バッテリーを節約する"],a:1,e:"ファイアウォールはネットワークトラフィックを監視・制御し、デバイスへの不正アクセスをブロックします。"},
{q:"ブラウザのCookieとは何ですか？",o:["コンピュータウイルス","ウェブサイトが保存する小さなデータ","ハッキングツール","メールの一種"],a:1,e:"CookieはウェブサイトがブラウザにログインID状態や設定などを記憶するために保存する小さなデータファイルです。"},
{q:"DDoS攻撃とは何ですか？",o:["サーバーのデータを削除する","大量のトラフィックでサーバーをダウンさせる","パスワードを解読する","メールを傍受する"],a:1,e:"分散型サービス拒否（DDoS）攻撃は、多数のマシンから大量のトラフィックをサーバーに送りつけ、オフラインにする攻撃です。"},
{q:"「password123」は安全なパスワードですか？",o:["非常に安全","まあまあ安全","弱い","即座に解読される"],a:3,e:"「password123」はあらゆる流出パスワードリストのトップに載っており、攻撃者はミリ秒以内に解読できます。"},
{q:"スミッシングとは何ですか？",o:["スマートフォンの修理","SMSを使ったフィッシング","スパムメールのブロック","スマートホームのハッキング"],a:1,e:"スミッシングはSMSを通じて行われるフィッシングです。攻撃者が偽のリンクを送って個人情報を盗みます。"},
{q:"ウイルス対策ソフトはいくつインストールすべきですか？",o:["多ければ多いほどよい","1つだけ","3つ以上","不要"],a:1,e:"ウイルス対策ソフトは1つだけインストールしてください。複数のソフトが競合し、実際にはセキュリティが低下する可能性があります。"},
{q:"地面に落ちているUSBドライブを見つけました。正しい対応は？",o:["好奇心から挿してみる","持ち主に返せるなら返す","セキュリティ管理者に渡す","フォーマットして使う"],a:2,e:"不明なUSBドライブには挿入時に自動実行するマルウェアが仕込まれている可能性があります。挿さずにセキュリティ担当者に渡してください。"},
{q:"ゼロデイ脆弱性とは何ですか？",o:["初日に発見されたバグ","まだパッチが当たっていないセキュリティ上の欠陥","フリーソフトのバグ","サーバーのダウンタイム"],a:1,e:"ゼロデイ脆弱性はベンダーに知られていないか、まだパッチが提供されていないセキュリティ上の欠陥で、非常に危険です。"},
{q:"多要素認証（MFA）の説明として最も適切なものは？",o:["強力なパスワードを1つ使う","2つ以上の要素で本人確認する","複数のデバイスからログインする","複数のブラウザを使う"],a:1,e:"MFAはパスワード＋認証アプリなど2つ以上の独立した認証要素を必要とし、不正アクセスのリスクを大幅に低下させます。"},
{q:"ブラウザのシークレット（プライベート）モードで完全に匿名になれますか？",o:["はい、完全に匿名","いいえ — ISPやウェブサイトには見える","IPアドレスも隠せる","ハッキングも防げる"],a:1,e:"シークレットモードはブラウザがローカルの閲覧履歴を保存しないだけです。インターネットプロバイダーやアクセスしたサイトにはあなたの活動が見えます。"},
{q:"最も安全な一般的な二段階認証方法はどれですか？",o:["SMS（テキストメッセージ）コード","メール認証リンク","OTPアプリ（Google認証システムなど）","パスワードのみ"],a:2,e:"OTPアプリ（Google認証システム、Authyなど）は端末内でタイムベースのコードを生成するため、通信中に傍受されることがなく、SMSコードよりも安全です。"}
];

let cur=0,score=0;

function show(){
    if(cur>=Q.length){result();return;}
    document.getElementById("pf").style.width=(cur/Q.length*100)+"%";
    document.getElementById("pt").textContent=(cur+1)+" / "+Q.length;
    const q=Q[cur];
    document.getElementById("quizArea").innerHTML=
        "<div class=\"quiz-card\">" +
            "<div class=\"q-num\">Q"+(cur+1)+"</div>" +
            "<div class=\"q-text\">"+q.q+"</div>" +
            "<div class=\"options\">"+q.o.map(function(o,i){return "<div class=\"opt\" onclick=\"ans("+i+")\">"+o+"</div>";}).join("")+"</div>" +
            "<div class=\"explain\" id=\"exp\"></div>" +
        "</div>";
}

function ans(i){
    const q=Q[cur];const correct=i===q.a;if(correct)score++;
    document.querySelectorAll(".opt").forEach(function(o,j){
        o.style.pointerEvents="none";
        if(j===q.a)o.className="opt correct";
        else if(j===i&&!correct)o.className="opt wrong";
    });
    document.getElementById("exp").style.display="block";
    document.getElementById("exp").innerHTML=(correct?"✅ 正解！ ":"❌ 不正解！ ")+q.e;
    setTimeout(function(){cur++;show();},2500);
}

function result(){
    document.getElementById("quizArea").style.display="none";
    document.getElementById("pf").style.width="100%";
    document.getElementById("pt").textContent="完了！";
    let g,c;
    if(score>=18){g="S";c="#00ff41";}else if(score>=15){g="A";c="#00ff41";}
    else if(score>=12){g="B";c="#ffeb3b";}else if(score>=8){g="C";c="#ff9800";}
    else{g="F";c="#ff5252";}
    document.getElementById("resultArea").innerHTML=
        "<div class=\"r-score\" style=\"color:"+c+"\">"+score+" / "+Q.length+"</div>" +
        "<div class=\"r-grade\" style=\"color:"+c+"\">評価: "+g+"</div>" +
        "<div class=\"r-text\">"+(score>=18?"セキュリティエキスパートレベル！":score>=15?"優秀な結果です！":score>=12?"平均以上です。":score>=8?"もう少し勉強が必要です。":"サイバーセキュリティのトレーニングが急務です！")+"</div>" +
        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 もう一度挑戦</button>";
    document.getElementById("resultArea").style.display="block";
}
show();
</script>
</body>
</html>
