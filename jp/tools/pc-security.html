    <meta property="og:title" content="PCセキュリティ診断 | MOGU Guard">

    {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[
    {"@type":"Question","name":"PCセキュリティが重要な理由は？","acceptedAnswer":{"@type":"Answer","text":"PCにはドキュメント・写真・金融情報が保存されています。ランサムウェア・キーロガーなどのマルウェア感染によりデータ損失や金銭的被害が発生する可能性があります。"}}
    ]}
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .checklist{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:24px;margin-bottom:24px}
        .check-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;transition:background .2s}
        .check-item:last-child{border-bottom:none}.check-item:hover{background:rgba(0,255,65,0.03)}
        .check-item input{width:20px;height:20px;accent-color:#00ff41;cursor:pointer}
        .check-item label{flex:1;cursor:pointer;font-size:14px;line-height:1.5}.check-item label strong{color:#00ff41}
        .check-item .risk{font-size:11px;padding:2px 8px;border-radius:3px;margin-left:8px}
        .risk-high{background:rgba(255,82,82,0.15);color:#ff5252}.risk-mid{background:rgba(255,152,0,0.15);color:#ff9800}.risk-low{background:rgba(0,255,65,0.15);color:#00ff41}
        .result-box{display:none;text-align:center;background:#111;border:1px solid #00ff4130;border-radius:8px;padding:30px;margin-bottom:20px}
        .score-num{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}
        .score-grade{font-size:20px;margin-top:8px}
        .score-bar{height:12px;background:#1a1a1a;border-radius:6px;overflow:hidden;margin:16px 0}.score-fill{height:100%;border-radius:6px;transition:width .5s}
        .tips{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-top:16px;display:none}
        .tips-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .tips-text{font-size:14px;color:#888;line-height:1.8}.tips-text strong{color:#ff5252}
        .calc-btn{width:100%;padding:14px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        .calc-btn:hover{background:#00cc33}
        .disclaimer{text-align:center;font-size:11px;color:#333;margin-top:20px}footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>💻 PCセキュリティ診断</h2>
        <p>当てはまる項目すべてにチェックを入れてください</p>
    </div>

    <div class="checklist">
        <div class="check-item"><input type="checkbox" id="c1" onchange="calc()"><label for="c1"><strong>ウイルス対策ソフト</strong>がインストールされ、リアルタイム保護が有効になっている</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c2" onchange="calc()"><label for="c2"><strong>OS（Windows/Mac）</strong>が最新バージョンにアップデートされている</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c3" onchange="calc()"><label for="c3"><strong>ファイアウォール</strong>が有効になっている</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c4" onchange="calc()"><label for="c4"><strong>ログインパスワード</strong>が設定されている（自動ログインは使っていない）</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c5" onchange="calc()"><label for="c5"><strong>ブラウザ</strong>を最新の状態に保っている</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c6" onchange="calc()"><label for="c6">不審な<strong>メールの添付ファイル</strong>は絶対に開かない</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c7" onchange="calc()"><label for="c7">重要なファイルは定期的に<strong>バックアップ</strong>している（外付けドライブ・クラウド）</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c8" onchange="calc()"><label for="c8">使っていない<strong>プログラムをアンインストール</strong>済み</label><span class="risk risk-low">推奨</span></div>
        <div class="check-item"><input type="checkbox" id="c9" onchange="calc()"><label for="c9">管理者アカウントではなく<strong>標準ユーザーアカウント</strong>でPCを使用している</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c10" onchange="calc()"><label for="c10">信頼できないウェブサイトからは<strong>ファイルをダウンロードしない</strong></label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c11" onchange="calc()"><label for="c11"><strong>USBの自動実行</strong>が無効になっている</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c12" onchange="calc()"><label for="c12">ブラウザの<strong>パスワード保存</strong>が無効、またはパスワードマネージャーを使用している</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c13" onchange="calc()"><label for="c13"><strong>スクリーンセーバー・自動ロック</strong>が設定されている</label><span class="risk risk-low">推奨</span></div>
        <div class="check-item"><input type="checkbox" id="c14" onchange="calc()"><label for="c14">不要な場合は<strong>リモートデスクトップ</strong>を無効にしている</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c15" onchange="calc()"><label for="c15"><strong>ディスク暗号化</strong>（BitLocker / FileVault）を使用している</label><span class="risk risk-low">推奨</span></div>
    </div>

    <button class="calc-btn" onclick="showResult()">💻 セキュリティスコアを確認</button>

    <div class="result-box" id="resultBox">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
        <div class="score-grade" id="scoreGrade"></div>
    </div>

    <div class="tips" id="tips">
        <div class="tips-title">⚠️ 未チェック項目</div>
        <div class="tips-text" id="tipsText"></div>
    </div>

    <div class="disclaimer">💻 これは自己診断チェックリストです。</div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">共有:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:5px 10px;background:#25d366;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='コピー完了!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URLコピー</a></div>
<footer>© 2025 MOGU Guard</footer>

<script>
const labels = ["ウイルス対策インストール済み＋リアルタイム保護有効","OSを最新バージョンにアップデート済み","ファイアウォールが有効","ログインパスワードを設定済み","ブラウザを最新の状態に保っている","不審なメールの添付ファイルは絶対に開かない","重要なファイルを定期的にバックアップ","使っていないプログラムをアンインストール済み","標準ユーザーアカウントを使用","信頼できないサイトからダウンロードしない","USBの自動実行が無効","ブラウザのパスワード保存が無効またはパスワードマネージャーを使用","スクリーンセーバー・自動ロックを設定済み","リモートデスクトップを無効化","ディスク暗号化を使用"];
function calc(){}
function showResult(){
    let checked=0,unchecked=[];
    for(let i=1;i<=15;i++){if(document.getElementById("c"+i).checked)checked++;else unchecked.push(labels[i-1]);}
    const score=Math.round((checked/15)*100);
    let grade,color;
    if(score>=90){grade="🟢 鉄壁の守り！PCのセキュリティは非常に高いです。";color="#00ff41";}
    else if(score>=70){grade="🟡 良好。少し改善すれば完璧です。";color="#ffeb3b";}
    else if(score>=50){grade="🟠 注意。重要なセキュリティ設定が不足しています。";color="#ff9800";}
    else{grade="🔴 危険！PCが攻撃に対して脆弱な状態です。";color="#ff5252";}
    document.getElementById("scoreNum").textContent=score+" pt";
    document.getElementById("scoreNum").style.color=color;
    document.getElementById("scoreFill").style.width=score+"%";
    document.getElementById("scoreFill").style.background=color;
    document.getElementById("scoreGrade").textContent=grade;
    document.getElementById("scoreGrade").style.color=color;
    document.getElementById("resultBox").style.display="block";
    if(unchecked.length>0){document.getElementById("tipsText").innerHTML=unchecked.map(t=>"• <strong>"+t+"</strong>").join("<br>");document.getElementById("tips").style.display="block";}
    else{document.getElementById("tips").style.display="none";}
    document.getElementById("resultBox").scrollIntoView({behavior:"smooth"});
}
</script>
</body>
