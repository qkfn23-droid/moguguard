    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .checklist{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:24px;margin-bottom:24px}
        .check-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;transition:background .2s}
        .check-item:last-child{border-bottom:none}.check-item:hover{background:rgba(0,255,65,0.03)}
        .check-item input{width:20px;height:20px;accent-color:#00ff41;cursor:pointer}
        .check-item label{flex:1;cursor:pointer;font-size:14px;line-height:1.5}.check-item label strong{color:#00ff41}
        .check-item .risk{font-size:11px;padding:2px 8px;border-radius:3px;margin-left:8px}
        .risk-high{background:rgba(255,82,82,0.15);color:#ff5252}.risk-mid{background:rgba(255,152,0,0.15);color:#ff9800}.risk-low{background:rgba(0,255,65,0.15);color:#00ff41}
        .result-box{display:none;text-align:center;background:#111;border:1px solid #00ff4130;border-radius:8px;padding:30px;margin-bottom:20px}
        .score-num{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}
        .score-grade{font-size:20px;margin-top:8px}
        .score-bar{height:12px;background:#1a1a1a;border-radius:6px;overflow:hidden;margin:16px 0}.score-fill{height:100%;border-radius:6px;transition:width .5s}
        .tips{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-top:16px;display:none}
        .tips-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .tips-text{font-size:14px;color:#888;line-height:1.8}.tips-text strong{color:#ff5252}
        .calc-btn{width:100%;padding:14px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        .calc-btn:hover{background:#00cc33}
        .disclaimer{text-align:center;font-size:11px;color:#333;margin-top:20px}footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>

<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>💻 내 PC 보안 점수</h2>
        <p>해당하는 항목을 체크하세요</p>
    </div>

    <div class="checklist">
        <div class="check-item"><input type="checkbox" id="c1" onchange="calc()"><label for="c1"><strong>백신 프로그램</strong>이 설치되어 있고 실시간 보호가 켜져 있다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c2" onchange="calc()"><label for="c2"><strong>운영체제(Windows/Mac)</strong>를 최신 버전으로 업데이트했다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c3" onchange="calc()"><label for="c3"><strong>방화벽</strong>이 활성화되어 있다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c4" onchange="calc()"><label for="c4"><strong>로그인 비밀번호</strong>를 설정했다 (자동 로그인 아님)</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c5" onchange="calc()"><label for="c5"><strong>브라우저</strong>를 최신 버전으로 유지하고 있다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c6" onchange="calc()"><label for="c6">의심스러운 <strong>이메일 첨부파일</strong>을 열지 않는다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c7" onchange="calc()"><label for="c7">중요한 파일을 <strong>정기 백업</strong>하고 있다 (외장하드/클라우드)</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c8" onchange="calc()"><label for="c8">사용하지 않는 <strong>프로그램을 삭제</strong>했다</label><span class="risk risk-low">권장</span></div>
        <div class="check-item"><input type="checkbox" id="c9" onchange="calc()"><label for="c9"><strong>관리자 권한</strong>이 아닌 일반 사용자 계정으로 사용한다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c10" onchange="calc()"><label for="c10">신뢰할 수 없는 사이트에서 <strong>파일 다운로드</strong>를 하지 않는다</label><span class="risk risk-high">필수</span></div>
        <div class="check-item"><input type="checkbox" id="c11" onchange="calc()"><label for="c11"><strong>USB 자동실행</strong>을 비활성화했다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c12" onchange="calc()"><label for="c12">브라우저에 <strong>비밀번호 저장</strong>을 하지 않거나 비밀번호 관리자를 사용한다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c13" onchange="calc()"><label for="c13"><strong>화면 보호기/자동 잠금</strong>을 설정했다</label><span class="risk risk-low">권장</span></div>
        <div class="check-item"><input type="checkbox" id="c14" onchange="calc()"><label for="c14"><strong>원격 데스크톱</strong>이 필요 없다면 꺼두었다</label><span class="risk risk-mid">중요</span></div>
        <div class="check-item"><input type="checkbox" id="c15" onchange="calc()"><label for="c15"><strong>디스크 암호화</strong>(BitLocker/FileVault)를 사용하고 있다</label><span class="risk risk-low">권장</span></div>
    </div>

    <button class="calc-btn" onclick="showResult()">💻 보안 점수 확인</button>

    <div class="result-box" id="resultBox">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
        <div class="score-grade" id="scoreGrade"></div>
    </div>

    <div class="tips" id="tips">
        <div class="tips-title">⚠️ 체크하지 않은 항목</div>
        <div class="tips-text" id="tipsText"></div>
    </div>

    <div class="disclaimer">💻 자가진단 체크리스트입니다.</div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">공유:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:5px 10px;background:#25d366;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URL 복사</a></div>
<footer>© 2025 MOGU Guard</footer>

<script>
const labels = ["백신 프로그램 설치 + 실시간 보호","OS 최신 업데이트","방화벽 활성화","로그인 비밀번호 설정","브라우저 최신 버전 유지","의심스러운 이메일 첨부파일 열지 않기","중요 파일 정기 백업","사용하지 않는 프로그램 삭제","일반 사용자 계정으로 사용","신뢰할 수 없는 사이트에서 다운로드 금지","USB 자동실행 비활성화","브라우저 비밀번호 저장 주의","화면 보호기/자동 잠금 설정","원격 데스크톱 비활성화","디스크 암호화 사용"];
function calc(){}
function showResult(){
    let checked=0,unchecked=[];
    for(let i=1;i<=15;i++){if(document.getElementById('c'+i).checked)checked++;else unchecked.push(labels[i-1]);}
    const score=Math.round((checked/15)*100);
    let grade,color;
    if(score>=90){grade='🟢 철벽 방어! 매우 안전합니다.';color='#00ff41';}
    else if(score>=70){grade='🟡 양호. 몇 가지 보강하면 완벽합니다.';color='#ffeb3b';}
    else if(score>=50){grade='🟠 주의. 중요한 보안 설정이 빠져있습니다.';color='#ff9800';}
    else{grade='🔴 위험! PC가 공격에 취약합니다.';color='#ff5252';}
    document.getElementById('scoreNum').textContent=score+'점';
    document.getElementById('scoreNum').style.color=color;
    document.getElementById('scoreFill').style.width=score+'%';
    document.getElementById('scoreFill').style.background=color;
    document.getElementById('scoreGrade').textContent=grade;
    document.getElementById('scoreGrade').style.color=color;
    document.getElementById('resultBox').style.display='block';
    if(unchecked.length>0){document.getElementById('tipsText').innerHTML=unchecked.map(t=>'• <strong>'+t+'</strong>').join('<br>');document.getElementById('tips').style.display='block';}
    else{document.getElementById('tips').style.display='none';}
    document.getElementById('resultBox').scrollIntoView({behavior:'smooth'});
}
</script>
