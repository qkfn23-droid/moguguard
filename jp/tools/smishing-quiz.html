<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">共有:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='コピー完了!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URLコピー</a></div>

<script>
const QS=[
{from:"0120-01-9625",name:"ヤマト運輸",body:"【ヤマト運輸】ご不在のため、お荷物をお届けできませんでした。下記よりお受け取り方法をご確認ください。<br><span class=\"link\">http://yamato-deli.xyz/track</span>",a:"smishing",e:"<strong>yamato-deli.xyz</strong>はヤマト運輸の正規ドメインではありません（正規：kuronekoyamato.co.jp）。ヤマト運輸がSMSで個人情報の確認を求めるリンクを送ることはありません。"},
{from:"NTTdocomo",name:"NTTドコモ",body:"【NTTドコモ】今月のご請求額は7,842円です。詳細はMy docomoアプリまたはdocomo.ne.jpでご確認ください。",a:"real",e:"正規のNTTドコモからの請求確認SMSです。不審なリンクがなく、公式サイトへの案内のみです。完全に安全です。"},
{from:"非通知",name:"不明な番号",body:"【国税庁】未納の税金<span class=\"highlight\">58,000円</span>が確認されました。<span class=\"highlight\">至急</span>お支払いいただかない場合、<span class=\"highlight\">差し押さえ</span>となります。<br><span class=\"link\">http://nta-pay.net/pay</span>",a:"smishing",e:"国税庁がSMSで個人に連絡することはありません。「至急」「差し押さえ」などの脅し文句と不審なドメインは典型的なスミッシングのサインです。"},
{from:"三菱UFJ銀行",name:"三菱UFJ銀行",body:"【三菱UFJ銀行】50,000円のお振込が完了しました。心当たりのない場合は、三菱UFJダイレクトアプリよりご確認ください。",a:"real",e:"三菱UFJ銀行からの正規の取引通知です。不審なリンクがなく、公式アプリへの案内のみです。個人情報の入力を求めていません。"},
{from:"非通知",name:"不明な番号",body:"【日本郵便】お荷物の保管期限が近づいております。下記より再配達の手続きをお願いします。<br><span class=\"link\">http://jp-post-check.net/schedule</span><br>※期限内に手続きされない場合、返送となります。",a:"smishing",e:"<strong>jp-post-check.net</strong>は日本郵便の正規ドメインではありません（正規：japanpost.jp）。日本郵便がSMSで個人の携帯番号に直接連絡することはほとんどありません。「返送」の脅しはスミッシングの手口です。"},
{from:"Uber Eats",name:"Uber Eats",body:"【Uber Eats】ご注文のチーズバーガーセットが届きました！😊 レビューを投稿すると次回の注文が300円オフになります。",a:"real",e:"Uber Eatsからの通常の配達確認SMSです。個人情報の入力を求めていないし、不審なリンクもありません。完全に安全です。"},
{from:"非通知",name:"不明な番号",body:"【警察庁】あなたの名義で不正な銀行口座が開設され、詐欺に使用されている可能性があります。<span class=\"highlight\">至急</span>担当刑事にご連絡ください。連絡先：090-XXXX-XXXX",a:"smishing",e:"警察庁や警察がSMSで個人に詐欺の警告を送ることは絶対にありません。個人の携帯番号に電話するよう誘導するのはスミッシングからビッシングへのエスカレーション詐欺の典型的な手口です。"},
{from:"楽天カード",name:"楽天カード",body:"【楽天カード】ご利用明細のお知らせ：前月のご利用残高は43,200円です。詳細は楽天カードアプリまたはrakuten-card.co.jpでご確認ください。",a:"real",e:"楽天カードからの通常の請求リマインダーです。不審なリンクがなく、公式チャンネルへの案内のみです。完全に安全です。"},
{from:"非通知",name:"不明な番号",body:"おめでとうございます！🎉 あなたがキャンペーンの<span class=\"highlight\">iPhone 16 Pro</span>に当選しました！<br>当選品受け取りには送料550円のお支払いが必要です。<br><span class=\"link\">http://event-prize.co/claim</span>",a:"smishing",e:"100%スミッシングです。「送料のみ」でプレゼントを受け取れるというSMSは最もよくあるSMS詐欺のパターンの一つです。無料のものに対してお金を支払う必要は絶対にありません。"},
{from:"Amazon",name:"Amazon",body:"【Amazon】返品リクエストが承認されました。理由：心変わり。返金は3〜5営業日以内に処理されます。",a:"real",e:"Amazonからの正規の返品確認SMSです。不審なリンクがなく、個人情報の入力を求めていません。完全に安全です。"}
];

let cur=0,score=0;

function show(){
    if(cur>=QS.length){result();return;}
    document.getElementById("pf").style.width=(cur/QS.length*100)+"%";
    document.getElementById("pt").textContent=(cur+1)+" / "+QS.length;
    const q=QS[cur];
    document.getElementById("quizArea").innerHTML=
        "<div class=\"sms-card\">" +
            "<div class=\"sms-header\"><div class=\"sms-icon\">💬</div><div class=\"sms-from\"><strong>"+q.name+"</strong><br>"+q.from+"</div></div>" +
            "<div class=\"sms-body\">"+q.body+"</div>" +
            "<div class=\"btn-row\">" +
                "<div class=\"btn-real\" onclick=\"ans('real')\">✅ 本物のSMS</div>" +
                "<div class=\"btn-smish\" onclick=\"ans('smishing')\">🚨 スミッシング！</div>" +
            "</div>" +
            "<div class=\"explain\" id=\"exp\"></div>" +
        "</div>";
}

function ans(choice){
    const q=QS[cur];const correct=choice===q.a;if(correct)score++;
    const el=document.getElementById("exp");
    el.className="explain "+(correct?"correct":"wrong");
    el.innerHTML="<strong>"+(correct?"✅ 正解！":"❌ 不正解！")+"</strong> ("+(q.a==="smishing"?"🚨 スミッシング":"✅ 本物のSMS")+")<br><br>"+q.e;
    el.style.display="block";
    document.querySelectorAll(".btn-real,.btn-smish").forEach(function(b){b.style.pointerEvents="none";b.style.opacity="0.5";});
    setTimeout(function(){cur++;show();},3000);
}

function result(){
    document.getElementById("quizArea").style.display="none";
    document.getElementById("pf").style.width="100%";
    document.getElementById("pt").textContent="完了！";
    let g,c;
    if(score>=9){g="🛡️ スミッシングマスター！";c="#00ff41";}
    else if(score>=7){g="🟢 なかなか鋭い！";c="#00ff41";}
    else if(score>=5){g="🟡 まだ改善の余地あり";c="#ffeb3b";}
    else{g="🔴 危険！スミッシングに引っかかる可能性があります";c="#ff5252";}
    document.getElementById("resultArea").innerHTML=
        "<div class=\"r-score\" style=\"color:"+c+"\">"+score+" / "+QS.length+"</div>" +
        "<div class=\"r-grade\" style=\"color:"+c+"\">"+g+"</div>" +
        "<div class=\"r-text\">スミッシングの主なサイン：<br>• 国税庁・警察などの公的機関がSMSで連絡してくることはない<br>• リンクのドメインが公式サイトと違う = スミッシング<br>• 「至急」「差し押さえ」などの脅し = スミッシング<br>• プレゼント＋支払い要求 = 100%詐欺</div>" +
        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 もう一度挑戦</button>";
    document.getElementById("resultArea").style.display="block";
}
show();
</script>
