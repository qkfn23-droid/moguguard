        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}

        .check-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;transition:background .2s}
        .check-item:last-child{border-bottom:none}

        .check-item input{width:20px;height:20px;accent-color:#00ff41;cursor:pointer}

<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>📱 スマホセキュリティ診断</h2>
        <p>当てはまる項目すべてにチェックを入れてください</p>
    </div>

    <div class="checklist">
        <div class="check-item"><input type="checkbox" id="c1" onchange="calc()"><label for="c1"><strong>画面ロック</strong>がPIN・パターン・生体認証で設定されている</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c2" onchange="calc()"><label for="c2"><strong>OSのアップデート</strong>を最新の状態に保っている</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c3" onchange="calc()"><label for="c3"><strong>アプリの自動更新</strong>が有効になっている</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c4" onchange="calc()"><label for="c4">アプリは公式ストア（Google Play / App Store）からのみインストールしている</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c5" onchange="calc()"><label for="c5"><strong>不明なソースからのインストール</strong>がブロックされている（Android）</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c6" onchange="calc()"><label for="c6">使っていないアプリの<strong>カメラ・マイク・位置情報の権限</strong>を取り消している</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c7" onchange="calc()"><label for="c7"><strong>公共Wi-Fi</strong>では銀行・決済アプリを使わない</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c8" onchange="calc()"><label for="c8">使わないときは<strong>Bluetooth</strong>をオフにしている</label><span class="risk risk-low">推奨</span></div>
        <div class="check-item"><input type="checkbox" id="c9" onchange="calc()"><label for="c9">重要なアカウントに<strong>二段階認証（2FA）</strong>を設定している</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c10" onchange="calc()"><label for="c10"><strong>SIMカードのPIN</strong>を設定している</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c11" onchange="calc()"><label for="c11"><strong>リモートロック・消去</strong>（iPhoneを探す / デバイスを探す）が有効になっている</label><span class="risk risk-mid">重要</span></div>
        <div class="check-item"><input type="checkbox" id="c12" onchange="calc()"><label for="c12">SMSやメッセージアプリで受け取った<strong>不審なリンク</strong>は絶対にタップしない</label><span class="risk risk-high">必須</span></div>
        <div class="check-item"><input type="checkbox" id="c13" onchange="calc()"><label for="c13"><strong>クラウドバックアップ</strong>を定期的に行っている</label><span class="risk risk-low">推奨</span></div>
        <div class="check-item"><input type="checkbox" id="c14" onchange="calc()"><label for="c14">ロック画面の<strong>通知プレビュー</strong>を非表示にしている</label><span class="risk risk-low">推奨</span></div>
        <div class="check-item"><input type="checkbox" id="c15" onchange="calc()"><label for="c15"><strong>自動ロックのタイマー</strong>を30秒〜1分に設定している</label><span class="risk risk-mid">重要</span></div>
    </div>

    <button class="calc-btn" onclick="showResult()">📱 セキュリティスコアを確認</button>

    <div class="result-box" id="resultBox">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
        <div class="score-grade" id="scoreGrade"></div>
    </div>

    <div class="tips" id="tips">
        <div class="tips-title">⚠️ 未チェック項目</div>
        <div class="tips-text" id="tipsText"></div>
    </div>

    <div class="disclaimer">📱 これは自己診断チェックリストです。実際のセキュリティ状態は追加の要因によって異なる場合があります。</div>
</div>

<script>
const labels = [
    "PIN・パターン・生体認証での画面ロック設定",
    "OSを最新バージョンにアップデート済み",
    "アプリの自動更新が有効",
    "公式ストアからのみアプリをインストール",
    "不明なソースからのインストールをブロック",
    "使っていないアプリのカメラ・マイク・位置情報権限を取り消し済み",
    "公共Wi-Fiで銀行アプリを使わない",
    "使わないときはBluetoothをオフ",
    "重要なアカウントに二段階認証を設定済み",
    "SIMカードのPINを設定済み",
    "リモートロック・消去が有効",
    "不審なリンクは絶対タップしない",
    "クラウドバックアップを定期的に実施",
    "ロック画面の通知プレビューを非表示",
    "自動ロックのタイマーを30秒〜1分に設定"
];

function calc() {}

function showResult() {
    let checked = 0;
    let unchecked = [];
    for (let i = 1; i <= 15; i++) {
        if (document.getElementById("c"+i).checked) checked++;
        else unchecked.push(labels[i-1]);
    }
    const score = Math.round((checked / 15) * 100);
    let grade, color;
    if (score >= 90) { grade = "🟢 優秀！セキュリティ意識が非常に高いです。"; color = "#00ff41"; }
    else if (score >= 70) { grade = "🟡 良好。少し改善すればさらに安全になります。"; color = "#ffeb3b"; }
    else if (score >= 50) { grade = "🟠 注意。重要なセキュリティ設定が不足しています。"; color = "#ff9800"; }
    else { grade = "🔴 危険！今すぐセキュリティ設定を強化してください。"; color = "#ff5252"; }

    document.getElementById("scoreNum").textContent = score + " pt";
    document.getElementById("scoreNum").style.color = color;
    document.getElementById("scoreFill").style.width = score + "%";
    document.getElementById("scoreFill").style.background = color;
    document.getElementById("scoreGrade").textContent = grade;
    document.getElementById("scoreGrade").style.color = color;
    document.getElementById("resultBox").style.display = "block";

    if (unchecked.length > 0) {
        document.getElementById("tipsText").innerHTML = unchecked.map(t => "• <strong>" + t + "</strong>").join("<br>");
        document.getElementById("tips").style.display = "block";
    } else {
        document.getElementById("tips").style.display = "none";
    }

    document.getElementById("resultBox").scrollIntoView({behavior:"smooth"});
}
</script>
</body>
