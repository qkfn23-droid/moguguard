<!DOCTYPE html>

<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .q-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px;text-align:center}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace}
        .q-text{font-size:18px;color:#e0e0e0;line-height:1.6;margin-bottom:24px;font-weight:600}
        .options{display:flex;flex-direction:column;gap:10px}
        .opt{padding:14px 20px;background:rgba(0,255,65,0.04);border:1px solid #00ff4120;border-radius:8px;color:#aaa;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
        .opt:hover{border-color:#00ff41;color:#00ff41;transform:translateX(4px)}
        .result-section{display:none;text-align:center}
        .r-emoji{font-size:80px;margin-bottom:16px}
        .r-name{font-size:32px;font-weight:900;color:#00ff41;margin-bottom:4px}
        .r-title{font-size:16px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .r-desc{font-size:14px;color:#999;line-height:1.8;text-align:left;margin-bottom:24px}
        .r-desc strong{color:#00ff41}
        .info-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-bottom:16px;text-align:left}
        .info-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .info-text{font-size:14px;color:#888;line-height:1.8}.info-text strong{color:#00ff41}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace;margin-top:20px}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🎭 ハッカータイプ診断</h2>
        <p>8問であなたのハッカータイプを診断します</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">Q1 / 8</div>
    <div id="quizSection"><div class="q-card" id="qCard"></div></div>
    <div id="resultSection" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">共有:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='コピー完了!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URLコピー</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const QS=[
{q:"誰かのSNSパスワードをなぜか知ってしまいました。どうしますか？",o:[{t:"すぐに本人に伝えて変更するよう忠告する",c:"white"},{t:"ちょっとだけ覗いて、すぐに離れる",c:"gray"},{t:"何か面白いものがないか探してみる",c:"black"},{t:"そんなことは絶対に起きない。興味がない",c:"none"}]},
{q:"ウェブサイトのバグを発見しました。どうしますか？",o:[{t:"すぐに会社に報告する",c:"white"},{t:"どれほど深刻か、もう少し調べてみる",c:"gray"},{t:"これで何ができるか考え始める",c:"black"},{t:"無視して別のサイトに移る",c:"none"}]},
{q:"ハッキング技術を学びたい理由は？",o:[{t:"セキュリティを強化して人を守るため",c:"white"},{t:"仕組みが気になるから",c:"gray"},{t:"他の人が知らないことを知りたいから",c:"black"},{t:"ハッキング？興味ない。ただインターネットを使うだけ",c:"none"}]},
{q:"友達がクラックソフトを探してほしいと頼んできました。どうしますか？",o:[{t:"リスクを説明して無料の代替手段を勧める",c:"white"},{t:"探せるけど、なんか気が引ける…",c:"gray"},{t:"もう持ってる。今送るね",c:"black"},{t:"クラックって何？",c:"none"}]},
{q:"カフェで隣の人がパスワードを入力しているのを偶然見てしまいました。どうしますか？",o:[{t:"意図的に目を逸らす — プライバシーだから",c:"white"},{t:"偶然見たけど、覚えようとはしない",c:"gray"},{t:"あ、覚えておくと便利かも",c:"black"},{t:"興味ない。スマホを見る",c:"none"}]},
{q:"最も印象的だと思う架空のキャラクターは？",o:[{t:"アイアンマン（テクノロジーで世界を救うヒーロー）",c:"white"},{t:"シャーロック・ホームズ（好奇心と分析力の天才）",c:"gray"},{t:"ジョーカー（すべてのルールを無視するカオス）",c:"black"},{t:"映画にハッカーが出てくるの？",c:"none"}]},
{q:"セキュリティ上の脆弱性があるシステムを発見しました。どうしますか？",o:[{t:"管理者に通知してパッチを待つ",c:"white"},{t:"どれほど危険か自分でテストしてみる（無断で）",c:"gray"},{t:"これで何が得られるか計算する",c:"black"},{t:"脆弱性って何？",c:"none"}]},
{q:"理想のキャリアは？",o:[{t:"セキュリティコンサルタント / ホワイトハットハッカー",c:"white"},{t:"フリーランス研究者 / バグバウンティハンター",c:"gray"},{t:"自由人（ルールに縛られるのが嫌）",c:"black"},{t:"ITとは全く関係のない仕事",c:"none"}]}
];

const TYPES={
white:{name:"ホワイトハットハッカー",emoji:"🤍",title:"ホワイトハット — 正義の守護者",
    desc:"あなたは<strong>正しい理由でテクノロジーを使います</strong>。脆弱性を見つけたら報告し、スキルがあれば人を守るために使います。企業や政府が必要としているのはまさにあなたのような人材です。",
    strength:"倫理観、専門知識、信頼性",career:"セキュリティコンサルタント、ペネトレーションテスター、CISO、セキュリティ研究者",celeb:"ケビン・ミトニック（更生後）、Troy Hunt"},
gray:{name:"グレーハットハッカー",emoji:"🩶",title:"グレーハット — 好奇心の探検家",
    desc:"あなたは<strong>好奇心に突き動かされたグレーハット</strong>です。善と悪の境界線上でテクノロジーを探求します。「これはどう動くの？」が原動力。ときどきルールを曲げることもありますが、悪意はありません。",
    strength:"好奇心、分析力、適応力",career:"バグバウンティハンター、フリーランス研究者、CTF競技者",celeb:"ジョージ・ホッツ（Geohot）"},
black:{name:"ブラックハットハッカー",emoji:"🖤",title:"ブラックハット — 闇の天才",
    desc:"システムの抜け穴を見つけて悪用する天性の才能があります。でも覚えておいてください — <strong>スキルが高いほど責任も大きい</strong>。ホワイトハットに転向すれば、さらに稼げます — 合法的に！",
    strength:"創造力、大胆さ、技術力",career:"（合法化すれば）レッドチームオペレーター、エクスプロイト開発者、セキュリティアーキテクト",celeb:"ケビン・ミトニック（更生前）"},
none:{name:"デジタル市民",emoji:"😊",title:"普通のユーザー — 平和なインターネットユーザー",
    desc:"ハッキングに興味がなく、それはまったく問題ありません！全員がハッカーである必要はありません。それでも少なくとも<strong>基本的なセキュリティの知識</strong>は身につけておきましょう。",
    strength:"穏やかさ、バランスの取れたデジタルライフ",career:"IT以外のあらゆる分野",celeb:"あなた自身！"}
};

let cur=0;const scores={white:0,gray:0,black:0,none:0};

function show(){
    if(cur>=QS.length){result();return;}
    document.getElementById("pf").style.width=(cur/QS.length*100)+"%";
    document.getElementById("pt").textContent="Q"+(cur+1)+" / "+QS.length;
    const q=QS[cur];
    document.getElementById("qCard").innerHTML=`
        <div class="q-num">QUESTION ${cur+1}</div>
        <div class="q-text">${q.q}</div>
        <div class="options">${q.o.map((o,i)=>`<div class="opt" onclick="ans('${o.c}')">${o.t}</div>`).join("")}</div>`;
}

function ans(c){scores[c]++;cur++;show();}

function result(){
    document.getElementById("quizSection").style.display="none";
    document.getElementById("pf").style.width="100%";
    document.getElementById("pt").textContent="完了！";
    const top=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
    const t=TYPES[top];
    document.getElementById("resultSection").innerHTML=`
        <div class="r-emoji">${t.emoji}</div>
        <div class="r-name">${t.name}</div>
        <div class="r-title">${t.title}</div>
        <div class="info-card"><div class="info-title">🎭 あなたのタイプ</div><div class="info-text">${t.desc}</div></div>
        <div class="info-card"><div class="info-title">💪 強み</div><div class="info-text"><strong>${t.strength}</strong></div></div>
        <div class="info-card"><div class="info-title">💼 向いているキャリア</div><div class="info-text">${t.career}</div></div>
        <div class="info-card"><div class="info-title">🌟 有名な例</div><div class="info-text">${t.celeb}</div></div>
        <button class="retry-btn" onclick="location.reload()">🔄 もう一度診断</button>`;
    document.getElementById("resultSection").style.display="block";
    document.getElementById("resultSection").scrollIntoView({behavior:"smooth"});
}
show();
</script>
</body>
</html>
