    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}

<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🧬 セキュリティ性格診断</h2>
        <p>8問であなたのセキュリティMBTIを診断します</p>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">Q1 / 8</div>

    <div id="quizSection"><div class="question-card" id="questionCard"></div></div>
    <div id="resultSection" class="result-section"></div>

    <div class="disclaimer">🧬 このテストはエンターテイメント目的です。結果は実際のセキュリティレベルを反映するものではありません。</div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">共有:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:5px 10px;background:#25d366;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='コピー完了!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URLコピー</a></div>
<footer>© 2025 MOGU Guard</footer>

<script>
// 4軸: P(疑い深い)/T(信頼する) · A(積極的)/L(のんびり) · K(知識がある)/N(無知) · S(体系的)/C(ずさん)
const QUESTIONS = [
    {q:"知らない番号から着信がありました。どうしますか？",o:[
        {t:"絶対に出ない。まず番号を調べる",s:{P:2}},
        {t:"出る — 何の用かが気になる",s:{T:2}},
        {t:"迷惑電話ブロックアプリが自動でやってくれる",s:{A:1,K:1}},
        {t:"無視する",s:{L:2}}
    ]},
    {q:"新しいアプリをインストールするとき、あなたは…",o:[
        {t:"権限リクエストを一つひとつ確認する",s:{P:1,K:1}},
        {t:"何も考えずに「許可」をタップ",s:{T:1,C:1}},
        {t:"レビューとダウンロード数を先に確認する",s:{A:1,S:1}},
        {t:"必要なら入れる。それだけ",s:{L:1,N:1}}
    ]},
    {q:"普段のパスワード管理は？",o:[
        {t:"サイトごとに別のパスワード＋パスワードマネージャー使用",s:{K:2,S:2}},
        {t:"2〜3パターンを使い回す",s:{N:1,C:1}},
        {t:"1つのパスワードをすべてに使う — 覚えやすいから",s:{T:1,C:2}},
        {t:"パスワード？自動ログインで十分",s:{L:2,N:1}}
    ]},
    {q:"公共Wi-Fi（カフェ・空港など）では…",o:[
        {t:"絶対に繋がない。モバイルデータのみ",s:{P:2}},
        {t:"VPNをオンにして接続する",s:{K:2,A:1}},
        {t:"普通に繋ぐ — 何が問題なの？",s:{T:2}},
        {t:"Wi-Fiが危険だったとは知らなかった",s:{N:2}}
    ]},
    {q:"「おめでとうございます！プレゼントに当選しました！」というSMSが届きました。どうしますか？",o:[
        {t:"100%スミッシング。即削除して報告",s:{K:2,A:1}},
        {t:"怪しい…でも本物かも？",s:{P:1,T:1}},
        {t:"リンクをタップ — もしかしたら本物かも",s:{T:2,N:1}},
        {t:"無視して次に進む",s:{L:1}}
    ]},
    {q:"OSやアプリのアップデート通知が来ました。あなたは…",o:[
        {t:"すぐにアップデート — セキュリティパッチが大事",s:{K:1,A:2}},
        {t:"後でやろう…（ずっと後回し）",s:{L:2}},
        {t:"通知を消す — うっとうしい",s:{C:2}},
        {t:"すべて自動更新に設定",s:{S:2}}
    ]},
    {q:"SNSに写真を投稿する前に…",o:[
        {t:"位置情報データを削除し、個人情報の露出を確認する",s:{P:1,S:1,K:1}},
        {t:"公開範囲を設定する（友達のみなど）",s:{A:1}},
        {t:"そのまま投稿する。何が問題なの？",s:{T:1,N:1}},
        {t:"SNSは使っていない",s:{P:2}}
    ]},
    {q:"友達が「これ見て」というリンクを送ってきました。あなたは…",o:[
        {t:"まず何のリンクか聞く",s:{P:1,A:1}},
        {t:"すぐにタップ — 友達からだから",s:{T:2}},
        {t:"まずURLを確認する",s:{K:2}},
        {t:"面倒くさい — 見ない",s:{L:1,C:1}}
    ]}
];

const TYPES = {
    PAKS:{name:"サイバー要塞",emoji:"🏰",code:"PAKS",title:"疑い深い＋積極的＋知識がある＋体系的",
        desc:"あなたは<strong>完全なセキュリティのプロ</strong>です。疑い、行動し、知識を持ち、すべてを体系的に管理します。パスワードマネージャー？当然。VPN？必須。アップデート？即座。周りから「またそれ…」と思われることもありますが、ハッキングされる確率はほぼ0%！",
        strength:"鉄壁の防御、最新のセキュリティ知識、体系的な管理",weakness:"過度な疑心暗鬼；周りを疲れさせることがある",advice:"たまには緩めても大丈夫。すべてを疑い続けるのは消耗します。"},
    PACS:{name:"デジタル番兵",emoji:"💂",code:"PACS",title:"疑い深い＋積極的＋やや知識がある＋体系的",
        desc:"疑い深くて行動力があるけど、技術的な知識がまだ不足しています。それでも<strong>危険を察知する本能</strong>がある！知識を身につければサイバー要塞に進化できます。",
        strength:"本能的な危険察知、素早い行動",weakness:"知識不足による誤検知",advice:"セキュリティの知識をもう少し身につければ完璧です。"},
    TLNC:{name:"幸せなウイルス",emoji:"😄",code:"TLNC",title:"信頼する＋のんびり＋無知＋ずさん",
        desc:"人生を楽しもう！<strong>セキュリティ？まあいいか〜</strong>タイプ。リンクをうかつにクリックし、パスワードを使い回し、アップデートが面倒で放置。正直、いつハッキングされてもおかしくない状態…これまでが運よかっただけです！",
        strength:"ストレスフリーなデジタルライフ",weakness:"ハッキングリスクが非常に高い、セキュリティ意識ゼロ",advice:"せめてパスワードを変えてください。本当に。"},
    TANS:{name:"潜在的ハッカー",emoji:"🕵️",code:"TANS",title:"信頼する＋積極的＋無知＋体系的",
        desc:"人を信じやすく行動力はあるけど、セキュリティの知識が不足しています。でも<strong>体系的な性格</strong>なので、学び始めたらすぐにセキュリティのプロになれるはず。",
        strength:"行動力、体系的な思考",weakness:"騙されやすい",advice:"フィッシングの見分け方を学ぶだけで大幅にレベルアップします。"},
    PLKS:{name:"セキュリティオタク",emoji:"🤓",code:"PLKS",title:"疑い深い＋のんびり＋知識がある＋体系的",
        desc:"セキュリティの知識は十分あるのに<strong>行動が伴わない</strong>タイプ。理論は完璧だけど実践が足りない。「アップデートしなきゃ…」と思いながらしない。知識量ほど行動できていたら最強なのに！",
        strength:"豊富なセキュリティ知識",weakness:"行動力不足、怠け癖",advice:"知っているのにやらないのが最も危険な状態。今日一つだけやってみましょう！"},
    TAKC:{name:"ラッキー冒険家",emoji:"🎲",code:"TAKC",title:"信頼する＋積極的＋知識がある＋ずさん",
        desc:"セキュリティの知識と行動力はあるのに<strong>いい加減</strong>なタイプ。「わかってるんだけど、めんどくさい」タイプ。人を信じやすい性格が時々リスクを招きます。運が良かっただけなので…",
        strength:"基本的な知識あり、適応が速い",weakness:"慢心、ずさんな習慣",advice:"知識を実践に移せばすぐにセキュリティエキスパートになれます！"}
};

let currentQ = 0;
const scores = {P:0,T:0,A:0,L:0,K:0,N:0,S:0,C:0};

function startQuiz(){currentQ=0;Object.keys(scores).forEach(k=>scores[k]=0);showQuestion();}

function showQuestion(){
    if(currentQ>=QUESTIONS.length){showResult();return;}
    const q=QUESTIONS[currentQ];
    document.getElementById("progressFill").style.width=(currentQ/QUESTIONS.length*100)+"%";
    document.getElementById("progressText").textContent="Q"+(currentQ+1)+" / "+QUESTIONS.length;
    document.getElementById("questionCard").innerHTML=`
        <div class="question-num">QUESTION ${currentQ+1}</div>
        <div class="question-text">${q.q}</div>
        <div class="options">${q.o.map((opt,i)=>`<div class="option-btn" onclick="answer(${i})">${opt.t}</div>`).join("")}</div>
    `;
}

function answer(idx){
    const s=QUESTIONS[currentQ].o[idx].s;
    Object.entries(s).forEach(([k,v])=>{scores[k]=(scores[k]||0)+v;});
    currentQ++;showQuestion();
}

function showResult(){
    document.getElementById("quizSection").style.display="none";
    document.getElementById("progressFill").style.width="100%";
    document.getElementById("progressText").textContent="完了！";

    const axis1=scores.P>=scores.T?"P":"T";
    const axis2=scores.A>=scores.L?"A":"L";
    const axis3=scores.K>=scores.N?"K":"N";
    const axis4=scores.S>=scores.C?"S":"C";
    const code=axis1+axis2+axis3+axis4;

    const type=TYPES[code]||TYPES.TLNC;

    const section=document.getElementById("resultSection");
    section.innerHTML=`
        <div class="type-emoji">${type.emoji}</div>
        <div class="type-name">${type.name}</div>
        <div class="type-code">[${type.code}] ${type.title}</div>

        <div class="stat-grid">
            <div class="stat-item"><div class="stat-label">${scores.P>=scores.T?"疑い深さ":"信頼度"}</div><div class="stat-value">${scores.P>=scores.T?"疑い深い 🔍":"信頼する 😊"}</div></div>
            <div class="stat-item"><div class="stat-label">${scores.A>=scores.L?"行動力":"回避傾向"}</div><div class="stat-value">${scores.A>=scores.L?"積極的 ⚡":"のんびり 😴"}</div></div>
            <div class="stat-item"><div class="stat-label">${scores.K>=scores.N?"知識":"無知"}</div><div class="stat-value">${scores.K>=scores.N?"詳しい 🧠":"そうでもない 🤷"}</div></div>
            <div class="stat-item"><div class="stat-label">${scores.S>=scores.C?"体系的":"ずさん"}</div><div class="stat-value">${scores.S>=scores.C?"整理上手 📋":"行き当たりばったり 🎲"}</div></div>
        </div>

        <div class="info-card">
            <div class="info-title">🧬 あなたのセキュリティタイプ</div>
            <div class="info-text">${type.desc}</div>
        </div>
        <div class="info-card">
            <div class="info-title">💪 強み</div>
            <div class="info-text"><strong>${type.strength}</strong></div>
        </div>
        <div class="info-card">
            <div class="info-title">⚠️ 弱み</div>
            <div class="info-text">${type.weakness}</div>
        </div>
        <div class="info-card">
            <div class="info-title">💡 アドバイス</div>
            <div class="info-text"><strong>${type.advice}</strong></div>
        </div>

        <button class="retry-btn" onclick="location.reload()">🔄 もう一度診断</button>
    `;
    section.style.display="block";
    section.scrollIntoView({behavior:"smooth"});
}

startQuiz();
</script>
</body>
</html>
