<body>

<script>
// 4축: P(편집증)/T(신뢰) · A(행동)/L(방관) · K(지식있음)/N(모름) · S(체계적)/C(대충)
const QUESTIONS = [
    {q:"낯선 번호에서 전화가 오면?",o:[
        {t:"절대 안 받음. 검색부터 함",s:{P:2}},
        {t:"일단 받아봄. 뭔지 궁금하니까",s:{T:2}},
        {t:"스팸 차단 앱이 알아서 걸러줌",s:{A:1,K:1}},
        {t:"그냥 무시",s:{L:2}}
    ]},
    {q:"새로운 앱을 설치할 때?",o:[
        {t:"권한 요청을 하나하나 확인함",s:{P:1,K:1}},
        {t:"별 생각 없이 '허용' 누름",s:{T:1,C:1}},
        {t:"리뷰와 다운로드 수를 먼저 확인함",s:{A:1,S:1}},
        {t:"필요하면 그냥 깔지 뭐",s:{L:1,N:1}}
    ]},
    {q:"비밀번호는 보통 어떻게?",o:[
        {t:"사이트마다 다르게 + 비밀번호 관리자 사용",s:{K:2,S:2}},
        {t:"2~3개를 돌려 씀",s:{N:1,C:1}},
        {t:"하나로 통일 (기억하기 편하게)",s:{T:1,C:2}},
        {t:"비밀번호? 자동 로그인이면 되지",s:{L:2,N:1}}
    ]},
    {q:"공용 와이파이 (카페 등)에서?",o:[
        {t:"절대 접속 안 함. 데이터만 씀",s:{P:2}},
        {t:"VPN 켜고 접속함",s:{K:2,A:1}},
        {t:"편하게 접속. 뭐 어떻게 되겠어",s:{T:2}},
        {t:"와이파이가 위험한 건지 몰랐음",s:{N:2}}
    ]},
    {q:"'축하합니다! 당첨되었습니다' 문자가 오면?",o:[
        {t:"100% 스미싱. 바로 삭제 + 신고",s:{K:2,A:1}},
        {t:"일단 의심하지만... 혹시?",s:{P:1,T:1}},
        {t:"링크 눌러봄. 진짜일 수도 있잖아",s:{T:2,N:1}},
        {t:"그냥 무시하고 넘어감",s:{L:1}}
    ]},
    {q:"OS/앱 업데이트 알림이 뜨면?",o:[
        {t:"바로 업데이트. 보안 패치 중요하니까",s:{K:1,A:2}},
        {t:"나중에 하지... (계속 미룸)",s:{L:2}},
        {t:"귀찮아서 알림을 꺼버림",s:{C:2}},
        {t:"자동 업데이트로 설정해둠",s:{S:2}}
    ]},
    {q:"SNS에 사진 올릴 때?",o:[
        {t:"위치 정보 제거, 개인정보 노출 체크",s:{P:1,S:1,K:1}},
        {t:"공개 범위 설정은 함",s:{A:1}},
        {t:"그냥 올림. 뭐가 문제야?",s:{T:1,N:1}},
        {t:"SNS 안 함",s:{P:2}}
    ]},
    {q:"친구가 '이거 봐봐' 하고 링크를 보내면?",o:[
        {t:"일단 뭔 링크인지 물어봄",s:{P:1,A:1}},
        {t:"친구니까 바로 클릭",s:{T:2}},
        {t:"URL을 먼저 확인함",s:{K:2}},
        {t:"귀찮아서 안 봄",s:{L:1,C:1}}
    ]}
];

const TYPES = {
    PAKS:{name:"사이버 요새",emoji:"🏰",code:"PAKS",title:"편집증 + 행동파 + 지식인 + 체계적",
        desc:"당신은 <strong>완벽한 보안 전문가</strong>입니다. 의심하고, 행동하고, 알고, 체계적으로 관리합니다. 비밀번호 관리자는 기본, VPN은 필수, 업데이트는 즉시. 가끔은 너무 예민해서 주변 사람들이 '또 시작이야...' 할 수도 있지만, 해킹당할 확률은 거의 0%!",
        strength:"철벽 방어, 최신 보안 지식, 체계적 관리",weakness:"과도한 의심, 주변 사람 지치게 할 수 있음",advice:"가끔은 편하게 살아도 돼요. 모든 것을 의심하면 피곤하니까."},
    PACS:{name:"디지털 경비병",emoji:"💂",code:"PACS",title:"편집증 + 행동파 + 대충 아는 + 체계적",
        desc:"의심이 많고 행동력도 있지만, 전문 지식은 부족합니다. 하지만 <strong>본능적으로 위험을 감지</strong>하는 능력이 있어요! 배움에 투자하면 사이버 요새로 진화할 수 있습니다.",
        strength:"직감적 위험 감지, 빠른 행동",weakness:"지식 부족으로 가끔 헛다리",advice:"보안 상식을 조금만 더 공부하면 완벽해져요."},
    TLNC:{name:"해피 바이러스",emoji:"😄",code:"TLNC",title:"신뢰형 + 방관자 + 모름 + 대충",
        desc:"인생은 즐기는 거지! <strong>보안? 뭐 어떻게 되겠지~</strong> 타입. 링크 아무거나 클릭, 비밀번호 하나로 통일, 업데이트는 귀찮아서 안 함. 솔직히 언제 해킹당해도 이상하지 않지만... 아직까지 운이 좋았을 뿐!",
        strength:"스트레스 없는 디지털 라이프",weakness:"해킹 위험 매우 높음, 보안 의식 제로",advice:"제발 비밀번호라도 바꾸세요. 진심으로."},
    TANS:{name:"잠재적 해커",emoji:"🕵️",code:"TANS",title:"신뢰형 + 행동파 + 모름 + 체계적",
        desc:"기본적으로 사람을 잘 믿고, 행동력은 있는데 보안 지식이 부족합니다. 하지만 <strong>체계적인 성격</strong>이라 한번 배우면 빠르게 보안 고수가 됩니다.",
        strength:"행동력, 체계적 사고",weakness:"잘 속을 수 있음",advice:"피싱 판별법만 배워도 레벨이 확 올라요."},
    PLKS:{name:"보안 오타쿠",emoji:"🤓",code:"PLKS",title:"편집증 + 방관자 + 지식인 + 체계적",
        desc:"보안 지식은 넘치는데 <strong>행동을 안 합니다</strong>. 이론적으로는 완벽한데 실천이 부족해요. '아 업데이트 해야 하는데...' 하면서 안 하는 타입. 아는 만큼 행동하면 최강인데!",
        strength:"풍부한 보안 지식",weakness:"실천력 부족, 게으름",advice:"알고 있으면서 안 하는 게 가장 위험해요. 오늘 하나만 실천!"},
    TAKC:{name:"운 좋은 모험가",emoji:"🎲",code:"TAKC",title:"신뢰형 + 행동파 + 지식있음 + 대충",
        desc:"보안 지식도 있고 행동력도 있는데 <strong>대충대충</strong>. '아 알아 알아, 근데 귀찮아~' 타입. 기본적으로 사람을 잘 믿어서 가끔 위험한 순간도. 지금까지는 운이 좋았지만...",
        strength:"기본 지식 있음, 빠른 적응",weakness:"방심, 대충하는 습관",advice:"아는 걸 실천으로 옮기면 바로 보안 고수!"}
};

let currentQ = 0;
const scores = {P:0,T:0,A:0,L:0,K:0,N:0,S:0,C:0};

function startQuiz(){currentQ=0;Object.keys(scores).forEach(k=>scores[k]=0);showQuestion();}

function showQuestion(){
    if(currentQ>=QUESTIONS.length){showResult();return;}
    const q=QUESTIONS[currentQ];
    document.getElementById('progressFill').style.width=(currentQ/QUESTIONS.length*100)+'%';
    document.getElementById('progressText').textContent=`Q${currentQ+1} / ${QUESTIONS.length}`;
    document.getElementById('questionCard').innerHTML=`
        <div class="question-num">QUESTION ${currentQ+1}</div>
        <div class="question-text">${q.q}</div>
        <div class="options">${q.o.map((opt,i)=>`<div class="option-btn" onclick="answer(${i})">${opt.t}</div>`).join('')}</div>
    `;
}

function answer(idx){
    const s=QUESTIONS[currentQ].o[idx].s;
    Object.entries(s).forEach(([k,v])=>{scores[k]=(scores[k]||0)+v;});
    currentQ++;showQuestion();
}

function showResult(){
    document.getElementById('quizSection').style.display='none';
    document.getElementById('progressFill').style.width='100%';
    document.getElementById('progressText').textContent='완료!';

    // 4축 결정
    const axis1=scores.P>=scores.T?'P':'T';
    const axis2=scores.A>=scores.L?'A':'L';
    const axis3=scores.K>=scores.N?'K':'N';
    const axis4=scores.S>=scores.C?'S':'C';
    const code=axis1+axis2+axis3+axis4;

    const type=TYPES[code]||TYPES.TLNC;

    const section=document.getElementById('resultSection');
    section.innerHTML=`
        <div class="type-emoji">${type.emoji}</div>
        <div class="type-name">${type.name}</div>
        <div class="type-code">[${type.code}] ${type.title}</div>

        <div class="stat-grid">
            <div class="stat-item"><div class="stat-label">${scores.P>=scores.T?'의심':'신뢰'}</div><div class="stat-value">${scores.P>=scores.T?'편집증 🔍':'순수함 😊'}</div></div>
            <div class="stat-item"><div class="stat-label">${scores.A>=scores.L?'행동':'방관'}</div><div class="stat-value">${scores.A>=scores.L?'행동파 ⚡':'귀찮아 😴'}</div></div>
            <div class="stat-item"><div class="stat-label">${scores.K>=scores.N?'지식':'무지'}</div><div class="stat-value">${scores.K>=scores.N?'아는 편 🧠':'모르는 편 🤷'}</div></div>
            <div class="stat-item"><div class="stat-label">${scores.S>=scores.C?'체계':'대충'}</div><div class="stat-value">${scores.S>=scores.C?'체계적 📋':'대충대충 🎲'}</div></div>
        </div>

        <div class="info-card">
            <div class="info-title">🧬 당신의 보안 유형</div>
            <div class="info-text">${type.desc}</div>
        </div>
        <div class="info-card">
            <div class="info-title">💪 강점</div>
            <div class="info-text"><strong>${type.strength}</strong></div>
        </div>
        <div class="info-card">
            <div class="info-title">⚠️ 약점</div>
            <div class="info-text">${type.weakness}</div>
        </div>
        <div class="info-card">
            <div class="info-title">💡 조언</div>
            <div class="info-text"><strong>${type.advice}</strong></div>
        </div>

        <button class="retry-btn" onclick="location.reload()">🔄 다시 테스트</button>
    `;
    section.style.display='block';
    section.scrollIntoView({behavior:'smooth'});
}

startQuiz();
</script>
</body>
</html>
