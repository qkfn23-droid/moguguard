<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🧬 Tipo de Personalidad de Seguridad Test</h2>
        <p>Find out your Security MBTI with 8 questions</p>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">Q1 / 8</div>

    <div id="quizSection"><div class="question-card" id="questionCard"></div></div>
    <div id="resultSection" class="result-section"></div>

    <div class="disclaimer">🧬 This test is for entertainment. Results may not reflect your actual security level.</div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Compartir:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:5px 10px;background:#25d366;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">Copiar URL</a></div>
<footer>© 2025 MOGU Guard</footer>

<script>
// 4 axes: P(Paranoid)/T(Trusting) · A(Active)/L(Laid-back) · K(Knowledgeable)/N(Naive) · S(Systematic)/C(Careless)
const QUESTIONS = [
    {q:"An unknown number calls you. What do you do?",o:[
        {t:"Never answer. Search the number first",s:{P:2}},
        {t:"Pick up — I'm curious what it's about",s:{T:2}},
        {t:"My spam-blocking app handles that automatically",s:{A:1,K:1}},
        {t:"Just ignore it",s:{L:2}}
    ]},
    {q:"When installing a new app, you...",o:[
        {t:"Check every permission request one by one",s:{P:1,K:1}},
        {t:"Tap 'Allow' without thinking",s:{T:1,C:1}},
        {t:"Check the reviews and download count first",s:{A:1,S:1}},
        {t:"Just install it if I need it",s:{L:1,N:1}}
    ]},
    {q:"How do you usually handle passwords?",o:[
        {t:"Different password for every site + use a password manager",s:{K:2,S:2}},
        {t:"Rotate between 2–3 passwords",s:{N:1,C:1}},
        {t:"One password for everything — easier to remember",s:{T:1,C:2}},
        {t:"Password? Auto-login is good enough",s:{L:2,N:1}}
    ]},
    {q:"On public Wi-Fi (café, airport, etc.), you...",o:[
        {t:"Never connect. Mobile data only",s:{P:2}},
        {t:"Connect with VPN on",s:{K:2,A:1}},
        {t:"Connect freely — what could go wrong?",s:{T:2}},
        {t:"I didn't know Wi-Fi could be dangerous",s:{N:2}}
    ]},
    {q:"You receive a text saying 'Congratulations! You've won a prize!' What do you do?",o:[
        {t:"100% smishing. Delete and report immediately",s:{K:2,A:1}},
        {t:"Suspicious... but what if it's real?",s:{P:1,T:1}},
        {t:"Tap the link — it might be legit",s:{T:2,N:1}},
        {t:"Just ignore it and move on",s:{L:1}}
    ]},
    {q:"An OS or app update notification appears. You...",o:[
        {t:"Update immediately — security patches matter",s:{K:1,A:2}},
        {t:"Do it later... (keeps getting postponed)",s:{L:2}},
        {t:"Dismiss the notification — too annoying",s:{C:2}},
        {t:"Set everything to auto-update",s:{S:2}}
    ]},
    {q:"Before posting a photo on social media, you...",o:[
        {t:"Strip location data, check for personal info exposure",s:{P:1,S:1,K:1}},
        {t:"Set the audience (friends only, etc.)",s:{A:1}},
        {t:"Just post it. What's the problem?",s:{T:1,N:1}},
        {t:"Don't use social media",s:{P:2}}
    ]},
    {q:"A friend sends you a link saying 'check this out'. You...",o:[
        {t:"Ask what the link is first",s:{P:1,A:1}},
        {t:"Click it right away — it's from a friend",s:{T:2}},
        {t:"Inspect the URL first",s:{K:2}},
        {t:"Too lazy — don't bother looking",s:{L:1,C:1}}
    ]}
];

const TYPES = {
    PAKS:{name:"Cyber Fortress",emoji:"🏰",code:"PAKS",title:"Paranoid + Active + Knowledgeable + Systematic",
        desc:"You are a <strong>complete security professional</strong>. You suspect, act, know, and manage everything systematically. Password manager? Basic requirement. VPN? Non-negotiable. Updates? Immediate. You might occasionally make people around you roll their eyes with 'not this again...' — but your chance of getting hacked is basically 0%!",
        strength:"Ironclad defense, up-to-date security knowledge, systematic management",weakness:"Excessive suspicion; can exhaust the people around you",advice:"It's okay to relax sometimes. Suspecting everything is exhausting."},
    PACS:{name:"Digital Sentry",emoji:"💂",code:"PACS",title:"Paranoid + Active + Somewhat Knowledgeable + Systematic",
        desc:"You're suspicious and action-oriented, but your technical knowledge isn't quite there yet. Still, you have an <strong>instinctive ability to sense danger</strong>! Invest in learning and you can evolve into a Cyber Fortress.",
        strength:"Instinctive risk detection, quick action",weakness:"Occasional false alarms due to knowledge gaps",advice:"A little more security knowledge and you'll be perfect."},
    TLNC:{name:"Happy Virus",emoji:"😄",code:"TLNC",title:"Trusting + Laid-back + Naive + Careless",
        desc:"Life is for living! <strong>Security? Whatever, it'll be fine~</strong> type. Clicks links carelessly, reuses one password everywhere, skips updates because they're annoying. Honestly, it would be no surprise if you got hacked any day now... you've just been lucky so far!",
        strength:"Stress-free digital life",weakness:"Very high hacking risk, zero security awareness",advice:"Please, at least change your password. I mean it."},
    TANS:{name:"Latent Hacker",emoji:"🕵️",code:"TANS",title:"Trusting + Active + Naive + Systematic",
        desc:"You tend to trust people easily and you have drive, but your security knowledge is lacking. However, your <strong>systematic nature</strong> means that once you start learning, you'll become a security pro very quickly.",
        strength:"Action-oriented, systematic thinking",weakness:"Easily deceived",advice:"Just learning to spot phishing will level you up significantly."},
    PLKS:{name:"Security Otaku",emoji:"🤓",code:"PLKS",title:"Paranoid + Laid-back + Knowledgeable + Systematic",
        desc:"You have plenty of security knowledge, but you <strong>don't act on it</strong>. Theoretically perfect, but lacking in practice. The type who thinks 'I really should update...' and then doesn't. If you acted as much as you knew, you'd be unstoppable!",
        strength:"Rich security knowledge",weakness:"Lack of follow-through, laziness",advice:"Knowing and not doing is the most dangerous state. Do one thing today!"},
    TAKC:{name:"Lucky Adventurer",emoji:"🎲",code:"TAKC",title:"Trusting + Active + Knowledgeable + Careless",
        desc:"You have security knowledge and drive, but you're <strong>sloppy about it</strong>. The 'yeah yeah I know, but I can't be bothered' type. Your tendency to trust people easily occasionally puts you at risk. You've been lucky so far, but...",
        strength:"Basic knowledge present, quick to adapt",weakness:"Complacency, careless habits",advice:"Put what you know into practice and you'll be a security expert instantly!"}
};

let currentQ = 0;
const scores = {P:0,T:0,A:0,L:0,K:0,N:0,S:0,C:0};

function startQuiz(){currentQ=0;Object.keys(scores).forEach(k=>scores[k]=0);showQuestion();}

function showQuestion(){
    if(currentQ>=QUESTIONS.length){showResult();return;}
    const q=QUESTIONS[currentQ];
    document.getElementById("progressFill").style.width=(currentQ/QUESTIONS.length*100)+"%";
    document.getElementById("progressText").textContent="Q"+(currentQ+1)+" / "+QUESTIONS.length;
    document.getElementById("questionCard").innerHTML=`
        <div class="question-num">QUESTION ${currentQ+1}</div>
        <div class="question-text">${q.q}</div>
        <div class="options">${q.o.map((opt,i)=>`<div class="option-btn" onclick="answer(${i})">${opt.t}</div>`).join("")}</div>
    `;
}

function answer(idx){
    const s=QUESTIONS[currentQ].o[idx].s;
    Object.entries(s).forEach(([k,v])=>{scores[k]=(scores[k]||0)+v;});
    currentQ++;showQuestion();
}

function showResult(){
    document.getElementById("quizSection").style.display="none";
    document.getElementById("progressFill").style.width="100%";
    document.getElementById("progressText").textContent="Done!";

    // Determine 4-axis result
    const axis1=scores.P>=scores.T?"P":"T";
    const axis2=scores.A>=scores.L?"A":"L";
    const axis3=scores.K>=scores.N?"K":"N";
    const axis4=scores.S>=scores.C?"S":"C";
    const code=axis1+axis2+axis3+axis4;

    const type=TYPES[code]||TYPES.TLNC;

    const section=document.getElementById("resultSection");
    section.innerHTML=`
        <div class="type-emoji">${type.emoji}</div>
        <div class="type-name">${type.name}</div>
        <div class="type-code">[${type.code}] ${type.title}</div>

        <div class="stat-grid">
            <div class="stat-item"><div class="stat-label">${scores.P>=scores.T?"Suspicion":"Trust"}</div><div class="stat-value">${scores.P>=scores.T?"Paranoid 🔍":"Trusting 😊"}</div></div>
            <div class="stat-item"><div class="stat-label">${scores.A>=scores.L?"Action":"Avoidance"}</div><div class="stat-value">${scores.A>=scores.L?"Go-getter ⚡":"Laid-back 😴"}</div></div>
            <div class="stat-item"><div class="stat-label">${scores.K>=scores.N?"Knowledge":"Naivety"}</div><div class="stat-value">${scores.K>=scores.N?"In the know 🧠":"Not so much 🤷"}</div></div>
            <div class="stat-item"><div class="stat-label">${scores.S>=scores.C?"Systematic":"Careless"}</div><div class="stat-value">${scores.S>=scores.C?"Organized 📋":"Winging it 🎲"}</div></div>
        </div>

        <div class="info-card">
            <div class="info-title">🧬 Your Security Type</div>
            <div class="info-text">${type.desc}</div>
        </div>
        <div class="info-card">
            <div class="info-title">💪 Strengths</div>
            <div class="info-text"><strong>${type.strength}</strong></div>
        </div>
        <div class="info-card">
            <div class="info-title">⚠️ Weaknesses</div>
            <div class="info-text">${type.weakness}</div>
        </div>
        <div class="info-card">
            <div class="info-title">💡 Advice</div>
            <div class="info-text"><strong>${type.advice}</strong></div>
        </div>

        <button class="retry-btn" onclick="location.reload()">🔄 Retake Test</button>
    `;
    section.style.display="block";
    section.scrollIntoView({behavior:"smooth"});
}

startQuiz();
</script>
</body>
