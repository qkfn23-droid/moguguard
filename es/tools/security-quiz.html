    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .quiz-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace}
        .q-text{font-size:17px;color:#e0e0e0;line-height:1.6;margin-bottom:20px;font-weight:600}
        .options{display:flex;flex-direction:column;gap:8px}
        .opt{padding:12px 16px;background:rgba(0,255,65,0.04);border:1px solid #00ff4120;border-radius:6px;color:#aaa;font-size:14px;cursor:pointer;transition:all .2s}
        .opt:hover{border-color:#00ff41;color:#00ff41}
        .opt.correct{border-color:#00ff41;background:rgba(0,255,65,0.15);color:#00ff41}
        .opt.wrong{border-color:#ff5252;background:rgba(255,82,82,0.15);color:#ff5252}
        .explain{display:none;margin-top:12px;padding:12px;background:#0f0f0f;border-radius:6px;font-size:13px;color:#888;line-height:1.6}
        .result-section{display:none;text-align:center}
        .r-score{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}
        .r-grade{font-size:28px;margin-top:8px}.r-text{font-size:14px;color:#888;margin:16px 0}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🧠 Cybersecurity Quiz</h2>
        <p>Test your security knowledge with 20 questions</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">1 / 20</div>
    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Compartir:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">Copiar URL</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const Q=[
{q:"What does the 'S' in HTTPS stand for?",o:["Super","Secure","Safe","Speed"],a:1,e:"The S in HTTPS stands for Secure. It means the connection is encrypted using SSL/TLS to protect your data in transit."},
{q:"What is the goal of a phishing attack?",o:["Speed up your computer","Steal personal information","Remove viruses","Increase internet speed"],a:1,e:"Phishing impersonates trusted organizations to steal personal data such as passwords and credit card numbers."},
{q:"What is the minimum recommended length for a strong password?",o:["4 characters","6 characters","8 characters","12 characters or more"],a:3,e:"Security experts recommend at least 12 characters. Password length is the single most important factor for strength."},
{q:"What is two-factor authentication (2FA)?",o:["Entering your password twice","Password plus an additional verification step","Using two separate accounts","Using two different browsers"],a:1,e:"2FA requires your password plus a second verification method such as an SMS code or authenticator app, making account takeover much harder."},
{q:"What is the most dangerous activity on public Wi-Fi?",o:["Reading the news","Watching YouTube","Online banking","Checking the weather"],a:2,e:"Banking on public Wi-Fi is very dangerous because attackers can intercept your data through a man-in-the-middle attack."},
{q:"What happens when ransomware infects your device?",o:["Your computer speeds up","Your files are encrypted and a ransom is demanded","Free games get installed","Your internet gets faster"],a:1,e:"Ransomware encrypts your files and demands payment — usually in cryptocurrency — in exchange for the decryption key."},
{q:"What is the primary function of a VPN?",o:["Increase internet speed","Encrypt traffic and hide your IP address","Remove viruses","Free up storage space"],a:1,e:"A VPN encrypts your internet connection and masks your real IP address, protecting your privacy online."},
{q:"What is social engineering?",o:["A social media marketing technique","Hacking by manipulating human psychology","Social media platform development","Network engineering"],a:1,e:"Social engineering exploits human psychology rather than technical vulnerabilities to trick people into revealing sensitive information."},
{q:"You receive an email with a .exe attachment from an unknown sender. What should you do?",o:["Run it immediately","Never open it","Open it if you're curious","Open it if a friend sent it"],a:1,e:".exe files are executables that can contain malware. Never open a .exe attachment from an untrusted source."},
{q:"What does a firewall do?",o:["Prevent fires","Filter network traffic","Cool down your computer","Save battery"],a:1,e:"A firewall monitors and controls incoming and outgoing network traffic to block unauthorized access to your device."},
{q:"What is a browser cookie?",o:["A computer virus","A small piece of data stored by a website","A hacking tool","A type of email"],a:1,e:"Cookies are small data files that websites store in your browser to remember things like your login state and preferences."},
{q:"What is a DDoS attack?",o:["Deleting data from a server","Flooding a server with traffic to take it offline","Cracking passwords","Intercepting emails"],a:1,e:"A Distributed Denial of Service (DDoS) attack overwhelms a server with massive traffic from many machines simultaneously, causing it to go offline."},
{q:"Is 'password123' a secure password?",o:["Very secure","Moderately secure","Weak","Can be cracked instantly"],a:3,e:"'password123' appears at the top of every leaked password list and can be cracked in milliseconds by any attacker."},
{q:"What is smishing?",o:["Smartphone repair","Phishing via SMS text messages","Blocking spam email","Smart home hacking"],a:1,e:"Smishing is phishing carried out through SMS text messages. Attackers send fake links to steal personal information."},
{q:"How many antivirus programs should you install?",o:["The more the better","Just one","Three or more","None needed"],a:1,e:"Install only one antivirus. Multiple antivirus programs conflict with each other and can actually weaken your overall security."},
{q:"You find a USB drive on the ground. What is the correct action?",o:["Plug it in out of curiosity","Return it to its owner if possible","Hand it to a security administrator","Format it and use it"],a:2,e:"Unknown USB drives may contain malware designed to auto-execute when plugged in. Do not plug it in — hand it to security personnel."},
{q:"What is a zero-day vulnerability?",o:["A bug found on day zero","A security flaw with no patch yet available","A bug in free software","Server downtime"],a:1,e:"A zero-day vulnerability is a security flaw that is unknown to the vendor or has not yet been patched, making it extremely dangerous to exploit."},
{q:"Which best describes multi-factor authentication (MFA)?",o:["Using one strong password","Verifying identity with two or more factors","Logging in from multiple devices","Using multiple browsers"],a:1,e:"MFA requires two or more independent verification factors (e.g., password + authenticator app), drastically reducing the risk of unauthorized access."},
{q:"Does browser private/incognito mode make you completely anonymous?",o:["Yes, completely anonymous","No — your ISP and websites can still see you","It also hides your IP address","It also prevents hacking"],a:1,e:"Incognito mode only prevents your browser from saving local history. Your Internet Service Provider and the websites you visit can still see your activity."},
{q:"Which is the most secure common two-factor authentication method?",o:["SMS (text message) code","Email verification link","OTP app (e.g., Google Authenticator)","Password alone"],a:2,e:"OTP apps (Google Authenticator, Authy, etc.) generate time-based codes locally that cannot be intercepted in transit, making them more secure than SMS codes."}
];

let cur=0,score=0;

function show(){
    if(cur>=Q.length){result();return;}
    document.getElementById("pf").style.width=(cur/Q.length*100)+"%";
    document.getElementById("pt").textContent=(cur+1)+" / "+Q.length;
    const q=Q[cur];
    document.getElementById("quizArea").innerHTML=
        "<div class=\"quiz-card\">" +
            "<div class=\"q-num\">Q"+(cur+1)+"</div>" +
            "<div class=\"q-text\">"+q.q+"</div>" +
            "<div class=\"options\">"+q.o.map(function(o,i){return "<div class=\"opt\" onclick=\"ans("+i+")\">"+o+"</div>";}).join("")+"</div>" +
            "<div class=\"explain\" id=\"exp\"></div>" +
        "</div>";
}

function ans(i){
    const q=Q[cur];const correct=i===q.a;if(correct)score++;
    document.querySelectorAll(".opt").forEach(function(o,j){
        o.style.pointerEvents="none";
        if(j===q.a)o.className="opt correct";
        else if(j===i&&!correct)o.className="opt wrong";
    });
    document.getElementById("exp").style.display="block";
    document.getElementById("exp").innerHTML=(correct?"✅ Correct! ":"❌ Wrong! ")+q.e;
    setTimeout(function(){cur++;show();},2500);
}

function result(){
    document.getElementById("quizArea").style.display="none";
    document.getElementById("pf").style.width="100%";
    document.getElementById("pt").textContent="Complete!";
    let g,c;
    if(score>=18){g="S";c="#00ff41";}else if(score>=15){g="A";c="#00ff41";}
    else if(score>=12){g="B";c="#ffeb3b";}else if(score>=8){g="C";c="#ff9800";}
    else{g="F";c="#ff5252";}
    document.getElementById("resultArea").innerHTML=
        "<div class=\"r-score\" style=\"color:"+c+"\">"+score+" / "+Q.length+"</div>" +
        "<div class=\"r-grade\" style=\"color:"+c+"\">Grade: "+g+"</div>" +
        "<div class=\"r-text\">"+(score>=18?"Security expert level!":score>=15?"Excellent work!":score>=12?"Above average.":score>=8?"You need to study a bit more.":"Cybersecurity training urgently needed!")+"</div>" +
        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 Try Again</button>";
    document.getElementById("resultArea").style.display="block";
}
show();
</script>
</body>
</html>
