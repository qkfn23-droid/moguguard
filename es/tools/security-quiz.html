<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .quiz-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace}
        .q-text{font-size:17px;color:#e0e0e0;line-height:1.6;margin-bottom:20px;font-weight:600}
        .options{display:flex;flex-direction:column;gap:8px}
        .opt{padding:12px 16px;background:rgba(0,255,65,0.04);border:1px solid #00ff4120;border-radius:6px;color:#aaa;font-size:14px;cursor:pointer;transition:all .2s}
        .opt:hover{border-color:#00ff41;color:#00ff41}
        .opt.correct{border-color:#00ff41;background:rgba(0,255,65,0.15);color:#00ff41}
        .opt.wrong{border-color:#ff5252;background:rgba(255,82,82,0.15);color:#ff5252}
        .explain{display:none;margin-top:12px;padding:12px;background:#0f0f0f;border-radius:6px;font-size:13px;color:#888;line-height:1.6}
        .result-section{display:none;text-align:center}
        .r-score{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}
        .r-grade{font-size:28px;margin-top:8px}.r-text{font-size:14px;color:#888;margin:16px 0}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🧠 보안 상식 퀴즈</h2>
        <p>20문제로 당신의 보안 지식을 테스트하세요</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">1 / 20</div>
    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">공유:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URL 복사</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const Q=[
{q:"HTTPS에서 S는 무엇을 의미하나요?",o:["Super","Secure","Safe","Speed"],a:1,e:"HTTPS의 S는 Secure(안전한)를 의미합니다. SSL/TLS 암호화를 통해 데이터를 보호합니다."},
{q:"피싱(Phishing)의 목적은?",o:["컴퓨터 속도 향상","개인정보 탈취","바이러스 제거","인터넷 속도 증가"],a:1,e:"피싱은 신뢰할 수 있는 기관을 사칭하여 개인정보(비밀번호, 카드번호 등)를 탈취하는 공격입니다."},
{q:"안전한 비밀번호의 최소 권장 길이는?",o:["4자","6자","8자","12자 이상"],a:3,e:"보안 전문가들은 최소 12자 이상을 권장합니다. 길이가 가장 중요한 보안 요소입니다."},
{q:"2단계 인증(2FA)이란?",o:["비밀번호를 2번 입력","비밀번호 + 추가 인증","2개의 계정 사용","2개의 브라우저 사용"],a:1,e:"2FA는 비밀번호 외에 문자 인증, 앱 인증 등 추가 인증 수단을 사용하는 방법입니다."},
{q:"공용 와이파이에서 가장 위험한 행동은?",o:["뉴스 읽기","유튜브 시청","인터넷 뱅킹","날씨 확인"],a:2,e:"공용 와이파이에서 금융 거래는 해커가 데이터를 가로챌 수 있어 매우 위험합니다."},
{q:"랜섬웨어에 감염되면?",o:["컴퓨터가 빨라진다","파일이 암호화되고 돈을 요구한다","무료 게임이 설치된다","인터넷이 빨라진다"],a:1,e:"랜섬웨어는 파일을 암호화하고 복호화 대가로 금전(주로 암호화폐)을 요구합니다."},
{q:"VPN의 주요 기능은?",o:["인터넷 속도 향상","통신 암호화 및 IP 숨김","바이러스 제거","저장 공간 확보"],a:1,e:"VPN은 인터넷 통신을 암호화하고 실제 IP 주소를 숨겨 프라이버시를 보호합니다."},
{q:"소셜 엔지니어링이란?",o:["SNS 마케팅 기법","사람의 심리를 이용한 해킹","소셜미디어 개발","네트워크 공학"],a:1,e:"소셜 엔지니어링은 기술이 아닌 사람의 심리적 약점을 이용하여 정보를 탈취하는 기법입니다."},
{q:"이메일에서 .exe 첨부파일이 오면?",o:["바로 실행한다","절대 열지 않는다","궁금하면 열어본다","친구가 보낸 거면 연다"],a:1,e:".exe 파일은 실행 파일로 악성코드가 포함되어 있을 수 있습니다. 신뢰할 수 없는 출처의 exe 파일은 절대 열면 안 됩니다."},
{q:"방화벽(Firewall)의 역할은?",o:["화재 예방","네트워크 트래픽 필터링","컴퓨터 냉각","배터리 절약"],a:1,e:"방화벽은 허가되지 않은 네트워크 접근을 차단하여 컴퓨터를 보호합니다."},
{q:"쿠키(Cookie)란?",o:["컴퓨터 바이러스","웹사이트가 저장하는 작은 데이터","해킹 도구","이메일 종류"],a:1,e:"쿠키는 웹사이트가 브라우저에 저장하는 작은 데이터로, 로그인 상태 유지 등에 사용됩니다."},
{q:"DDoS 공격이란?",o:["데이터 삭제","대량의 트래픽으로 서버 마비","비밀번호 해킹","이메일 도청"],a:1,e:"DDoS는 수많은 컴퓨터에서 동시에 트래픽을 보내 서버를 마비시키는 공격입니다."},
{q:"비밀번호 'password123'은 안전한가요?",o:["매우 안전","보통","위험","즉시 해킹 가능"],a:3,e:"password123은 가장 흔한 비밀번호 목록에 포함되어 있어 즉시 해킹 가능합니다."},
{q:"스미싱(Smishing)이란?",o:["스마트폰 수리","문자를 이용한 피싱","스팸 메일 차단","스마트홈 해킹"],a:1,e:"스미싱은 SMS(문자메시지)를 이용한 피싱 공격으로, 가짜 링크를 보내 개인정보를 탈취합니다."},
{q:"백신 프로그램은 몇 개 설치하는 게 좋나요?",o:["많을수록 좋다","1개만","3개 이상","설치 안 해도 된다"],a:1,e:"백신은 1개만 설치하세요. 여러 개 설치하면 서로 충돌하여 오히려 보안이 약해집니다."},
{q:"USB를 주웠을 때 올바른 행동은?",o:["궁금하니까 컴퓨터에 꽂아본다","주인을 찾아 돌려준다","관리자에게 제출한다","포맷하고 쓴다"],a:2,e:"모르는 USB는 악성코드가 심어져 있을 수 있습니다. 꽂지 말고 관리자에게 제출하세요."},
{q:"제로데이(Zero-day) 취약점이란?",o:["0일에 발견된 버그","아직 패치가 없는 보안 취약점","무료 소프트웨어 버그","서버 다운타임"],a:1,e:"제로데이는 개발자도 모르거나 아직 패치되지 않은 취약점으로, 매우 위험합니다."},
{q:"공인인증서 대신 사용하는 인증 수단은?",o:["카카오페이 인증","전부 다","PASS 인증","네이버 인증"],a:1,e:"공인인증서 폐지 후 카카오, 패스, 네이버 등 다양한 사설 인증이 사용됩니다. 전부 가능합니다."},
{q:"브라우저 시크릿 모드는 완전히 익명인가요?",o:["완전 익명","아니요, ISP와 사이트는 알 수 있음","IP도 숨겨줌","해킹도 방지"],a:1,e:"시크릿 모드는 브라우저 기록만 안 남길 뿐, 인터넷 제공자(ISP)나 웹사이트는 접속 기록을 알 수 있습니다."},
{q:"가장 안전한 인증 방법은?",o:["문자(SMS) 인증","이메일 인증","OTP 앱(구글 인증기)","비밀번호만"],a:2,e:"OTP 앱(구글 인증기, Authy 등)은 가로채기가 어려워 SMS보다 안전합니다."}
];

let cur=0,score=0;

function show(){
    if(cur>=Q.length){result();return;}
    document.getElementById('pf').style.width=(cur/Q.length*100)+'%';
    document.getElementById('pt').textContent=(cur+1)+' / '+Q.length;
    const q=Q[cur];
    document.getElementById('quizArea').innerHTML=`
        <div class="quiz-card">
            <div class="q-num">Q${cur+1}</div>
            <div class="q-text">${q.q}</div>
            <div class="options">${q.o.map((o,i)=>`<div class="opt" onclick="ans(${i})">${o}</div>`).join('')}</div>
            <div class="explain" id="exp"></div>
        </div>`;
}

function ans(i){
    const q=Q[cur];const correct=i===q.a;if(correct)score++;
    document.querySelectorAll('.opt').forEach((o,j)=>{
        o.style.pointerEvents='none';
        if(j===q.a)o.className='opt correct';
        else if(j===i&&!correct)o.className='opt wrong';
    });
    document.getElementById('exp').style.display='block';
    document.getElementById('exp').innerHTML=(correct?'✅ 정답!':'❌ 오답!')+' '+q.e;
    setTimeout(()=>{cur++;show();},2500);
}

function result(){
    document.getElementById('quizArea').style.display='none';
    document.getElementById('pf').style.width='100%';
    document.getElementById('pt').textContent='완료!';
    let g,c;
    if(score>=18){g='S';c='#00ff41';}else if(score>=15){g='A';c='#00ff41';}
    else if(score>=12){g='B';c='#ffeb3b';}else if(score>=8){g='C';c='#ff9800';}
    else{g='F';c='#ff5252';}
    document.getElementById('resultArea').innerHTML=`
        <div class="r-score" style="color:${c}">${score} / ${Q.length}</div>
        <div class="r-grade" style="color:${c}">등급: ${g}</div>
        <div class="r-text">${score>=18?'보안 전문가 수준!':score>=15?'훌륭합니다!':score>=12?'평균 이상이에요.':score>=8?'좀 더 공부가 필요해요.':'보안 교육이 시급합니다!'}</div>
        <button class="retry-btn" onclick="location.reload()">🔄 다시 도전</button>`;
    document.getElementById('resultArea').style.display='block';
}
show();
</script>
</body>
</html>
