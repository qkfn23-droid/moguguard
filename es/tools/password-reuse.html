<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재사용 자가진단 - 같은 비번 몇 개? | MOGU Guard</title>
    <meta name="description" content="나는 몇 개 사이트에서 같은 비밀번호를 쓰고 있을까? 자가진단으로 비밀번호 재사용 위험도를 확인하세요.">
    <link rel="canonical" href="https://moguguard.com/tools/password-reuse.html">
    <meta property="og:title" content="비밀번호 재사용 자가진단 | MOGU Guard">
    <meta property="og:description" content="같은 비밀번호 몇 곳에서 쓰고 있나요?">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://moguguard.com/tools/password-reuse.html">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .privacy-badge{display:inline-block;background:rgba(0,255,65,0.1);border:1px solid rgba(0,255,65,0.3);color:#00ff41;font-size:11px;padding:4px 12px;border-radius:20px;margin-bottom:20px}
        .quiz-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px;text-align:center}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace}
        .q-text{font-size:17px;color:#e0e0e0;line-height:1.6;margin-bottom:20px;font-weight:600}
        .options{display:flex;flex-direction:column;gap:10px}
        .opt{padding:14px 20px;background:rgba(0,255,65,0.04);border:1px solid #00ff4120;border-radius:8px;color:#aaa;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
        .opt:hover{border-color:#00ff41;color:#00ff41;transform:translateX(4px)}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .result-section{display:none;text-align:center}
        .r-emoji{font-size:80px;margin-bottom:16px}
        .r-score{font-size:48px;font-weight:900;font-family:'Fira Code',monospace;margin-bottom:8px}
        .r-grade{font-size:20px;margin-bottom:16px}
        .r-desc{font-size:14px;color:#999;line-height:1.8;text-align:left;margin-bottom:24px}
        .r-desc strong{color:#00ff41}
        .info-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-bottom:16px;text-align:left}
        .info-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .info-text{font-size:14px;color:#888;line-height:1.8}.info-text strong{color:#ff5252}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace;margin-top:20px}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🔄 비밀번호 재사용 자가진단</h2>
        <p>같은 비밀번호, 몇 곳에서 쓰고 있나요?</p>
        <div class="privacy-badge">🔒 어떤 비밀번호도 입력하지 않습니다 — 자가진단 퀴즈</div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">Q1 / 8</div>

    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">공유:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URL 복사</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const QS=[
{q:"몇 개의 사이트/앱에서 같은 비밀번호를 사용하나요?",o:[
    {t:"전부 다르게 사용한다",s:0},{t:"2~3개 정도 같은 걸 쓴다",s:2},{t:"5개 이상 같은 걸 쓴다",s:4},{t:"거의 다 같은 비밀번호다",s:6}]},
{q:"비밀번호 관리자(1Password, Bitwarden 등)를 사용하나요?",o:[
    {t:"사용한다",s:0},{t:"들어본 적은 있지만 안 쓴다",s:2},{t:"그게 뭔데?",s:4}]},
{q:"은행/금융 앱 비밀번호가 다른 사이트와 같나요?",o:[
    {t:"완전히 다르다",s:0},{t:"비슷하지만 약간 변형했다 (뒤에 숫자 추가 등)",s:3},{t:"같은 비밀번호를 쓴다",s:6}]},
{q:"비밀번호를 마지막으로 바꾼 게 언제인가요?",o:[
    {t:"3개월 이내",s:0},{t:"6개월~1년",s:1},{t:"1년 이상",s:3},{t:"기억이 안 난다 / 바꾼 적 없다",s:5}]},
{q:"비밀번호에 개인정보(생일, 이름, 전화번호)가 포함되어 있나요?",o:[
    {t:"절대 안 넣는다",s:0},{t:"일부 사이트에서 넣는다",s:2},{t:"대부분 넣는다",s:4}]},
{q:"사이트에서 '비밀번호가 유출되었습니다' 알림을 받은 적 있나요?",o:[
    {t:"없다",s:0},{t:"있지만 바로 바꿨다",s:1},{t:"있지만 그냥 무시했다",s:5}]},
{q:"비밀번호를 어디에 저장하나요?",o:[
    {t:"비밀번호 관리자 앱",s:0},{t:"브라우저 자동 저장",s:2},{t:"메모장/포스트잇에 적어둔다",s:3},{t:"머릿속으로 기억한다",s:1}]},
{q:"새 사이트에 가입할 때 비밀번호를 어떻게 정하나요?",o:[
    {t:"랜덤 생성기로 만든다",s:0},{t:"기존 비밀번호에 숫자/기호를 추가한다",s:2},{t:"항상 쓰던 비밀번호를 그대로 쓴다",s:5}]}
];

let cur=0,totalScore=0;

function show(){
    if(cur>=QS.length){result();return;}
    document.getElementById('pf').style.width=(cur/QS.length*100)+'%';
    document.getElementById('pt').textContent=`Q${cur+1} / ${QS.length}`;
    const q=QS[cur];
    document.getElementById('quizArea').innerHTML=`
        <div class="quiz-card">
            <div class="q-num">QUESTION ${cur+1}</div>
            <div class="q-text">${q.q}</div>
            <div class="options">${q.o.map((o,i)=>`<div class="opt" onclick="ans(${o.s})">${o.t}</div>`).join('')}</div>
        </div>`;
}

function ans(s){totalScore+=s;cur++;show();}

function result(){
    document.getElementById('quizArea').style.display='none';
    document.getElementById('pf').style.width='100%';
    document.getElementById('pt').textContent='완료!';

    let emoji,grade,color,desc;
    if(totalScore<=5){
        emoji='🏰';grade='안전!';color='#00ff41';
        desc='비밀번호 관리를 <strong>매우 잘 하고 있습니다</strong>. 사이트마다 다른 비밀번호를 사용하고, 관리도 체계적이네요. 이 습관을 유지하세요!';
    } else if(totalScore<=15){
        emoji='⚠️';grade='주의 필요';color='#ffeb3b';
        desc='어느 정도 관리하고 있지만, <strong>일부 사이트에서 비밀번호를 재사용</strong>하고 있습니다. 특히 금융 사이트는 반드시 다른 비밀번호를 사용하세요.';
    } else if(totalScore<=25){
        emoji='🚨';grade='위험!';color='#ff9800';
        desc='<strong>비밀번호 재사용이 심각합니다.</strong> 하나의 사이트가 해킹당하면 연쇄적으로 모든 계정이 위험해집니다. 비밀번호 관리자 사용을 강력히 권장합니다.';
    } else {
        emoji='💀';grade='매우 위험!';color='#ff5252';
        desc='<strong>거의 모든 사이트에서 같은 비밀번호를 사용</strong>하고 있습니다. 이것은 집 열쇠, 차 열쇠, 사무실 열쇠를 전부 같은 열쇠로 쓰는 것과 같습니다. <strong>지금 바로 비밀번호를 바꾸세요!</strong>';
    }

    document.getElementById('resultArea').innerHTML=`
        <div class="r-emoji">${emoji}</div>
        <div class="r-score" style="color:${color}">위험도: ${totalScore}점</div>
        <div class="r-grade" style="color:${color}">${grade}</div>
        <div class="info-card"><div class="info-title">📊 진단 결과</div><div class="info-text">${desc}</div></div>
        <div class="info-card">
            <div class="info-title">💡 비밀번호 재사용이 위험한 이유</div>
            <div class="info-text">
                <strong>한 곳이 뚫리면 전부 뚫립니다.</strong><br><br>
                해커가 A 사이트에서 비밀번호를 탈취하면, 같은 이메일+비밀번호로 B, C, D 사이트에 자동 로그인을 시도합니다. 이것을 <strong>크리덴셜 스터핑(Credential Stuffing)</strong>이라고 합니다.<br><br>
                • 2024년 유출된 비밀번호: <strong>100억 개 이상</strong><br>
                • 재사용 비밀번호 해킹 성공률: <strong>약 1~2%</strong> (100억 중 1억 계정!)<br>
                • 해결책: <strong>비밀번호 관리자</strong> 사용 (Bitwarden 무료)
            </div>
        </div>
        <button class="retry-btn" onclick="location.reload()">🔄 다시 진단</button>`;
    document.getElementById('resultArea').style.display='block';
    document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
}
show();
</script>
</body>
</html>
