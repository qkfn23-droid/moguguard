    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0f1a;color:#e0e0e0;min-height:100vh}header{background:linear-gradient(135deg,#0f1a2e,#1a2540);border-bottom:1px solid #1a3a30;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00e676;letter-spacing:2px;font-weight:700}.container{max-width:700px;margin:20px auto 40px;padding:0 20px}.page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00e676;margin-bottom:8px}.page-title p{color:#8888aa;font-size:14px}

        .explanation{display:none;margin-top:16px;padding:16px;border-radius:10px;font-size:14px;line-height:1.7}

        .tips-card{background:linear-gradient(135deg,#0f1a2e,#1a2540);border:1px solid #1a3a30;border-radius:12px;padding:20px;margin-top:20px;text-align:left}

<body>
<header><a href="../index.html">MOGU <span style="color:#00e676;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🎣 Quiz de Phishing</h2>
        <p>Real email or phishing? Test yourself with 10 scenarios.</p>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">Question 1 / 10</div>

    <div id="quizSection"></div>
    <div id="resultSection" class="result-section"></div>

    <div class="disclaimer">🎣 Inspired by real phishing cases, but all scenarios are fictional and for educational purposes only.</div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a30;margin-top:30px;"><span style="font-size:13px;color:#888;margin-right:8px;">Compartilhar:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#666;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copiar URL</a></div>
<footer>&copy; 2025 MOGU Guard</footer>

<script>
const QUESTIONS = [
    {from:"noreply@amaz0n-security.com",fromName:"Amazon Security Team",subject:"[URGENT] Unusual sign-in detected — Your account has been suspended",to:"Me",
     body:"Dear Customer, unusual login activity was detected on your account and it has been <span class=\"highlight\">temporarily suspended</span>.<br><br>Please verify your identity within 24 horas by clicking the link below.<br><br><span class=\"link\">https://amaz0n-security.com/verify-account</span><br><br>Failure to verify will result in <span class=\"highlight\">permanent account deletion</span>.",
     answer:"phishing",explain:"The sender uses <strong>amaz0n</strong> (digit 0 replacing the letter o) — real Amazon always uses amazon.com. The extreme urgency and \"permanent deletion\" threat are classic phishing pressure tactics."},
    {from:"no-reply@google.com",fromName:"Google",subject:"Security alert: New sign-in from an unrecognized device",to:"Me",
     body:"A new sign-in to your Google Account was detected on an unfamiliar device.<br><br>Device: Windows PC<br>Location: New York, United States<br>Time: March 15, 2024 at 2:30 PM<br><br>If this was you, you can safely ignore this message.<br>If not, go to your <span class=\"link\">Account Security settings</span> to change your password.",
     answer:"real",explain:"Official google.com domain, specific login details provided, and the phrase <strong>\"you can safely ignore this\"</strong> is key. Legitimate security alerts do not pressure you to click a link immediately."},
    {from:"support@paypa1.com",fromName:"PayPal Customer Support",subject:"Your account requires verification — Payment restricted",to:"Me",
     body:"Suspicious activity has been detected on your PayPal account.<br><br>To protect your account, payment functionality has been restricted. Please click the button below to submit your <span class=\"highlight\">government-issued ID and card details</span>.<br><br><span class=\"link\">[Verify Account]</span>",
     answer:"phishing",explain:"<strong>paypa1.com</strong> (digit 1 replacing the letter l) — the real domain is paypal.com. No legitimate service will ever ask for your ID photo and card number via email."},
    {from:"noreply@github.com",fromName:"GitHub",subject:"[GitHub] A new SSH key was added to your account",to:"Me",
     body:"Hi there,<br><br>A new public key was added to your account:<br><br>Title: MacBook Pro<br>Fingerprint: SHA256:abc123...<br><br>If you did not add this key, please remove it immediately from your <span class=\"link\">SSH key settings</span>.",
     answer:"real",explain:"Official github.com domain, specific technical details (SSH fingerprint), calm and informative tone. This matches GitHub's actual notification format exactly."},
    {from:"security@app1e-id.com",fromName:"Apple ID Support",subject:"Your Apple ID has been locked — Immediate action required",to:"Me",
     body:"An unauthorized access attempt has been detected on your Apple ID.<br><br>For your protection, your Apple ID has been <span class=\"highlight\">locked</span>.<br><br>You must verify your identity at the link below within <span class=\"highlight\">12 horas</span> or access to all Apple services will be permanently blocked.<br><br><span class=\"link\">https://app1e-id.com/unlock</span>",
     answer:"phishing",explain:"<strong>app1e-id.com</strong> (digit 1 replacing the letter l) — Apple always uses apple.com. The 12-hour deadline and threat of losing all services are textbook phishing pressure tactics."},
    {from:"noreply@netflix.com",fromName:"Netflix",subject:"Update your payment method",to:"Me",
     body:"Hi,<br><br>The payment method on file has expired and we were unable to process your next billing cycle.<br><br>To avoid any interruption to your service, please sign in to your Netflix account and update your payment information.<br><br><span class=\"link\">netflix.com/YourAccount</span>",
     answer:"real",explain:"Official netflix.com domain, a reasonable explanation (card expired), and it directs you to the website address rather than a suspicious link. This matches Netflix's actual notification style."},
    {from:"admin@chase-secure.net",fromName:"Chase Bank",subject:"[Chase] Security certificate renewal required — Online banking restricted",to:"Me",
     body:"Dear Customer, your security certificate has expired and online banking access has been <span class=\"highlight\">restricted</span>.<br><br>Please enter your <span class=\"highlight\">Social Security Number and account number</span> at the link below to renew your certificate.<br><br><span class=\"link\">[Renew Certificate]</span><br><br>Note: Failure to renew within 24 horas will result in account suspension.",
     answer:"phishing",explain:"<strong>chase-secure.net</strong> is not Chase's real domain (real: chase.com). Requesting your SSN and account number via an email link is 100% phishing. Banks never ask for this information by email."},
    {from:"noreply@linkedin.com",fromName:"LinkedIn",subject:"John Smith viewed your profile",to:"Me",
     body:"Hi,<br><br>5 people viewed your profile last week.<br><br>1. John Smith — HR Manager at Microsoft<br>2. Sarah Johnson — Developer at Google<br><br>See who else viewed your profile on LinkedIn.",
     answer:"real",explain:"Official linkedin.com domain, standard LinkedIn notification format, no request for personal information, calm tone. This is exactly how real LinkedIn profile view alerts look."},
    {from:"delivery@fedex-logistics.net",fromName:"FedEx",subject:"Delivery failed — Address confirmation required",to:"Me",
     body:"Your package could not be delivered.<br><br>Tracking Number: 7489-2301-5634<br><br>To reschedule delivery, please provide your <span class=\"highlight\">full name, phone number, address, and Social Security Number</span> at the link below.<br><br><span class=\"link\">https://fedex-logistics.net/redelivery</span>",
     answer:"phishing",explain:"<strong>fedex-logistics.net</strong> is not FedEx's real domain (real: fedex.com). Requesting a <strong>Social Security Number</strong> for a package redelivery is never legitimate — that is pure phishing."},
    {from:"noreply@steam.com",fromName:"Steam",subject:"Purchase confirmation: Counter-Strike 2",to:"Me",
     body:"Hi,<br><br>Your purchase is complete:<br><br>Game: Counter-Strike 2<br>Price: $14.99<br>Payment: ****-1234<br><br>If you did not make this purchase, please contact <span class=\"link\">Steam Support</span>.",
     answer:"real",explain:"Official steam.com domain, specific purchase details, calm tone, no pressure to click any additional link. This matches Steam's actual purchase confirmation email format."}
];

let currentQ = 0;
let score = 0;

function showQuestion() {
    if (currentQ >= QUESTIONS.length) { showResult(); return; }
    const q = QUESTIONS[currentQ];
    const pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = "Question " + (currentQ + 1) + " / " + QUESTIONS.length;

    document.getElementById("quizSection").innerHTML =
        "<div class=\"email-card\">" +
            "<div class=\"email-header\">" +
                "<div class=\"email-from\">From: <strong>" + q.fromName + "</strong> &lt;" + q.from + "&gt;</div>" +
                "<div class=\"email-subject\">" + q.subject + "</div>" +
                "<div class=\"email-to\">To: " + q.to + "</div>" +
            "</div>" +
            "<div class=\"email-body\">" + q.body + "</div>" +
            "<div class=\"btn-row\">" +
                "<div class=\"btn-real\" onclick=\"answer('real')\">✅ Email Real</div>" +
                "<div class=\"btn-phishing\" onclick=\"answer('phishing')\">🎣 Phishing!</div>" +
            "</div>" +
            "<div class=\"explanation\" id=\"explanation\"></div>" +
        "</div>";
}

function answer(choice) {
    const q = QUESTIONS[currentQ];
    const correct = choice === q.answer;
    if (correct) score++;

    const el = document.getElementById("explanation");
    el.className = "explanation " + (correct ? "correct" : "wrong");
    el.innerHTML = "<strong>" + (correct ? "✅ Correct!" : "❌ Wrong!") + "</strong> (" + (q.answer === "phishing" ? "This is a phishing email" : "This is a legitimate email") + ")<br><br>" + q.explain;
    el.style.display = "block";

    document.querySelectorAll(".btn-real,.btn-phishing").forEach(function(b) { b.style.pointerEvents = "none"; b.style.opacity = "0.5"; });

    setTimeout(function() { currentQ++; showQuestion(); }, 3000);
}

function showResult() {
    document.getElementById("quizSection").style.display = "none";
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("progressText").textContent = "Complete!";

    let grade, gradeColor, gradeText;
    if (score >= 9) { grade = "S"; gradeColor = "#00e676"; gradeText = "Phishing Master! No hacker can fool you."; }
    else if (score >= 7) { grade = "A"; gradeColor = "#00e676"; gradeText = "Excellent! You can spot most phishing attempts."; }
    else if (score >= 5) { grade = "B"; gradeColor = "#ffeb3b"; gradeText = "Not bad. Keep sharpening your phishing detection skills."; }
    else if (score >= 3) { grade = "C"; gradeColor = "#ff9800"; gradeText = "Risky! You could fall for a phishing attack."; }
    else { grade = "F"; gradeColor = "#ff5252"; gradeText = "Danger! You need phishing awareness training urgently."; }

    const section = document.getElementById("resultSection");
    section.innerHTML =
        "<div class=\"result-score\" style=\"color:" + gradeColor + ";\">" + score + " / " + QUESTIONS.length + "</div>" +
        "<div class=\"result-grade\" style=\"color:" + gradeColor + ";\">Grade: " + grade + "</div>" +
        "<div class=\"result-text\">" + gradeText + "</div>" +
        "<button class=\"retry-btn\" onclick=\"location.reload()\">🔄 Try Again</button>" +
        "<div class=\"tips-card\" style=\"margin-top:24px;\">" +
            "<div class=\"tips-title\">🎣 5 Key Signs of a Phishing Email</div>" +
            "<div class=\"tips-text\">" +
                "<strong>1. Check the sender address</strong> — If the domain differs from the official site, it's phishing (amaz0n, paypa1, app1e, etc.)<br>" +
                "<strong>2. Urgency and threats</strong> — \"Within 24 horas\", \"immediately\", \"permanent deletion\" are classic phishing pressure tactics<br>" +
                "<strong>3. Personal data requests</strong> — If an email asks for your password, SSN, or card number, it's 100% phishing<br>" +
                "<strong>4. Verify links</strong> — Hover over links to check whether the actual URL points to the official site<br>" +
                "<strong>5. Tone and grammar</strong> — Awkward phrasing, spelling mistakes, or unprofessional language are phishing red flags" +
            "</div>" +
        "</div>";
    section.style.display = "block";
}

showQuestion();
</script>
</body>
