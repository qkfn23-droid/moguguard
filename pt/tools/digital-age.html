<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .q-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px;text-align:center}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace}
        .q-text{font-size:17px;color:#e0e0e0;line-height:1.6;margin-bottom:20px;font-weight:600}
        .options{display:flex;flex-direction:column;gap:10px}
        .opt{padding:14px 20px;background:rgba(0,255,65,0.04);border:1px solid #00ff4120;border-radius:8px;color:#aaa;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
        .opt:hover{border-color:#00ff41;color:#00ff41;transform:translateX(4px)}
        .result-section{display:none;text-align:center}
        .r-emoji{font-size:80px;margin-bottom:16px}
        .r-age{font-size:48px;font-weight:900;color:#00ff41;font-family:'Fira Code',monospace;margin-bottom:4px}
        .r-title{font-size:22px;color:#00ff41;margin-bottom:8px}
        .r-sub{font-size:14px;color:#666;margin-bottom:20px}
        .info-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-bottom:16px;text-align:left}
        .info-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .info-text{font-size:14px;color:#888;line-height:1.8}.info-text strong{color:#00ff41}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace;margin-top:20px}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🎂 Digital Age Test</h2>
        <p>What is your digital security age?</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">Q1 / 10</div>
    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Compartilhar:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">Copiar URL</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const QS=[
{q:"When installing a new app, 'terms agreement'를?",o:[{t:"Read everything and agree",s:10},{t:"Skim and agree",s:30},{t:"Immediately tap "Agree All"",s:60},{t:"What are terms?",s:80}]},
{q:"How do you manage passwords?",o:[{t:"Use password manager app",s:10},{t:"Remember everything in my head",s:30},{t:"Written in phone notes",s:50},{t:"All same password",s:70}]},
{q:"공용 WiFi에서 뭘 해?",o:[{t:"Use with VPN on",s:10},{t:"Just browse",s:30},{t:"Banking too",s:60},{t:"WiFi 보이면 무조건 접속",s:70}]},
{q:"When software update pops up?",o:[{t:"Update immediately",s:10},{t:"Later... (keep postponing)",s:40},{t:"Turn off notifications",s:60},{t:"What is update?",s:80}]},
{q:"When posting photos on SNS?",o:[{t:"Check location/privacy before posting",s:10},{t:"Just set visibility",s:30},{t:"Post right after taking",s:50},{t:"Share real-time location too",s:70}]},
{q:"Unknown number texts "package confirmation"?",o:[{t:"100% smishing. Delete + report",s:10},{t:"Suspicious, search first",s:20},{t:"Click the link",s:60},{t:"Curious, click immediately",s:80}]},
{q:"Do you use 2FA?",o:[{t:"Set on all major accounts",s:10},{t:"Only a few accounts",s:30},{t:"Too lazy",s:50},{t:"What is 2FA?",s:80}]},
{q:"When you find a USB?",o:[{t:"Never plug it in",s:10},{t:"Curious but resist",s:20},{t:"Plug it into computer",s:60},{t:"Free USB! Use it",s:80}]},
{q:"Save passwords in browser?",o:[{t:"No. Use password manager",s:10},{t:"Save just a few for convenience",s:30},{t:"Save all. Convenient",s:50},{t:"Auto-login forever",s:70}]},
{q:""Congratulations! You won $1000!" popup?",o:[{t:"Close. 100% scam",s:10},{t:"Suspicious but slightly curious",s:30},{t:"Huh? Really? Click",s:60},{t:"Enter personal info immediately",s:90}]}
];

let cur=0,total=0;
function show(){
    if(cur>=QS.length){result();return;}
    document.getElementById('pf').style.width=(cur/QS.length*100)+'%';
    document.getElementById('pt').textContent=`Q${cur+1} / ${QS.length}`;
    const q=QS[cur];
    document.getElementById('quizArea').innerHTML=`
        <div class="q-card">
            <div class="q-num">QUESTION ${cur+1}</div>
            <div class="q-text">${q.q}</div>
            <div class="options">${q.o.map((o,i)=>`<div class="opt" onclick="ans(${o.s})">${o.t}</div>`).join('')}</div>
        </div>`;
}
function ans(s){total+=s;cur++;show();}
function result(){
    document.getElementById('quizArea').style.display='none';
    document.getElementById('pf').style.width='100%';
    document.getElementById('pt').textContent='완료!';
    const age=Math.round(total/QS.length);
    let emoji,title,desc;
    if(age<=15){emoji='👶';title='Digital Baby (0~15years old)';desc='농담이죠? 당신은 <strong>security genius</strong>입니다! 디지털 보안의 모든 것을 알고 실천하는 사이버 전사. 이 수준을 유지하years old요.';}
    else if(age<=30){emoji='🧑';title='Digital Youth (16~30years old)';desc='<strong>Digital Native!</strong> High security awareness 대부분의 위험을 잘 피합니다. 몇 가지만 보강하면 완벽합니다.';}
    else if(age<=50){emoji='👨';title='Digital Middle-Age (31~50years old)';desc:'기본적인 보안 상식은 있지만, <strong>too lazy to practice</strong> 타입. 아는 것과 하는 것은 다릅니다!';}
    else if(age<=70){emoji='👴';title='Digital Senior (51~70years old)';desc:'<strong>Seriously lacking security awareness</strong>합니다. High risk of falling for phishing/smishing. 기본적인 보안 교육이 필요합니다.';}
    else{emoji='🦕';title='Digital Dinosaur (71years old+)';desc:'<strong>Very dangerous state!</strong> 디지털 years old상에서 거의 무방비. 지금 바로 기본 보안부터 시작하years old요. 이 사이트의 다른 도구들을 활용해보years old요!';}

    document.getElementById('resultArea').innerHTML=`
        <div class="r-emoji">${emoji}</div>
        <div class="r-age">Digital Age: ${age}years old</div>
        <div class="r-title">${title}</div>
        <div class="r-sub">May differ from actual age — 이것은 based on security habits</div>
        <div class="info-card"><div class="info-title">📊 Diagnosis Result</div><div class="info-text">${desc}</div></div>
        <div class="info-card">
            <div class="info-title">📏 Digital Age Scale</div>
            <div class="info-text">
                <strong>0~15years old:</strong> security genius. 해커도 못 뚫음<br>
                <strong>16~30years old:</strong> 디지털 네이티브. 대부분 안전<br>
                <strong>31~50years old:</strong> 알지만 안 함. 위험 시작<br>
                <strong>51~70years old:</strong> 보안 교육 필요. 피싱 취약<br>
                <strong>71years old+:</strong> Digital Dinosaur. 즉시 보안 강화 필요
            </div>
        </div>
        <button class="retry-btn" onclick="location.reload()">🔄 Try Again</button>`;
    document.getElementById('resultArea').style.display='block';
    document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
}
show();
</script>
</body>
</html>
