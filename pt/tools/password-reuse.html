<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

    <link rel="canonical" href="https://moguguard.com/tools/password-reuse.html">
    <meta property="og:title" content="Password Reuse Self-Check | MOGU Guard">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .privacy-badge{display:inline-block;background:rgba(0,255,65,0.1);border:1px solid rgba(0,255,65,0.3);color:#00ff41;font-size:11px;padding:4px 12px;border-radius:20px;margin-bottom:20px}
        .quiz-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px;text-align:center}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace}
        .q-text{font-size:17px;color:#e0e0e0;line-height:1.6;margin-bottom:20px;font-weight:600}
        .options{display:flex;flex-direction:column;gap:10px}
        .opt{padding:14px 20px;background:rgba(0,255,65,0.04);border:1px solid #00ff4120;border-radius:8px;color:#aaa;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
        .opt:hover{border-color:#00ff41;color:#00ff41;transform:translateX(4px)}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .result-section{display:none;text-align:center}
        .r-emoji{font-size:80px;margin-bottom:16px}
        .r-score{font-size:48px;font-weight:900;font-family:'Fira Code',monospace;margin-bottom:8px}
        .r-grade{font-size:20px;margin-bottom:16px}
        .r-desc{font-size:14px;color:#999;line-height:1.8;text-align:left;margin-bottom:24px}
        .r-desc strong{color:#00ff41}
        .info-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-bottom:16px;text-align:left}
        .info-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .info-text{font-size:14px;color:#888;line-height:1.8}.info-text strong{color:#ff5252}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace;margin-top:20px}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🔄 Password Reuse Self-Check</h2>
        <p>How many sites share the same password?</p>
        <div class="privacy-badge">🔒 No passwords are entered — self-diagnosis quiz</div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">Q1 / 8</div>

    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Compartilhar:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">Copiar URL</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const QS=[
{q:"How many sites/apps use the same password?",o:[
    {t:"All different",s:0},{t:"2-3 sites share the same one",s:2},{t:"5+ sites share the same one",s:4},{t:"Almost all the same password",s:6}]},
{q:"Password manager(1Password, Bitwarden 등)를 사용하나요?",o:[
    {t:"I use one",s:0},{t:"Heard of it but don't use",s:2},{t:"What's that?",s:4}]},
{q:"Is your banking password the same as other sites?",o:[
    {t:"Completely different",s:0},{t:"Similar but slightly modified (뒤에 숫자 추가 등)",s:3},{t:"Same password",s:6}]},
{q:"When did you last change your password?",o:[
    {t:"Within 3 months",s:0},{t:"6 months to 1 year",s:1},{t:"Over 1 year",s:3},{t:"Can't remember / Never changed",s:5}]},
{q:"비밀번호에 Contains personal info (birthday, name, phone)되어 있나요?",o:[
    {t:"Never include",s:0},{t:"Some sites include",s:2},{t:"Most include",s:4}]},
{q:"사이트에서 'password has been leaked' 알림을 받은 적 있나요?",o:[
    {t:"No",s:0},{t:"Yes but changed immediately",s:1},{t:"Yes but ignored it",s:5}]},
{q:"Where do you store passwords?",o:[
    {t:"Password manager 앱",s:0},{t:"Browser auto-save",s:2},{t:"Written on notepad/sticky note",s:3},{t:"Memorized",s:1}]},
{q:"When signing up for a new site 비밀번호를 어떻게 정하나요?",o:[
    {t:"Generate randomly",s:0},{t:"Add numbers/symbols to existing password",s:2},{t:"Use the same old password",s:5}]}
];

let cur=0,totalScore=0;

function show(){
    if(cur>=QS.length){result();return;}
    document.getElementById('pf').style.width=(cur/QS.length*100)+'%';
    document.getElementById('pt').textContent=`Q${cur+1} / ${QS.length}`;
    const q=QS[cur];
    document.getElementById('quizArea').innerHTML=`
        <div class="quiz-card">
            <div class="q-num">QUESTION ${cur+1}</div>
            <div class="q-text">${q.q}</div>
            <div class="options">${q.o.map((o,i)=>`<div class="opt" onclick="ans(${o.s})">${o.t}</div>`).join('')}</div>
        </div>`;
}

function ans(s){totalScore+=s;cur++;show();}

function result(){
    document.getElementById('quizArea').style.display='none';
    document.getElementById('pf').style.width='100%';
    document.getElementById('pt').textContent='완료!';

    let emoji,grade,color,desc;
    if(totalScore<=5){
        emoji='🏰';grade='Safe!';color='#00ff41';
        desc='Password management <strong>is excellent</strong>. 사이트마다 다른 비밀번호를 사용하고, 관리도 체계적이네요. Keep this habit!';
    } else if(totalScore<=15){
        emoji='⚠️';grade='Needs Attention';color='#ffeb3b';
        desc='어느 정도 관리하고 있지만, <strong>reusing passwords on some sites</strong>하고 있습니다. 특히 금융 사이트는 반드시 다른 비밀번호를 사용하세요.';
    } else if(totalScore<=25){
        emoji='🚨';grade='Danger!';color='#ff9800';
        desc='<strong>Password reuse is critical.</strong> 하나의 사이트가 해킹당하면 연쇄적으로 모든 계정이 Danger해집니다. Password manager 사용을 강력히 Recommended합니다.';
    } else {
        emoji='💀';grade='매우 Danger!';color='#ff5252';
        desc='<strong>Using the same password on almost all sites</strong>하고 있습니다. 이것은 집 열쇠, 차 열쇠, 사무실 열쇠를 전부 같은 열쇠로 쓰는 것과 같습니다. <strong>Change your passwords right now!</strong>';
    }

    document.getElementById('resultArea').innerHTML=`
        <div class="r-emoji">${emoji}</div>
        <div class="r-score" style="color:${color}">Danger도: ${totalScore}점</div>
        <div class="r-grade" style="color:${color}">${grade}</div>
        <div class="info-card"><div class="info-title">📊 Diagnosis Result</div><div class="info-text">${desc}</div></div>
        <div class="info-card">
            <div class="info-title">💡 비밀번호 재사용이 Danger한 이유</div>
            <div class="info-text">
                <strong>If one is breached, all are compromised.</strong><br><br>
                해커가 A 사이트에서 비밀번호를 탈취하면, 같은 이메일+비밀번호로 B, C, D 사이트에 자동 로그인을 시도합니다. 이것을 <strong>Credential Stuffing(Credential Stuffing)</strong>이라고 합니다.<br><br>
                • 2024년 leaked passwords: <strong>100억 개 이상</strong><br>
                • 재사용 비밀번호 hack success rate: <strong>약 1~2%</strong> (100억 중 1억 계정!)<br>
                • Solution: <strong>Password manager</strong> 사용 (Bitwarden 무료)
            </div>
        </div>
        <button class="retry-btn" onclick="location.reload()">🔄 Try Again</button>`;
    document.getElementById('resultArea').style.display='block';
    document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
}
show();
</script>
</body>
</html>
