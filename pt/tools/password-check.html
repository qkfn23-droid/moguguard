<script>
const input = document.getElementById('pwInput');
input.addEventListener('input', analyze);

const COMMON_PASSWORDS = ['password','123456','12345678','qwerty','abc123','monkey','1234567','letmein','trustno1','dragon','baseball','iloveyou','master','sunshine','ashley','bailey','shadow','123123','654321','superman','qazwsx','michael','football','password1','password123','000000','11111111','admin','welcome'];

function analyze() {
    const pw = input.value;
    if (!pw) { document.getElementById('result').style.display = 'none'; return; }
    document.getElementById('result').style.display = 'block';

    const len = pw.length;
    const hasLower = /[a-z]/.test(pw);
    const hasUpper = /[A-Z]/.test(pw);
    const hasDigit = /[0-9]/.test(pw);
    const hasSpecial = /[^a-zA-Z0-9]/.test(pw);
    const hasKorean = /[ㄱ-ㅎ가-힣]/.test(pw);
    const isCommon = COMMON_PASSWORDS.includes(pw.toLowerCase());
    const hasSequential = /012|123|234|345|456|567|678|789|890|abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz/i.test(pw);
    const hasRepeated = /(.)\1{2,}/.test(pw);
    const uniqueChars = new Set(pw).size;

    // 점수 계산
    let score = 0;
    if (len >= 8) score += 15;
    if (len >= 12) score += 15;
    if (len >= 16) score += 10;
    if (hasLower) score += 10;
    if (hasUpper) score += 10;
    if (hasDigit) score += 10;
    if (hasSpecial) score += 15;
    if (uniqueChars >= 8) score += 10;
    if (uniqueChars >= 12) score += 5;
    if (isCommon) score -= 40;
    if (hasSequential) score -= 15;
    if (hasRepeated) score -= 10;
    if (len < 6) score -= 20;
    score = Math.max(0, Math.min(100, score));

    // 해킹 시간 계산
    let charsetSize = 0;
    if (hasLower) charsetSize += 26;
    if (hasUpper) charsetSize += 26;
    if (hasDigit) charsetSize += 10;
    if (hasSpecial) charsetSize += 33;
    if (hasKorean) charsetSize += 11172;
    if (charsetSize === 0) charsetSize = 26;

    const combinations = Math.pow(charsetSize, len);
    const guessesPerSec = 1e9;
    let seconds = combinations / guessesPerSec;
    if (isCommon) seconds = 0.001;

    const crackTime = formatTime(seconds);

    // 등급
    let grade, gradeColor;
    if (score >= 90) { grade = '매우 강함 🟢'; gradeColor = '#00e676'; }
    else if (score >= 70) { grade = '강함 🟡'; gradeColor = '#ffeb3b'; }
    else if (score >= 50) { grade = '보통 🟠'; gradeColor = '#ff9800'; }
    else if (score >= 30) { grade = '약함 🔴'; gradeColor = '#ff5252'; }
    else { grade = '매우 위험 ⛔'; gradeColor = '#d50000'; }

    // 표시
    document.getElementById('scoreLabel').textContent = score + '점';
    document.getElementById('scoreLabel').style.color = gradeColor;
    document.getElementById('scoreFill').style.width = score + '%';
    document.getElementById('scoreFill').style.background = gradeColor;
    document.getElementById('scoreText').textContent = grade;
    document.getElementById('crackTime').textContent = crackTime;
    document.getElementById('crackTime').style.color = score >= 70 ? '#00e676' : score >= 50 ? '#ff9800' : '#ff5252';

    // 분석 그리드
    document.getElementById('analysisGrid').innerHTML = `
        <div class="analysis-item"><div class="label">길이</div><div class="value ${len >= 12 ? 'check-pass' : 'check-fail'}">${len}자 ${len >= 12 ? '✅' : len >= 8 ? '⚠️' : '❌'}</div></div>
        <div class="analysis-item"><div class="label">소문자</div><div class="value ${hasLower ? 'check-pass' : 'check-fail'}">${hasLower ? '포함 ✅' : '없음 ❌'}</div></div>
        <div class="analysis-item"><div class="label">대문자</div><div class="value ${hasUpper ? 'check-pass' : 'check-fail'}">${hasUpper ? '포함 ✅' : '없음 ❌'}</div></div>
        <div class="analysis-item"><div class="label">숫자</div><div class="value ${hasDigit ? 'check-pass' : 'check-fail'}">${hasDigit ? '포함 ✅' : '없음 ❌'}</div></div>
        <div class="analysis-item"><div class="label">특수문자</div><div class="value ${hasSpecial ? 'check-pass' : 'check-fail'}">${hasSpecial ? '포함 ✅' : '없음 ❌'}</div></div>
        <div class="analysis-item"><div class="label">고유 문자 수</div><div class="value ${uniqueChars >= 8 ? 'check-pass' : 'check-fail'}">${uniqueChars}종류 ${uniqueChars >= 8 ? '✅' : '⚠️'}</div></div>
        <div class="analysis-item"><div class="label">흔한 비밀번호</div><div class="value ${!isCommon ? 'check-pass' : 'check-fail'}">${isCommon ? '⛔ 위험! 즉시 변경' : '안전 ✅'}</div></div>
        <div class="analysis-item"><div class="label">연속 패턴</div><div class="value ${!hasSequential ? 'check-pass' : 'check-fail'}">${hasSequential ? '발견 ⚠️ (123, abc 등)' : '없음 ✅'}</div></div>
    `;

    // 개선 팁
    let tips = [];
    if (len < 12) tips.push('<strong>12자 이상</strong>으로 늘리세요. 길이가 가장 중요합니다.');
    if (!hasUpper) tips.push('<strong>대문자</strong>를 추가하세요.');
    if (!hasSpecial) tips.push('<strong>특수문자</strong> (!@#$%^&*)를 추가하세요.');
    if (isCommon) tips.push('이 비밀번호는 <strong>가장 흔한 비밀번호 목록</strong>에 있습니다. 즉시 변경하세요!');
    if (hasSequential) tips.push('<strong>연속된 문자/숫자</strong> (123, abc)를 피하세요.');
    if (hasRepeated) tips.push('<strong>같은 문자 반복</strong> (aaa, 111)을 피하세요.');
    if (score >= 80) tips.push('훌륭합니다! 이 비밀번호는 <strong>매우 안전</strong>합니다. 각 사이트마다 다른 비밀번호를 사용하고 있는지도 확인하세요.');

    document.getElementById('tipsCard').innerHTML = `
        <div class="tips-title">💡 개선 방법</div>
        <div class="tips-text">${tips.length > 0 ? tips.map(t => '• ' + t).join('<br>') : '완벽합니다!'}</div>
    `;
}

function formatTime(seconds) {
    if (seconds < 0.001) return '즉시 해킹 가능';
    if (seconds < 1) return '1초 미만';
    if (seconds < 60) return Math.round(seconds) + '초';
    if (seconds < 3600) return Math.round(seconds / 60) + '분';
    if (seconds < 86400) return Math.round(seconds / 3600) + '시간';
    if (seconds < 86400 * 30) return Math.round(seconds / 86400) + '일';
    if (seconds < 86400 * 365) return Math.round(seconds / (86400 * 30)) + '개월';
    if (seconds < 86400 * 365 * 1000) return Math.round(seconds / (86400 * 365)) + '년';
    if (seconds < 86400 * 365 * 1e6) return Math.round(seconds / (86400 * 365 * 1000)) + '천 년';
    if (seconds < 86400 * 365 * 1e9) return Math.round(seconds / (86400 * 365 * 1e6)) + '백만 년';
    if (seconds < 86400 * 365 * 1e12) return Math.round(seconds / (86400 * 365 * 1e9)) + '십억 년';
    return '우주 나이보다 오래 걸림 ♾️';
}
</script>
