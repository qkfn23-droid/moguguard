    <link rel="canonical" href="https://moguguard.com/en/tools/hacker-type.html">
    <meta property="og:title" content="Hacker Type Test | MOGU Guard">
    <meta property="og:description" content="What type of hacker are you? Find out with 8 questions!">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .q-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px;text-align:center}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace}
        .q-text{font-size:18px;color:#e0e0e0;line-height:1.6;margin-bottom:24px;font-weight:600}
        .options{display:flex;flex-direction:column;gap:10px}
        .opt{padding:14px 20px;background:rgba(0,255,65,0.04);border:1px solid #00ff4120;border-radius:8px;color:#aaa;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
        .opt:hover{border-color:#00ff41;color:#00ff41;transform:translateX(4px)}
        .result-section{display:none;text-align:center}
        .r-emoji{font-size:80px;margin-bottom:16px}
        .r-name{font-size:32px;font-weight:900;color:#00ff41;margin-bottom:4px}
        .r-title{font-size:16px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .r-desc{font-size:14px;color:#999;line-height:1.8;text-align:left;margin-bottom:24px}
        .r-desc strong{color:#00ff41}
        .info-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-bottom:16px;text-align:left}
        .info-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .info-text{font-size:14px;color:#888;line-height:1.8}.info-text strong{color:#00ff41}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace;margin-top:20px}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🎭 Hacker Type Test</h2>
        <p>Find out what kind of hacker you are with 8 questions</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">Q1 / 8</div>
    <div id="quizSection"><div class="q-card" id="qCard"></div></div>
    <div id="resultSection" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Compartilhar:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">Copiar URL</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const QS=[
{q:"You somehow find out someone's social media password. What do you do?",o:[{t:"Tell the owner and advise them to change it immediately",c:"white"},{t:"Peek in just to look around, then leave",c:"gray"},{t:"Dig around to see if there's anything interesting",c:"black"},{t:"That would never happen to me. Not interested",c:"none"}]},
{q:"You discover a bug on a website. What do you do?",o:[{t:"Report it to the company right away",c:"white"},{t:"Probe a bit further to see how serious it is",c:"gray"},{t:"Start thinking about what you could do with it",c:"black"},{t:"Ignore it and move on to another site",c:"none"}]},
{q:"Why do you want to learn hacking techniques?",o:[{t:"To strengthen security and protect people",c:"white"},{t:"Because I'm curious how things work",c:"gray"},{t:"I like knowing things others don't",c:"black"},{t:"Hacking? Not my thing. I just use the internet",c:"none"}]},
{q:"A friend asks you to find cracked software for them. What do you do?",o:[{t:"Warn them about the risks and suggest free alternatives",c:"white"},{t:"I could look, but it feels a bit off...",c:"gray"},{t:"Already have it. Sending it over now",c:"black"},{t:"What's a crack?",c:"none"}]},
{q:"At a café you accidentally see the person next to you type their password. What do you do?",o:[{t:"Deliberately look away — that's their privacy",c:"white"},{t:"Saw it by accident, but made no effort to remember it",c:"gray"},{t:"Oh, that could be useful to keep in mind",c:"black"},{t:"Not interested. Back to my phone",c:"none"}]},
{q:"Which fictional character do you find most impressive?",o:[{t:"Iron Man (a hero who uses technology to save the world)",c:"white"},{t:"Sherlock Holmes (a genius driven by curiosity and analysis)",c:"gray"},{t:"The Joker (chaos that ignores all rules)",c:"black"},{t:"Are there hackers in movies?",c:"none"}]},
{q:"You discover a system with a security vulnerability. What do you do?",o:[{t:"Notify the admin and wait for a patch",c:"white"},{t:"Test it yourself to see how dangerous it really is (without permission)",c:"gray"},{t:"Calculate what you could gain from it",c:"black"},{t:"Vulnerability? What's that?",c:"none"}]},
{q:"What is your ideal career?",o:[{t:"Security consultant / white-hat hacker",c:"white"},{t:"Freelance researcher / bug bounty hunter",c:"gray"},{t:"Free spirit (I hate being tied to rules)",c:"black"},{t:"Something completely unrelated to IT",c:"none"}]}
];

const TYPES={
white:{name:"White Hat Hacker",emoji:"🤍",title:"White Hat — Guardian of Justice",
    desc:"You use <strong>technology for the right reasons</strong>. When you find a vulnerability, you report it; when you have skills, you use them to protect people. Corporations and governments need people exactly like you.",
    strength:"Ethics, expertise, trustworthiness",career:"Security consultant, penetration tester, CISO, security researcher",celeb:"Kevin Mitnick (reformed), Troy Hunt"},
gray:{name:"Gray Hat Hacker",emoji:"🩶",title:"Gray Hat — Explorer of Curiosity",
    desc:"You are a <strong>curiosity-driven gray hat</strong>. You explore technology on the blurry line between good and bad. 'How does this work?' is your driving force. You occasionally bend the rules, but there's no real malice behind it.",
    strength:"Curiosity, analytical thinking, adaptability",career:"Bug bounty hunter, freelance researcher, CTF competitor",celeb:"Geohot (George Hotz)"},
black:{name:"Black Hat Hacker",emoji:"🖤",title:"Black Hat — Genius of Darkness",
    desc:"You have a natural talent for finding and exploiting loopholes in systems. But remember — <strong>the greater your skill, the greater your responsibility</strong>. Switching to the white-hat side lets you earn even more money — legally!",
    strength:"Creativity, boldness, technical skill",career:"(If you go legit) Red team operator, exploit developer, security architect",celeb:"Kevin Mitnick (before his reformation)"},
none:{name:"Digital Citizen",emoji:"😊",title:"Normal User — Peaceful Internet User",
    desc:"You have no interest in hacking, and that's completely fine! Not everyone needs to be a hacker. That said, make sure you know at least the <strong>basic security essentials</strong>.",
    strength:"Peacefulness, balanced digital life",career:"Any field outside of IT",celeb:"You!"}
};

let cur=0;const scores={white:0,gray:0,black:0,none:0};

function show(){
    if(cur>=QS.length){result();return;}
    document.getElementById("pf").style.width=(cur/QS.length*100)+"%";
    document.getElementById("pt").textContent="Q"+(cur+1)+" / "+QS.length;
    const q=QS[cur];
    document.getElementById("qCard").innerHTML=`
        <div class="q-num">QUESTION ${cur+1}</div>
        <div class="q-text">${q.q}</div>
        <div class="options">${q.o.map((o,i)=>`<div class="opt" onclick="ans('${o.c}')">${o.t}</div>`).join("")}</div>`;
}

function ans(c){scores[c]++;cur++;show();}

function result(){
    document.getElementById("quizSection").style.display="none";
    document.getElementById("pf").style.width="100%";
    document.getElementById("pt").textContent="Done!";
    const top=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
    const t=TYPES[top];
    document.getElementById("resultSection").innerHTML=`
        <div class="r-emoji">${t.emoji}</div>
        <div class="r-name">${t.name}</div>
        <div class="r-title">${t.title}</div>
        <div class="info-card"><div class="info-title">🎭 Your Type</div><div class="info-text">${t.desc}</div></div>
        <div class="info-card"><div class="info-title">💪 Strengths</div><div class="info-text"><strong>${t.strength}</strong></div></div>
        <div class="info-card"><div class="info-title">💼 Matching Careers</div><div class="info-text">${t.career}</div></div>
        <div class="info-card"><div class="info-title">🌟 Famous Examples</div><div class="info-text">${t.celeb}</div></div>
        <button class="retry-btn" onclick="location.reload()">🔄 Retake Test</button>`;
    document.getElementById("resultSection").style.display="block";
    document.getElementById("resultSection").scrollIntoView({behavior:"smooth"});
}
show();
</script>
</body>
</html>
