<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Safety Score - Email Security Check | MOGU Guard</title>
    <meta name="description" content="Diagnose your email account's security level with a checklist. 12 items including password, 2FA, spam, and connected apps.">
    <link rel="canonical" href="https://moguguard.com/en/tools/email-score.html">
    <meta property="og:title" content="Email Safety Score | MOGU Guard">
    <meta property="og:description" content="Check your email security level!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://moguguard.com/en/tools/email-score.html">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .checklist{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:24px;margin-bottom:24px}
        .check-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #0f0f0f;cursor:pointer}
        .check-item:last-child{border-bottom:none}.check-item:hover{background:rgba(0,255,65,0.03)}
        .check-item input{width:20px;height:20px;accent-color:#00ff41;cursor:pointer}
        .check-item label{flex:1;cursor:pointer;font-size:14px;line-height:1.5}.check-item label strong{color:#00ff41}
        .risk{font-size:11px;padding:2px 8px;border-radius:3px}.risk-high{background:rgba(255,82,82,0.15);color:#ff5252}.risk-mid{background:rgba(255,152,0,0.15);color:#ff9800}.risk-low{background:rgba(0,255,65,0.15);color:#00ff41}
        .result-box{display:none;text-align:center;background:#111;border:1px solid #00ff4130;border-radius:8px;padding:30px;margin-bottom:20px}
        .score-num{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}.score-grade{font-size:20px;margin-top:8px}
        .score-bar{height:12px;background:#1a1a1a;border-radius:6px;overflow:hidden;margin:16px 0}.score-fill{height:100%;border-radius:6px;transition:width .5s}
        .tips{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:20px;margin-top:16px;display:none}
        .tips-title{font-size:16px;color:#00ff41;font-weight:600;margin-bottom:10px}
        .tips-text{font-size:14px;color:#888;line-height:1.8}.tips-text strong{color:#ff5252}
        .calc-btn{width:100%;padding:14px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>📧 Email Safety Score</h2>
        <p>Check all items that apply to you</p>
    </div>

    <div class="checklist">
        <div class="check-item"><input type="checkbox" id="c1"><label for="c1">Email password is <strong>12 characters or longer</strong></label><span class="risk risk-high">Essential</span></div>
        <div class="check-item"><input type="checkbox" id="c2"><label for="c2"><strong>Two-factor authentication (2FA)</strong> is enabled on the email account</label><span class="risk risk-high">Essential</span></div>
        <div class="check-item"><input type="checkbox" id="c3"><label for="c3">A <strong>unique password</strong> is used — not reused from other sites</label><span class="risk risk-high">Essential</span></div>
        <div class="check-item"><input type="checkbox" id="c4"><label for="c4"><strong>Recovery email / phone number</strong> is up to date</label><span class="risk risk-mid">Important</span></div>
        <div class="check-item"><input type="checkbox" id="c5"><label for="c5"><strong>Links / attachments</strong> in suspicious emails are never opened</label><span class="risk risk-high">Essential</span></div>
        <div class="check-item"><input type="checkbox" id="c6"><label for="c6"><strong>Spam / junk folder</strong> is checked regularly</label><span class="risk risk-low">Recommended</span></div>
        <div class="check-item"><input type="checkbox" id="c7"><label for="c7">Unused <strong>connected apps / services</strong> have been revoked</label><span class="risk risk-mid">Important</span></div>
        <div class="check-item"><input type="checkbox" id="c8"><label for="c8"><strong>Login history</strong> has been reviewed at least once</label><span class="risk risk-mid">Important</span></div>
        <div class="check-item"><input type="checkbox" id="c9"><label for="c9"><strong>Notification alerts</strong> are enabled for important accounts</label><span class="risk risk-low">Recommended</span></div>
        <div class="check-item"><input type="checkbox" id="c10"><label for="c10">Always <strong>log out</strong> of email on shared / public computers</label><span class="risk risk-high">Essential</span></div>
        <div class="check-item"><input type="checkbox" id="c11"><label for="c11">Email address is <strong>not shared indiscriminately</strong></label><span class="risk risk-mid">Important</span></div>
        <div class="check-item"><input type="checkbox" id="c12"><label for="c12"><strong>Password has been changed within the last 6 months</strong></label><span class="risk risk-low">Recommended</span></div>
    </div>

    <button class="calc-btn" onclick="showResult()">📧 Check Safety Score</button>

    <div class="result-box" id="resultBox">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
        <div class="score-grade" id="scoreGrade"></div>
    </div>
    <div class="tips" id="tips"><div class="tips-title">⚠️ Items Needing Improvement</div><div class="tips-text" id="tipsText"></div></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Partager :</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">Copier URL</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const labels=["Password 12+ characters","Two-factor authentication enabled","Unique password (not reused)","Recovery email / phone up to date","Suspicious links / attachments never opened","Spam folder checked regularly","Unused connected apps revoked","Login history reviewed","Notification alerts enabled","Always log out on shared computers","Email address not shared indiscriminately","Password changed within the last 6 months"];
function showResult(){
    let checked=0,unchecked=[];
    for(let i=1;i<=12;i++){if(document.getElementById("c"+i).checked)checked++;else unchecked.push(labels[i-1]);}
    const score=Math.round((checked/12)*100);
    let grade,color;
    if(score>=90){grade="🟢 Email security is excellent! Even hackers will struggle.";color="#00ff41";}
    else if(score>=70){grade="🟡 Good. A few improvements and you'll be secure.";color="#ffeb3b";}
    else if(score>=50){grade="🟠 Caution! Your email account may be at risk.";color="#ff9800";}
    else{grade="🔴 Very dangerous! Your email could be hacked.";color="#ff5252";}
    document.getElementById("scoreNum").textContent=score+" pts";document.getElementById("scoreNum").style.color=color;
    document.getElementById("scoreFill").style.width=score+"%";document.getElementById("scoreFill").style.background=color;
    document.getElementById("scoreGrade").textContent=grade;document.getElementById("scoreGrade").style.color=color;
    document.getElementById("resultBox").style.display="block";
    if(unchecked.length>0){document.getElementById("tipsText").innerHTML=unchecked.map(t=>"• <strong>"+t+"</strong>").join("<br>");document.getElementById("tips").style.display="block";}
    else document.getElementById("tips").style.display="none";
    document.getElementById("resultBox").scrollIntoView({behavior:"smooth"});
}
</script>
</body>
</html>
