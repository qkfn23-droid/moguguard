<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Crime Quiz - Is This Illegal? | MOGU Guard</title>
    <meta name="description" content="Test whether everyday online actions are cybercrime or not. You may be surprised by how many things are actually illegal.">
    <link rel="canonical" href="https://moguguard.com/en/tools/cyber-crime-quiz.html">
    <meta property="og:title" content="Cyber Crime Quiz | MOGU Guard">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
        header{background:#111;border-bottom:1px solid #1a3a1a;padding:16px 20px;text-align:center}header a{text-decoration:none;font-size:20px;color:#00ff41;letter-spacing:2px;font-weight:700;font-family:'Fira Code',monospace}
        .container{max-width:700px;margin:20px auto 40px;padding:0 20px}
        .page-title{text-align:center;margin-bottom:30px}.page-title h2{font-size:28px;color:#00ff41;margin-bottom:8px}.page-title p{color:#666;font-size:14px}
        .progress-bar{width:100%;height:6px;background:#1a1a1a;border-radius:3px;margin-bottom:20px;overflow:hidden}.progress-fill{height:100%;background:#00ff41;border-radius:3px;transition:width .4s}
        .progress-text{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Fira Code',monospace}
        .q-card{background:#111;border:1px solid #00ff4130;border-radius:8px;padding:28px;margin-bottom:20px;text-align:center}
        .q-num{font-size:12px;color:#00ff41;letter-spacing:2px;margin-bottom:12px;font-family:'Fira Code',monospace}
        .q-text{font-size:17px;color:#e0e0e0;line-height:1.6;margin-bottom:24px;font-weight:600}
        .btn-row{display:flex;gap:12px}
        .btn-legal,.btn-illegal{flex:1;padding:16px;border:2px solid;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
        .btn-legal{border-color:#00ff41;color:#00ff41;background:rgba(0,255,65,0.06)}.btn-legal:hover{background:rgba(0,255,65,0.15)}
        .btn-illegal{border-color:#ff5252;color:#ff5252;background:rgba(255,82,82,0.06)}.btn-illegal:hover{background:rgba(255,82,82,0.15)}
        .explain{display:none;margin-top:16px;padding:16px;border-radius:10px;font-size:14px;line-height:1.7;text-align:left}
        .explain.correct{background:rgba(0,255,65,0.1);border:1px solid rgba(0,255,65,0.3);color:#00ff41}
        .explain.wrong{background:rgba(255,82,82,0.1);border:1px solid rgba(255,82,82,0.3);color:#ff5252}
        .result-section{display:none;text-align:center}
        .r-score{font-size:64px;font-weight:900;font-family:'Fira Code',monospace}.r-grade{font-size:24px;margin-top:8px}
        .r-text{font-size:14px;color:#888;margin:16px 0;line-height:1.8}
        .retry-btn{padding:14px 40px;background:#00ff41;color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Fira Code',monospace}
        footer{text-align:center;padding:30px;color:#333;font-size:11px}
    </style>
</head>
<body>
<header><a href="../index.html">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>⚖️ Cyber Crime Quiz</h2>
        <p>Legal or illegal — can you tell the difference?</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-text" id="pt">1 / 10</div>
    <div id="quizArea"></div>
    <div id="resultArea" class="result-section"></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">Partager :</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">Copier URL</a></div>
<footer>© 2025 MOGU Guard</footer>
<script>
const QS=[
{q:"Taking a photo of the person next to you at a café — their laptop screen visible — and posting it on social media",a:"illegal",e:"This can constitute invasion of privacy and unauthorized disclosure of personal data. The screen may contain sensitive information, and photographing or sharing it without consent is illegal in most jurisdictions."},
{q:"Intercepting and reading other people's network packets on public Wi-Fi",a:"illegal",e:"Wiretapping and unauthorized interception of communications is a criminal offense under laws such as the Computer Fraud and Abuse Act (US) and similar statutes worldwide. It doesn't matter if the network is open."},
{q:"Testing a friend's computer for security vulnerabilities — with their explicit permission",a:"legal",e:"Completely legal! Real penetration testing always requires written authorization from the system owner. Consent is the key distinction between security research and criminal hacking."},
{q:"Sharing your Netflix account with a friend",a:"illegal",e:"Violation of Netflix's Terms of Service. Netflix officially banned account sharing in 2023. Strictly speaking, it breaches the service agreement — though enforcement varies by region."},
{q:"Downloading a YouTube video for personal offline viewing",a:"illegal",e:"Violation of YouTube's Terms of Service and potentially copyright law. Even for personal use, unauthorized downloading may infringe copyright depending on your country's laws."},
{q:"Reporting a phishing email received at work to your company's security team",a:"legal",e:"Completely legal — and strongly encouraged! Reporting phishing emails is a model security behavior that strengthens organizational defenses."},
{q:"Trying to guess another person's password and attempting to log in to their account",a:"illegal",e:"Unauthorized access to computer systems is a criminal offense under the Computer Fraud and Abuse Act (US), the Computer Misuse Act (UK), and equivalent laws globally. The attempt itself is illegal regardless of whether it succeeds."},
{q:"Using a free VPN to access content unavailable in your country (geo-blocked streaming)",a:"illegal",e:"Violation of the streaming service's Terms of Service. Bypassing regional restrictions breaches the service agreement, and in some countries it may also violate local regulations."},
{q:"Downloading open-source security tools such as Kali Linux",a:"legal",e:"Legal! Owning hacking tools is not itself a crime. However, using them against systems without explicit authorization is illegal — the intent and target matter."},
{q:"Bulk-buying items from an online store that accidentally listed a wrong (very low) price",a:"legal",e:"Generally legal, but civil disputes are possible. The retailer may cancel orders under a 'mutual mistake' or 'pricing error' clause. Extremely large-scale purchases made in bad faith could invite legal scrutiny."}
];

let cur=0,score=0;

function show(){
    if(cur>=QS.length){result();return;}
    document.getElementById("pf").style.width=(cur/QS.length*100)+"%";
    document.getElementById("pt").textContent=(cur+1)+" / "+QS.length;
    const q=QS[cur];
    document.getElementById("quizArea").innerHTML=`
        <div class="q-card">
            <div class="q-num">CASE ${cur+1}</div>
            <div class="q-text">${q.q}</div>
            <div class="btn-row">
                <div class="btn-legal" onclick="ans('legal')">✅ Legal</div>
                <div class="btn-illegal" onclick="ans('illegal')">🚨 Illegal</div>
            </div>
            <div class="explain" id="exp"></div>
        </div>`;
}

function ans(choice){
    const q=QS[cur];const correct=choice===q.a;if(correct)score++;
    const el=document.getElementById("exp");
    el.className="explain "+(correct?"correct":"wrong");
    el.innerHTML=`<strong>${correct?"✅ Correct!":"❌ Wrong!"}</strong> (${q.a==="illegal"?"🚨 Illegal":"✅ Legal"})<br><br>${q.e}`;
    el.style.display="block";
    document.querySelectorAll(".btn-legal,.btn-illegal").forEach(b=>{b.style.pointerEvents="none";b.style.opacity="0.5";});
    setTimeout(()=>{cur++;show();},3000);
}

function result(){
    document.getElementById("quizArea").style.display="none";
    document.getElementById("pf").style.width="100%";
    document.getElementById("pt").textContent="Done!";
    let g,c;
    if(score>=9){g="⚖️ Cyber Law Expert";c="#00ff41";}
    else if(score>=7){g="🟢 Law-Savvy Citizen";c="#00ff41";}
    else if(score>=5){g="🟡 Average... you could use a bit more knowledge";c="#ffeb3b";}
    else{g="🔴 Danger! You could become a criminal without even knowing it";c="#ff5252";}
    document.getElementById("resultArea").innerHTML=`
        <div class="r-score" style="color:${c}">${score} / ${QS.length}</div>
        <div class="r-grade" style="color:${c}">${g}</div>
        <div class="r-text">Surprised by how many things are illegal? The law applies in cyberspace too.<br>Actions you didn't think twice about can be criminal offenses — stay informed!</div>
        <button class="retry-btn" onclick="location.reload()">🔄 Try Again</button>`;
    document.getElementById("resultArea").style.display="block";
}
show();
</script>
</body>
</html>
